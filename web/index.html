<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buraco Master VIP</title>
<meta name="description" content="Buraco Master VIP — política de privacidade e exclusão de conta.">

<!--
  index.html — A RAIZ DO SITE.

  Existe por uma razao operacional: sem ela, `https://<site>/` responde 404, e
  um 404 na raiz do dominio que a Play Console vai receber como "recurso web do
  aplicativo" e a primeira coisa que um revisor ve. Uma pagina que nomeia o
  aplicativo e leva aos dois documentos custa quinze linhas e evita isso.

  NAO E UM SITE DE DIVULGACAO. Nao ha aqui promessa de recurso, preco nem data,
  porque nada disso esta decidido em lugar auditavel deste repositorio.
-->

<style>
  :root { --ouro:#efb94a; --ouro-claro:#f6e2a6; --fundo:#080503; --texto:#efe3cc; --texto-sec:#b6a884; --borda:#4a3a22; }
  body {
    margin:0; background:var(--fundo); color:var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height:1.6; display:flex; min-height:100vh; align-items:center; justify-content:center;
  }
  main { max-width:560px; padding:32px 20px; }
  h1 { color:var(--ouro-claro); font-size:1.7rem; margin:0 0 8px; }
  p { color:var(--texto-sec); }
  ul { list-style:none; padding:0; margin:26px 0 0; }
  li { margin:10px 0; }
  a { color:var(--ouro); font-weight:700; text-decoration:none; border-bottom:1px solid var(--borda); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:.85rem; color:var(--ouro-claro); }
</style>
</head>
<body>
<main>
  <h1>Buraco Master VIP</h1>
  <p>Jogo de cartas multijogador para Android.<br>
     Pacote <code>io.github.soniaambrosio.buracomastervip</code>.</p>
  <ul>
    <li><a href="/exclusao-de-conta/">Excluir minha conta e meus dados</a></li>
    <li><a href="/politica-de-privacidade/">Política de Privacidade</a></li>
  </ul>
</main>
</body>
</html>
