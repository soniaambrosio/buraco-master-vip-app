name: Aplicar orientação da mesa

on:
  push:
    branches:
      - integracao/orientacao-mesa-atualizada

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar patch auditado
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gunzip > /tmp/orientacao.patch
          git apply --check /tmp/orientacao.patch
          git apply /tmp/orientacao.patch
          git rm .github/workflows/apply-orientation-patch.yml
          git add -A
          git diff --cached --check
          git config user.name "OpenAI Integration"
          git config user.email "noreply@openai.com"
          git commit -m "feat(mesa): integrar orientação no head atualizado"
          git push origin HEAD:integracao/orientacao-mesa-atualizada
