name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      enviar_artefato:
        description: "Enviar o APK validado como artefato do run (só a proprietária pode autorizar)"
        type: boolean
        default: false
      publicar_release:
        description: "Publicar o APK validado em uma Release NOVA, com tag exclusiva, sem substituir a 'latest' (só a proprietária pode autorizar)"
        type: boolean
        default: false

# Push e merge só compilam e validam. Envio de artefato e publicação de Release
# exigem disparo manual (workflow_dispatch) pela proprietária, com a opção marcada.
# O job `build` declara o environment `apk-teste`. Com as proteções externas
# abaixo configuradas, TODA execução, inclusive a de push, aguarda a aprovação
# de soniaambrosio antes de receber a chave.
permissions:
  contents: read

# ============================================================================
# ASSINATURA FIXA DE TESTE (resolve INSTALL_FAILED_UPDATE_INCOMPATIBLE)
# - Chave de TESTE (alias bmv-test) e senhas vêm de Secrets do environment
#   `apk-teste`: BMV_TEST_KEYSTORE_B64, BMV_TEST_STORE_PASSWORD e
#   BMV_TEST_KEY_PASSWORD. Material de assinatura não se versiona.
# - PRÉ-CONDIÇÕES EXTERNAS (este YAML NÃO as configura; a proprietária configura
#   e confere em Settings > Environments e Settings > Secrets antes de cadastrar
#   qualquer chave):
#     * environment `apk-teste` com aprovação obrigatória de soniaambrosio;
#     * branches de deploy do environment restritas a `main`;
#     * Secrets BMV_TEST_* SOMENTE no environment, sem Secret de mesmo nome no
#       repositório ou na organização.
#   Sem essas proteções, a linha `environment: apk-teste` não protege a chave.
# - O certificado esperado é conferido contra vars.BMV_TEST_CERT_SHA256
#   (SHA-256 público do certificado; não é segredo).
# - Keystore e key.properties só existem durante o job e são apagados no fim,
#   inclusive após falha. Nunca vão para artefato nem para Release.
# - applicationId de teste fixo: com.buracomastervip.poc.buraco_master_vip
# - versionCode = número do run (incrementa a cada build).
# Este workflow gera APK de TESTE. Não é pacote de publicação na Play.
# ============================================================================
env:
  BMV_KEY_ALIAS: bmv-test
  BMV_APPLICATION_ID: com.buracomastervip.poc.buraco_master_vip

jobs:
  build:
    runs-on: ubuntu-latest
    # Único job que recebe a chave. A aprovação (soniaambrosio) e a restrição à
    # branch main são configuradas no environment, fora deste arquivo.
    environment: apk-teste
    outputs:
      apk_sha256: ${{ steps.assinatura.outputs.apk_sha256 }}
    steps:
      - name: "AUTORIZAÇÃO — distribuição só por disparo manual da proprietária"
        id: autorizacao
        env:
          EVENTO: ${{ github.event_name }}
          ATOR: ${{ github.triggering_actor }}
          PEDIU_ARTEFATO: ${{ inputs.enviar_artefato == true }}
          PEDIU_RELEASE: ${{ inputs.publicar_release == true }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ] && { [ "$PEDIU_ARTEFATO" = "true" ] || [ "$PEDIU_RELEASE" = "true" ]; }; then
            if [ "$ATOR" != "soniaambrosio" ]; then
              echo "ERRO: distribuição pedida por '$ATOR'. Só soniaambrosio pode autorizar."
              exit 1
            fi
            echo "distribuir=true" >> "$GITHUB_OUTPUT"
            echo "Distribuição autorizada por $ATOR."
          else
            echo "distribuir=false" >> "$GITHUB_OUTPUT"
            echo "Modo validação: compila e confere; sem artefato e sem Release."
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # PINADO: 3.44.8 é a versão que compilou verde no build #24.
          # Sem pin, o 'stable' pegava a mais recente, que ativava native-assets
          # e puxava o pacote jni 1.0.1 (build.gradle quebrado). Travar aqui
          # mantém a resolução idêntica ao #24 e o build reprodutível.
          flutter-version: 3.44.8

      - name: Scaffold Flutter project
        run: flutter create --org com.buracomastervip.poc --project-name buraco_master_vip app_build

      - name: Overlay custom UI files
        run: cp -R app/lib/. app_build/lib/

      - name: Copy sound assets (mp3 reais da Sônia)
        run: |
          mkdir -p app_build/assets/sons
          cp app/assets/sons/*.mp3 app_build/assets/sons/
          echo "sons copiados:"
          ls -l app_build/assets/sons/

      - name: Copy card deck assets (baralho de imagens da Sônia)
        run: |
          mkdir -p app_build/assets/baralho
          cp app/assets/baralho/*.webp app_build/assets/baralho/
          N=$(ls app_build/assets/baralho/ | wc -l)
          echo "cartas copiadas: $N arquivos"
          ls -l app_build/assets/baralho/ | head
          if [ "$N" -lt 55 ]; then echo "ERRO: esperava 55 cartas, veio $N"; exit 1; fi


      - name: Copy profile UI assets
        run: |
          mkdir -p app_build/assets/perfil
          cp app/assets/perfil/*.webp app_build/assets/perfil/
          N=$(ls app_build/assets/perfil/ | wc -l)
          echo "assets do perfil copiados: $N arquivos"
          if [ "$N" -lt 23 ]; then echo "ERRO: esperava 23 assets do perfil, veio $N"; exit 1; fi

      - name: Add Firebase + Google Sign-In + Audio deps
        run: cd app_build && flutter pub add firebase_core firebase_auth "google_sign_in:^6.2.1" audioplayers

      - name: Trava jni em 1.0.0 (o 1.0.1 quebrou o android/build.gradle)
        # O jni 1.0.1 (dep transitiva, puxada via native-assets) adicionou um bloco
        # `kotlin { compilerOptions {...} }` no android/build.gradle que falha com
        # "Could not find method kotlin()". O jni 1.0.0 tem build.gradle Groovy simples
        # que compila, e a API é praticamente idêntica (só structs FFI internos mudaram).
        # dependency_overrides força 1.0.0 independente de quem pede ^1.0.0.
        run: |
          cd app_build
          python3 - <<'PY'
          import re
          p = 'pubspec.yaml'
          s = open(p, encoding='utf-8').read()
          if 'dependency_overrides:' not in s:
              s = s.rstrip() + '\n\ndependency_overrides:\n  jni: 1.0.0\n'
          elif 'jni:' not in s.split('dependency_overrides:')[1].split('\n\n')[0]:
              s = s.replace('dependency_overrides:', 'dependency_overrides:\n  jni: 1.0.0', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('pubspec.yaml com dependency_overrides jni 1.0.0:')
          print(s[s.find('dependency_overrides:'):])
          PY
          flutter pub get

      - name: Bump minSdk to 23 (Firebase)
        run: |
          f=app_build/android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' "$f"
          grep -n "minSdk" "$f" || true

      - name: "PORTÃO — secrets da chave de TESTE precisam existir"
        env:
          KS_B64: ${{ secrets.BMV_TEST_KEYSTORE_B64 }}
          KS_STORE_PASS: ${{ secrets.BMV_TEST_STORE_PASSWORD }}
          KS_KEY_PASS: ${{ secrets.BMV_TEST_KEY_PASSWORD }}
        run: |
          faltou=0
          [ -n "${KS_B64:-}" ] || { echo "FALTOU o secret BMV_TEST_KEYSTORE_B64 (environment apk-teste)"; faltou=1; }
          [ -n "${KS_STORE_PASS:-}" ] || { echo "FALTOU o secret BMV_TEST_STORE_PASSWORD (environment apk-teste)"; faltou=1; }
          [ -n "${KS_KEY_PASS:-}" ] || { echo "FALTOU o secret BMV_TEST_KEY_PASSWORD (environment apk-teste)"; faltou=1; }
          [ "$faltou" = "0" ] || exit 1
          echo "Todos os secrets da chave de teste estão presentes."

      - name: Install fixed TEST keystore (assinatura estável / SHA-1 do login Google)
        env:
          KS_B64: ${{ secrets.BMV_TEST_KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 -d > app_build/android/app/buraco-master-vip-test.jks
          test -s app_build/android/app/buraco-master-vip-test.jks
          echo "keystore de teste instalado: $(stat -c%s app_build/android/app/buraco-master-vip-test.jks) bytes"

      - name: Write key.properties (senhas por Secret, nunca no repositório)
        env:
          KS_STORE_PASS: ${{ secrets.BMV_TEST_STORE_PASSWORD }}
          KS_KEY_PASS: ${{ secrets.BMV_TEST_KEY_PASSWORD }}
        run: |
          umask 077
          cat > app_build/android/key.properties <<EOF
          storeFile=${GITHUB_WORKSPACE}/app_build/android/app/buraco-master-vip-test.jks
          storePassword=${KS_STORE_PASS}
          keyAlias=${BMV_KEY_ALIAS}
          keyPassword=${KS_KEY_PASS}
          EOF
          echo "key.properties criado (senhas ocultas):"
          sed 's/Password=.*/Password=***/' app_build/android/key.properties

      - name: Patch build.gradle.kts (signingConfig 'test' + versionCode incremental)
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          p = 'app_build/android/app/build.gradle.kts'
          s = open(p, encoding='utf-8').read()
          vc = os.environ.get('VERSION_CODE', '1')

          # 1) imports no topo do arquivo
          imports = 'import java.util.Properties\nimport java.io.FileInputStream\n'
          if 'import java.util.Properties' not in s:
              s = imports + s

          # 2) carrega key.properties logo antes de `android {`
          loader = (
              'val keystoreProperties = Properties()\n'
              'val keystorePropertiesFile = rootProject.file("key.properties")\n'
              'if (keystorePropertiesFile.exists()) {\n'
              '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
              '}\n\n'
          )
          if 'val keystoreProperties' not in s:
              s = re.sub(r'\nandroid\s*\{', '\n' + loader + 'android {', s, count=1)

          # 3) signingConfigs { create("test") { ... } } logo apos `android {`
          signing = (
              '\n    signingConfigs {\n'
              '        create("test") {\n'
              '            keyAlias = keystoreProperties["keyAlias"] as String\n'
              '            keyPassword = keystoreProperties["keyPassword"] as String\n'
              '            storeFile = file(keystoreProperties["storeFile"] as String)\n'
              '            storePassword = keystoreProperties["storePassword"] as String\n'
              '        }\n'
              '    }\n'
          )
          if 'create("test")' not in s:
              s = re.sub(r'android\s*\{', 'android {' + signing, s, count=1)

          # 4) todos os buildTypes (debug e release) usam a assinatura 'test'
          novo_buildtypes = (
              '    buildTypes {\n'
              '        getByName("debug") {\n'
              '            signingConfig = signingConfigs.getByName("test")\n'
              '        }\n'
              '        getByName("release") {\n'
              '            signingConfig = signingConfigs.getByName("test")\n'
              '        }\n'
              '    }\n'
          )
          if re.search(r'buildTypes\s*\{.*?\n    \}\n', s, flags=re.DOTALL):
              s = re.sub(r'buildTypes\s*\{.*?\n    \}\n', novo_buildtypes, s, count=1, flags=re.DOTALL)
          else:
              # fallback: injeta antes do fechamento do bloco android
              s = s.rstrip()
              s = s[:s.rfind('}')] + '\n' + novo_buildtypes + '}\n'

          # 5) versionCode incremental (numero do run)
          s = re.sub(r'versionCode = flutter\.versionCode', f'versionCode = {vc}', s)
          s = re.sub(r'versionCode\s+flutter\.versionCode', f'versionCode = {vc}', s)

          open(p, 'w', encoding='utf-8').write(s)
          print("build.gradle.kts patchado. versionCode =", vc)
          print("---- trechos relevantes ----")
          for m in ['create("test")', 'signingConfig = signingConfigs.getByName("test")', f'versionCode = {vc}']:
              print("OK" if m in s else "FALTOU", '->', m)
          PY
          echo "===== build.gradle.kts final ====="
          cat app_build/android/app/build.gradle.kts

      - name: Set app display name to BMV Teste
        run: |
          sed -i 's/android:label="[^"]*"/android:label="BMV Teste"/' app_build/android/app/src/main/AndroidManifest.xml
          grep -o 'android:label="[^"]*"' app_build/android/app/src/main/AndroidManifest.xml

      - name: Desativar Impeller (renderiza webp com transparência via Skia)
        # Impeller (motor padrão do Flutter no Android) tem bug conhecido: imagens
        # WEBP com canal alfa aparecem EM BRANCO no build release, embora o resto da
        # UI funcione. Voltar pro Skia resolve e renderiza os assets do baralho.
        run: |
          python3 - <<'PY'
          p = 'app_build/android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          meta = '<meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />'
          if 'EnableImpeller' not in s:
              s = s.replace('</application>', '        ' + meta + '\n    </application>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('Impeller desativado:' , 'EnableImpeller' in s)
          PY
          grep -n "EnableImpeller" app_build/android/app/src/main/AndroidManifest.xml

      - name: Fetch logo (splash) from live app and add as asset
        run: |
          mkdir -p app_build/assets
          curl -sSL "https://soniaambrosio.github.io/buraco-master-vip/app.html" -o /tmp/app.html
          python3 - <<'PY'
          import re, base64, sys
          h = open('/tmp/app.html', encoding='utf-8', errors='ignore').read()
          i = h.find('id="splash"')
          seg = h[i:i+400000] if i >= 0 else h
          m = re.search(r"data:image/(?:jpeg|png|webp);base64,([A-Za-z0-9+/=]+)", seg)
          if not m:
              print("ERRO: nao encontrei a logo do splash no app.html"); sys.exit(1)
          data = base64.b64decode(m.group(1))
          if len(data) < 10000:
              print("ERRO: imagem extraida muito pequena (%d bytes)" % len(data)); sys.exit(1)
          open('app_build/assets/splash.jpg', 'wb').write(data)
          print("Logo extraida: %d bytes" % len(data))
          PY

      - name: Declare assets in pubspec (robusto)
        run: |
          python3 - <<'PY'
          p = 'app_build/pubspec.yaml'
          lines = open(p, encoding='utf-8').read().split('\n')
          asset_block = [
              '  assets:',
              '    - assets/splash.jpg',
              '    - assets/sons/',
              '    - assets/baralho/',
              '    - assets/perfil/',
          ]
          joined = '\n'.join(lines)
          if 'assets/baralho/' not in joined:
              out = []
              injected = False
              for ln in lines:
                  out.append(ln)
                  # injeta o bloco de assets logo APÓS a linha 'flutter:' de nível 0
                  # (a única com esse texto exato; 'sdk: flutter' e '  flutter:' não batem)
                  if not injected and ln.rstrip() == 'flutter:':
                      out.extend(asset_block)
                      injected = True
              if not injected:
                  # não achou seção flutter: -> cria uma no fim
                  out.extend(['flutter:', '  uses-material-design: true'] + asset_block)
              lines = out
          s = '\n'.join(lines)
          open(p, 'w', encoding='utf-8').write(s)
          print('----- pubspec.yaml (a partir de flutter:) -----')
          print(s[s.find('\nflutter:'):] if '\nflutter:' in s else s)
          # travas de segurança: exatamente UMA seção flutter: e as 4 pastas declaradas
          top_flutter = sum(1 for l in lines if l.rstrip() == 'flutter:')
          assert top_flutter == 1, f'esperava 1 secao flutter: de nivel 0, achei {top_flutter}'
          for a in ('assets/splash.jpg', 'assets/sons/', 'assets/baralho/', 'assets/perfil/'):
              assert a in s, f'FALTOU declarar {a} no pubspec!'
          print('OK: 1 seção flutter: · splash + sons + baralho + perfil declarados')
          PY

      - name: Conferir assets que serão empacotados
        run: |
          echo "--- app_build/assets ---"; find app_build/assets -type f | sort | sed -n '1,20p'
          echo "baralho: $(ls app_build/assets/baralho | wc -l) | sons: $(ls app_build/assets/sons | wc -l) | perfil: $(ls app_build/assets/perfil | wc -l)"

      - name: Build release APK por ABI (menor; arm64 pro celular)
        run: cd app_build && flutter build apk --release --split-per-abi

      - name: Conferir baralho DENTRO do APK (prova de bundling)
        run: |
          APK=app_build/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          echo "cartas no APK: $(unzip -l "$APK" | grep -c 'assets/flutter_assets/assets/baralho/') | sons: $(unzip -l "$APK" | grep -c 'assets/flutter_assets/assets/sons/')"
          unzip -l "$APK" | grep 'assets/flutter_assets/assets/baralho/' | head -3 || true

      - name: Signing report (confirma a assinatura final)
        run: |
          cd app_build/android
          ./gradlew :app:signingReport --console=plain | tee /tmp/signingReport.txt || true
          echo "================= RESUMO DA ASSINATURA ================="
          echo "applicationId: ${BMV_APPLICATION_ID}"
          echo "versionCode:   ${{ github.run_number }}"
          echo "APK (arm64):   app_build/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          echo "--- tamanhos dos APKs por ABI ---"
          ls -lh app_build/build/app/outputs/flutter-apk/*.apk | awk '{print $9, $5}'
          echo "--- SHA-1 / SHA-256 do APK arm64 ---"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs ../build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep -iE "SHA-1|SHA-256" || true
          fi

      - name: "PORTÃO — assinatura com o certificado de TESTE esperado"
        id: assinatura
        env:
          ESPERADO: ${{ vars.BMV_TEST_CERT_SHA256 }}
        run: |
          set -euo pipefail
          ESP=$(printf '%s' "${ESPERADO:-}" | tr -d ': \r\n' | tr 'A-F' 'a-f')
          if ! printf '%s' "$ESP" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "ERRO: vars.BMV_TEST_CERT_SHA256 ausente ou fora do formato (64 hexadecimais)."
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          [ -n "$APKSIGNER" ] || { echo "ERRO: apksigner não encontrado"; exit 1; }
          shopt -s nullglob
          APKS=(app_build/build/app/outputs/flutter-apk/*.apk)
          [ "${#APKS[@]}" -gt 0 ] || { echo "ERRO: nenhum APK gerado"; exit 1; }
          for APK in "${APKS[@]}"; do
            set +e
            SAIDA=$("$APKSIGNER" verify --print-certs "$APK")
            RC=$?
            set -e
            if [ "$RC" -ne 0 ]; then echo "ERRO: apksigner falhou (rc=$RC) em $APK"; exit 1; fi
            DIGESTS=$(printf '%s\n' "$SAIDA" | sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p' | tr -d ' \r' | tr 'A-F' 'a-f')
            N=$(printf '%s\n' "$DIGESTS" | grep -c . || true)
            if [ "$N" -ne 1 ]; then echo "ERRO: esperava exatamente 1 digest SHA-256 em $APK, veio $N"; exit 1; fi
            if ! printf '%s' "$DIGESTS" | grep -Eq '^[0-9a-f]{64}$'; then echo "ERRO: digest fora do formato em $APK"; exit 1; fi
            if [ "$DIGESTS" != "$ESP" ]; then echo "ERRO: $APK assinado com certificado diferente do esperado ($DIGESTS)"; exit 1; fi
            echo "OK: $(basename "$APK") -> $DIGESTS"
          done
          ARQ=app_build/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          [ -f "$ARQ" ] || { echo "ERRO: $ARQ não encontrado"; exit 1; }
          echo "apk_sha256=$(sha256sum "$ARQ" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Limpeza do material de assinatura (sempre, inclusive após falha)
        id: limpeza
        if: always()
        run: |
          rm -f app_build/android/app/buraco-master-vip-test.jks app_build/android/key.properties
          for f in app_build/android/app/buraco-master-vip-test.jks app_build/android/key.properties; do
            if [ -e "$f" ]; then echo "ERRO: $f ainda existe"; exit 1; fi
          done
          echo "material de assinatura removido"

      - name: Upload APK artifact (somente com autorização, validação e limpeza OK)
        if: success() && steps.assinatura.outcome == 'success' && steps.limpeza.outcome == 'success' && steps.autorizacao.outputs.distribuir == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bmv-teste-apk
          path: app_build/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 7

  publicar:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publicar_release == true && github.triggering_actor == 'soniaambrosio'
    runs-on: ubuntu-latest
    # Sem environment: este job não recebe a chave. Só roda depois do `build`
    # aprovado e validado, em disparo manual da proprietária com publicar_release.
    permissions:
      contents: write
    steps:
      - name: Baixar o APK validado
        uses: actions/download-artifact@v4
        with:
          name: bmv-teste-apk

      - name: Conferir o APK recebido (mesmo arquivo validado no build)
        env:
          ESPERADO: ${{ needs.build.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          printf '%s' "${ESPERADO:-}" | grep -Eq '^[0-9a-f]{64}$' || { echo "ERRO: SHA-256 do build ausente"; exit 1; }
          OBTIDO=$(sha256sum app-arm64-v8a-release.apk | cut -d' ' -f1)
          [ "$OBTIDO" = "$ESPERADO" ] || { echo "ERRO: APK recebido difere do validado"; exit 1; }
          echo "OK: APK recebido = validado ($OBTIDO)"

      - name: Publicar APK em Release NOVA, com tag exclusiva do commit validado
        # Não apaga nem altera Releases anteriores (inclusive a `latest` antiga).
        # A nova Release não é marcada como "Latest"; a retirada da antiga e a
        # troca do link são etapas separadas, depois de validar a nova.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="apk-teste-${GITHUB_SHA}-run${GITHUB_RUN_ID}"
          # Consulta da tag: existe (rc=0) = parar; HTTP 404 confirmado = prosseguir;
          # qualquer outra falha (rede, permissão, limite, status ilegível) = parar.
          SAIDA="${RUNNER_TEMP}/consulta-tag.out"
          set +e
          gh api --include "repos/${GH_REPO}/git/ref/tags/${TAG}" >"$SAIDA" 2>"${SAIDA}.err"
          RC=$?
          set -e
          STATUS="$(head -n 1 "$SAIDA" | tr -d '\r' | awk '{print $2}')"
          if [ "$RC" -eq 0 ]; then
            echo "ERRO: a tag ${TAG} já existe; nada foi publicado."
            exit 1
          elif [ "$RC" -ne 0 ] && [ "$STATUS" = "404" ]; then
            echo "Tag ${TAG} inexistente (HTTP 404 confirmado); prosseguindo."
          else
            echo "ERRO: a consulta da tag falhou (rc=${RC}, status=${STATUS:-desconhecido}); nada foi publicado."
            exit 1
          fi
          cp app-arm64-v8a-release.apk BMV-Teste.apk
          gh release create "$TAG" BMV-Teste.apk \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "BMV Teste ${GITHUB_SHA:0:12} (run ${GITHUB_RUN_ID})" \
            --notes "APK de TESTE do Buraco Master VIP, commit ${GITHUB_SHA}, run ${GITHUB_RUN_ID}. Assinado com o certificado de teste conferido no build."
          echo "Release publicada: ${TAG}"
