name: Build APK

on:
  push:
    branches: [ main, master, codex/inicio-ui ]
  workflow_dispatch:

permissions:
  contents: write

# ============================================================================
# ASSINATURA FIXA DE TESTE (resolve INSTALL_FAILED_UPDATE_INCOMPATIBLE)
# - Keystore permanente: keystore/buraco-master-vip-test.jks.b64  (alias: bmv-test)
# - Mesma chave do debug fixo antigo -> MESMO SHA-1 -> login Google segue valendo.
# - Senhas vêm por ENV (abaixo) e viram key.properties no CI. NUNCA ficam no gradle.
# - applicationId de teste fixo: com.buracomastervip.poc.buraco_master_vip
# - versionCode = número do run (incrementa a cada build).
# Produção fica numa config SEPARADA (ver bloco comentado no fim do patch do gradle).
# ============================================================================
env:
  BMV_KEY_ALIAS: bmv-test
  BMV_STORE_PASSWORD: bmvtest2026
  BMV_KEY_PASSWORD: bmvtest2026
  BMV_APPLICATION_ID: com.buracomastervip.poc.buraco_master_vip
  # Endereço do servidor online. NÃO é segredo (é um endpoint público), mas é
  # CONFIGURAÇÃO: muda por ambiente, então não vive no código-fonte. O app
  # recebe por --dart-define e recusa endereço local ou sem TLS num release.
  # Para apontar outro host, defina a variável de repositório BMV_SERVIDOR_URL.
  BMV_SERVIDOR_URL: ${{ vars.BMV_SERVIDOR_URL || 'wss://buraco-servidor-production.up.railway.app' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # PINADO: 3.44.8 é a versão que compilou verde no build #24.
          # Sem pin, o 'stable' pegava a mais recente, que ativava native-assets
          # e puxava o pacote jni 1.0.1 (build.gradle quebrado). Travar aqui
          # mantém a resolução idêntica ao #24 e o build reprodutível.
          flutter-version: 3.44.8

      - name: Scaffold Flutter project
        run: flutter create --org com.buracomastervip.poc --project-name buraco_master_vip app_build

      - name: Overlay custom UI files
        run: cp -R app/lib/. app_build/lib/

      - name: Copy sound assets (mp3 reais da Sônia)
        run: |
          mkdir -p app_build/assets/sons
          cp app/assets/sons/*.mp3 app_build/assets/sons/
          echo "sons copiados:"
          ls -l app_build/assets/sons/

      - name: Copy card deck assets (baralho de imagens da Sônia)
        run: |
          mkdir -p app_build/assets/baralho
          cp app/assets/baralho/*.webp app_build/assets/baralho/
          N=$(ls app_build/assets/baralho/ | wc -l)
          echo "cartas copiadas: $N arquivos"
          ls -l app_build/assets/baralho/ | head
          if [ "$N" -lt 55 ]; then echo "ERRO: esperava 55 cartas, veio $N"; exit 1; fi


      - name: Copy profile UI assets
        run: |
          mkdir -p app_build/assets/perfil
          cp app/assets/perfil/*.webp app_build/assets/perfil/
          N=$(ls app_build/assets/perfil/ | wc -l)
          echo "assets do perfil copiados: $N arquivos"
          if [ "$N" -lt 23 ]; then echo "ERRO: esperava 23 assets do perfil, veio $N"; exit 1; fi

      - name: Copy ranking UI assets
        run: |
          mkdir -p app_build/assets/ranking/selos
          cp app/assets/ranking/*.webp app_build/assets/ranking/
          cp app/assets/ranking/selos/*.webp app_build/assets/ranking/selos/
          N_RAIZ=$(find app_build/assets/ranking -maxdepth 1 -type f -name '*.webp' | wc -l)
          N_SELOS=$(find app_build/assets/ranking/selos -maxdepth 1 -type f -name '*.webp' | wc -l)
          echo "assets do ranking copiados: $N_RAIZ principais + $N_SELOS selos"
          if [ "$N_RAIZ" -lt 15 ]; then echo "ERRO: esperava ao menos 15 assets principais do ranking, veio $N_RAIZ"; exit 1; fi
          if [ "$N_SELOS" -lt 10 ]; then echo "ERRO: esperava 10 selos do ranking, veio $N_SELOS"; exit 1; fi


      - name: Copy Hall dos Imortais asset
        run: |
          mkdir -p app_build/assets/hall
          cp app/assets/hall/painel_gloria.webp app_build/assets/hall/
          test -s app_build/assets/hall/painel_gloria.webp
          echo "asset do Hall copiado"

      - name: Copy home UI assets
        run: |
          mkdir -p app_build/assets/inicio
          cp app/assets/inicio/*.webp app_build/assets/inicio/
          N=$(find app_build/assets/inicio -maxdepth 1 -type f -name '*.webp' | wc -l)
          echo "assets da tela inicio copiados: $N arquivos"
          if [ "$N" -lt 11 ]; then echo "ERRO: esperava 11 assets da tela inicio, veio $N"; exit 1; fi

      - name: Copy configure table UI assets
        run: |
          mkdir -p app_build/assets/configurar_mesa
          cp app/assets/configurar_mesa/*.webp app_build/assets/configurar_mesa/
          N=$(find app_build/assets/configurar_mesa -maxdepth 1 -type f -name '*.webp' | wc -l)
          echo "assets da tela configurar mesa copiados: $N arquivos"
          if [ "$N" -lt 8 ]; then echo "ERRO: esperava 8 assets da tela configurar mesa, veio $N"; exit 1; fi

      - name: Copy loja cosmetics assets (placeholder se faltar arte)
        run: |
          mkdir -p app_build/assets/loja
          cp -r app/assets/loja/. app_build/assets/loja/ 2>/dev/null || true
          N=$(find app_build/assets/loja -type f -name '*.webp' | wc -l)
          echo "assets da loja de cosmeticos: $N arquivos (a tela usa placeholder onde faltar)"

      - name: Copy tournament cover assets (capas oficiais)
        run: |
          mkdir -p app_build/assets/torneios/capas
          cp app/assets/torneios/capas/*.png app_build/assets/torneios/capas/
          N=$(find app_build/assets/torneios/capas -maxdepth 1 -type f -name '*.png' | wc -l)
          echo "capas de torneios copiadas: $N"
          if [ "$N" -lt 5 ]; then echo "ERRO: esperava 5 capas, veio $N"; exit 1; fi

      - name: Copy tournament reward assets (coroas e selos oficiais)
        # Copia recursiva e idempotente: rodar de novo apenas sobrescreve.
        # A contagem aqui e EXATA — sobrar arquivo e tao grave quanto faltar,
        # porque o registro em app/data/torneios/assets_registry.seed.json
        # declara exatamente 7 coroas e 8 selos como `ready`.
        run: |
          mkdir -p app_build/assets/torneios/premiacao
          cp -R app/assets/torneios/premiacao/. app_build/assets/torneios/premiacao/
          N_COROAS=$(find app_build/assets/torneios/premiacao/coroas -maxdepth 1 -type f -name '*.png' | wc -l)
          N_SELOS=$(find app_build/assets/torneios/premiacao/selos -maxdepth 1 -type f -name '*.png' | wc -l)
          echo "premiacao copiada: $N_COROAS coroas + $N_SELOS selos"
          if [ "$N_COROAS" -ne 7 ]; then echo "ERRO: esperava EXATAMENTE 7 coroas, veio $N_COROAS"; exit 1; fi
          if [ "$N_SELOS" -ne 8 ]; then echo "ERRO: esperava EXATAMENTE 8 selos, veio $N_SELOS"; exit 1; fi
          ls -l app_build/assets/torneios/premiacao/coroas/ app_build/assets/torneios/premiacao/selos/

      - name: Copy VIP table preview assets
        # `mesa_vip_preview_screen.dart` carrega `fundo_preto_vip.webp` e
        # `dorso_vip.webp`. O pubspec do repositório declara a pasta; sem esta
        # cópia o build para em "unable to find directory entry".
        run: |
          mkdir -p app_build/assets/mesa_vip
          cp app/assets/mesa_vip/*.webp app_build/assets/mesa_vip/
          N=$(find app_build/assets/mesa_vip -maxdepth 1 -type f -name '*.webp' | wc -l)
          echo "assets da mesa VIP copiados: $N arquivos"
          if [ "$N" -lt 2 ]; then echo "ERRO: esperava 2 assets da mesa VIP, veio $N"; exit 1; fi

      - name: Copy Pioneiros 2026 collection assets
        # A coleção do Kit Pioneiros. São PNG grandes (~26 MB somados): é o custo
        # que o `app/pubspec.yaml` declara, e é ele que manda.
        run: |
          mkdir -p app_build/assets/colecoes/pioneiros_2026
          cp app/assets/colecoes/pioneiros_2026/*.png app_build/assets/colecoes/pioneiros_2026/
          N=$(find app_build/assets/colecoes/pioneiros_2026 -maxdepth 1 -type f -name '*.png' | wc -l)
          echo "assets da coleção Pioneiros 2026 copiados: $N arquivos"
          if [ "$N" -lt 10 ]; then echo "ERRO: esperava 10 assets da coleção, veio $N"; exit 1; fi

      - name: Copy official animated splash assets
        run: |
          mkdir -p app_build/assets/splash
          cp app/assets/splash/logo_splash_oficial.webp app_build/assets/splash/
          cp app/assets/splash/splash_intro.mp3 app_build/assets/splash/
          echo "assets da splash oficial:"
          ls -lh app_build/assets/splash/
          test -s app_build/assets/splash/logo_splash_oficial.webp
          test -s app_build/assets/splash/splash_intro.mp3

      - name: Copy Rive opening art (binário autoritativo)
        # NÃO reexportar, NÃO recomprimir: o arquivo tem de chegar ao APK igual
        # ao aprovado. Tamanho e SHA-256 são conferidos aqui e OUTRA VEZ dentro
        # do portão da abertura, que lê pelo bundle do Flutter — é a diferença
        # entre "o arquivo está no disco" e "o arquivo está no aplicativo".
        run: |
          mkdir -p app_build/assets/rive
          cp app/assets/rive/splash_constelacao_master_vip_v2.riv app_build/assets/rive/
          ARQ=app_build/assets/rive/splash_constelacao_master_vip_v2.riv
          TAM=$(wc -c < "$ARQ")
          SHA=$(sha256sum "$ARQ" | cut -d' ' -f1)
          CAB=$(head -c 4 "$ARQ")
          echo "abertura: $TAM bytes | sha256 $SHA | cabecalho $CAB"
          test "$TAM" = "2298957" || { echo "ERRO: tamanho divergente ($TAM)"; exit 1; }
          test "$SHA" = "a5a7ca1912de6f301b8a5c022151c7f14d6ae07228fa9c9dd49076fb2ea4d67d" || { echo "ERRO: SHA-256 divergente"; exit 1; }
          test "$CAB" = "RIVE" || { echo "ERRO: cabeçalho divergente"; exit 1; }
          # A constelação: segundo asset visual autoritativo. Ela está fora do
          # .riv porque não entra na exportação da timeline, e entra como camada
          # vetorial por cima. Mesma pasta, mesma declaração de pubspec.
          cp app/assets/rive/constelacao_dourada_master_vip.svg app_build/assets/rive/
          SVG=app_build/assets/rive/constelacao_dourada_master_vip.svg
          TAM_SVG=$(wc -c < "$SVG")
          SHA_SVG=$(sha256sum "$SVG" | cut -d' ' -f1)
          echo "constelacao: $TAM_SVG bytes | sha256 $SHA_SVG"
          test "$TAM_SVG" = "4663" || { echo "ERRO: tamanho do SVG divergente ($TAM_SVG)"; exit 1; }
          test "$SHA_SVG" = "a87fc5ad2d25fef715d9db7556575b96cd180d99eebaac113607f3abcffc0204" || { echo "ERRO: SHA-256 do SVG divergente"; exit 1; }
          grep -q 'viewBox="0 0 1080 1920"' "$SVG" || { echo "ERRO: o SVG saiu da area de referencia 1080x1920"; exit 1; }

      - name: Dependências versionadas (pubspec.yaml + pubspec.lock do repositório)
        # ANTES daqui havia uma lista DIGITADA de pacotes em dois `flutter pub add`
        # e um remendo Python que travava o jni. Os três sumiram: `app/pubspec.yaml`
        # e `app/pubspec.lock` passam a ser a fonte da verdade, exatamente como já
        # é feito no `ci-os-integracao.yml` — que por isso nunca sofreu deste mal.
        #
        # A lista digitada não era um esquecimento, era um defeito estrutural: um
        # pacote novo no repositório só chegava ao APK se alguém lembrasse de
        # editar TAMBÉM este arquivo. Foi assim que `cloud_firestore`,
        # `cloud_functions` e `firebase_app_check` ficaram de fora e o APK deixou
        # de sair por esta esteira ("FirebaseFunctions isn't defined").
        #
        # O `pubspec.lock` do repositório entra junto porque sem ele dois builds
        # do MESMO commit podem resolver versões diferentes de pacote.
        #
        # O `dependency_overrides` do jni 1.0.0 continua valendo: ele mora no
        # `app/pubspec.yaml` e chega aqui pela cópia.
        run: |
          cp app/pubspec.yaml app/pubspec.lock app_build/
          cd app_build && flutter pub get

      - name: "PORTÃO DE DEPENDÊNCIAS — a árvore resolvida é a que o repositório declara"
        # A trava que impede o defeito de voltar: cada pacote declarado em
        # app/pubspec.yaml tem de aparecer resolvido no package_config.json do
        # scaffold. Não há lista digitada aqui — a lista é lida do repositório.
        run: |
          lista() {
            awk -v bloco="$2" '
              $0 ~ "^" bloco ":"            { dentro = 1; next }
              /^[A-Za-z_]/                  { dentro = 0 }
              dentro && /^  [A-Za-z0-9_]+:/ { sub(/:.*/, ""); gsub(/ /, ""); print }
            ' "$1"
          }
          CFG=app_build/.dart_tool/package_config.json
          test -f "$CFG" || { echo "ERRO: $CFG nao existe — o pub get nao rodou"; exit 1; }
          FALTOU=0
          for BLOCO in dependencies dev_dependencies dependency_overrides; do
            for PKG in $(lista app/pubspec.yaml "$BLOCO"); do
              if grep -q "\"name\": \"$PKG\"" "$CFG"; then
                echo "  ok      $BLOCO/$PKG"
              else
                echo "  FALTOU  $BLOCO/$PKG"
                FALTOU=1
              fi
            done
          done
          if [ "$FALTOU" -ne 0 ]; then
            echo "ERRO: a árvore resolvida não contém tudo que app/pubspec.yaml declara."
            exit 1
          fi
          echo "PORTÃO VERDE: toda dependência declarada no repositório está resolvida no scaffold."

      - name: "PORTÃO DE ASSETS — toda pasta declarada existe e não está vazia"
        # O irmão do portão acima, para o outro lado do mesmo problema. O
        # app/pubspec.yaml declara as pastas de asset; os passos de cópia acima as
        # preenchem. Se as duas listas divergirem, o Flutter não reprova a
        # compilação — asset que falta vira erro só quando alguém abre a tela.
        # Aqui a divergência quebra o build, que é onde ela custa barato.
        run: |
          DECLARADAS=$(awk '
            /^flutter:/                  { dentro = 1; next }
            /^[A-Za-z_]/                 { dentro = 0 }
            dentro && /^ *- *assets\//   { sub(/^ *- */, ""); print }
          ' app_build/pubspec.yaml)
          test -n "$DECLARADAS" || { echo "ERRO: o pubspec do scaffold não declara asset nenhum"; exit 1; }
          FALTOU=0
          for D in $DECLARADAS; do
            N=$(find "app_build/$D" -maxdepth 1 -type f 2>/dev/null | wc -l)
            if [ "$N" -gt 0 ]; then
              echo "  ok      $D ($N arquivos)"
            else
              echo "  VAZIA   $D"
              FALTOU=1
            fi
          done
          if [ "$FALTOU" -ne 0 ]; then
            echo "ERRO: há pasta declarada no pubspec que não foi copiada para o scaffold."
            exit 1
          fi
          echo "PORTÃO VERDE: toda pasta de asset declarada existe e tem conteúdo."

      - name: "PORTÃO DE QUALIDADE — testes do motor (bloqueia o APK se falhar)"
        run: |
          if [ ! -f app/test/teste_motor.dart ]; then
            echo "ERRO: app/test/teste_motor.dart não encontrado — o portão de qualidade é OBRIGATÓRIO."
            echo "Nenhum APK pode ser gerado sem a suíte de testes do motor."
            exit 1
          fi
          mkdir -p app_build/test
          cp app/test/teste_motor.dart app_build/test/
          echo "================= REGISTRO DO PORTÃO ================="
          echo "Commit testado (GITHUB_SHA): ${GITHUB_SHA}"
          echo "SHA-256 do motor testado (código REAL de produção):"
          sha256sum app_build/lib/mesa.dart
          echo "SHA-256 da suíte executada:"
          sha256sum app_build/test/teste_motor.dart
          echo "======================================================"
          cd app_build
          flutter test test/teste_motor.dart --reporter expanded
          echo "PORTÃO VERDE: todos os testes do motor passaram no commit ${GITHUB_SHA} — seguindo pro APK."

      - name: "PORTÃO DE QUALIDADE — resiliência do motor (snapshot, idempotência, reconexão)"
        # Segundo portão, irmão do de cima. O primeiro prova que as REGRAS estão
        # certas; este prova que elas continuam certas quando a rede está errada:
        # comando repetido, dois jogadores ao mesmo tempo, queda no meio da
        # jogada, volta com estado velho, app em segundo plano.
        # Roda SOMENTE este arquivo — o widget_test.dart do `flutter create` tem
        # erro pré-existente e derrubaria a suíte inteira.
        run: |
          if [ ! -f app/test/teste_motor_resiliencia.dart ]; then
            echo "ERRO: app/test/teste_motor_resiliencia.dart não encontrado — o portão de resiliência é OBRIGATÓRIO."
            exit 1
          fi
          if [ ! -d app_build/lib/motor ]; then
            echo "ERRO: app_build/lib/motor não foi copiado — o overlay de lib/ falhou."
            exit 1
          fi
          mkdir -p app_build/test
          cp app/test/teste_motor_resiliencia.dart app_build/test/
          echo "============ REGISTRO DO PORTÃO DE RESILIÊNCIA ============"
          echo "Commit testado (GITHUB_SHA): ${GITHUB_SHA}"
          echo "SHA-256 da camada de resiliência (código REAL de produção):"
          sha256sum app_build/lib/motor/*.dart
          echo "SHA-256 da suíte executada:"
          sha256sum app_build/test/teste_motor_resiliencia.dart
          echo "=========================================================="
          cd app_build
          flutter test test/teste_motor_resiliencia.dart --reporter expanded
          echo "PORTÃO VERDE: resiliência validada no commit ${GITHUB_SHA}."

      - name: "PORTÃO DE QUALIDADE — domínio de recompensas de torneios"
        # Roda SOMENTE este arquivo. O test/widget_test.dart que vem do
        # `flutter create` tem erro pré-existente e derrubaria a suíte inteira,
        # então não se usa `flutter test` sem alvo aqui.
        run: |
          if [ ! -f app/test/torneios/reward_grants_test.dart ]; then
            echo "ERRO: app/test/torneios/reward_grants_test.dart não encontrado — o portão do domínio é OBRIGATÓRIO."
            exit 1
          fi
          mkdir -p app_build/test/torneios/data
          cp app/test/torneios/reward_grants_test.dart app_build/test/torneios/
          cp app/data/torneios/assets_registry.seed.json app_build/test/torneios/data/
          cp app/data/torneios/reward_policies.seed.json app_build/test/torneios/data/
          echo "seeds disponíveis para o teste:"
          ls -l app_build/test/torneios/data/
          cd app_build
          flutter test test/torneios/reward_grants_test.dart --reporter expanded
          echo "PORTÃO VERDE: domínio de recompensas de torneios validado no commit ${GITHUB_SHA}."

      - name: "PORTÃO DE SEGURANÇA — identidade da conexão online"
        # Prova que o app NÃO declara quem é: pega a credencial antes de abrir o
        # socket, manda a autenticação como primeira mensagem, segura a fila até
        # o servidor aceitar, reautentica na reconexão e não vaza o token.
        # É o portão que impede alguém reintroduzir `jogadorId` saindo do app.
        run: |
          if [ ! -f app/test/online_auth_test.dart ]; then
            echo "ERRO: app/test/online_auth_test.dart não encontrado — o portão de identidade é OBRIGATÓRIO."
            exit 1
          fi
          cp app/test/online_auth_test.dart app_build/test/
          cd app_build
          flutter test test/online_auth_test.dart --reporter expanded
          echo "PORTÃO VERDE: identidade da conexão online validada no commit ${GITHUB_SHA}."

      - name: "PORTÃO DE SEGURANÇA — sessão canônica do jogador (união sessão × transporte)"
        # Portão da BASE desta integração. Prova que existe UM dono de sessão e
        # de credencial: a `SessaoDoJogador` acima do MaterialApp, o
        # `EscopoSessao` na árvore e a `PonteSessaoOnline` traduzindo troca de
        # conta em UMA transição do transporte. É o portão que impede alguém
        # reintroduzir um segundo dono de autenticação — inclusive um vigia de
        # `authStateChanges()` dentro de uma tela.
        run: |
          if [ ! -d app/test/sessao ]; then
            echo "ERRO: app/test/sessao não encontrado — o portão da sessão canônica é OBRIGATÓRIO."
            exit 1
          fi
          if [ ! -f app/test/sessao/uniao_sessao_transporte_test.dart ]; then
            echo "ERRO: uniao_sessao_transporte_test.dart não encontrado — é ele que prova a UNIÃO."
            exit 1
          fi
          mkdir -p app_build/test/sessao
          cp -R app/test/sessao/. app_build/test/sessao/
          cd app_build
          flutter test test/sessao --reporter expanded
          echo "PORTÃO VERDE: sessão canônica validada no commit ${GITHUB_SHA}."

      - name: "PORTÃO DE PRODUÇÃO — casca real (roteamento, mocks, dados pessoais)"
        # Prova que o APK não abre numa bancada de prévias: partida fria decide
        # entre Login e Home pela sessão, o logout derruba socket e pilha de
        # navegação, a Home não recebe VM.mock() e nenhuma rota que nasce em
        # main() alcança maquete. Inclui a auditoria estrutural, que é o que
        # impede um segundo dono de autenticação de voltar e um dado pessoal
        # real de reentrar no código distribuído.
        run: |
          if [ ! -d app/test/casca ]; then
            echo "ERRO: app/test/casca não encontrado — o portão da casca é OBRIGATÓRIO."
            exit 1
          fi
          if [ ! -f app/test/casca/auditoria_casca_test.dart ]; then
            echo "ERRO: auditoria_casca_test.dart não encontrado — é ela que prova a AUSÊNCIA."
            exit 1
          fi
          mkdir -p app_build/test/casca
          cp -R app/test/casca/. app_build/test/casca/
          cd app_build
          flutter test test/casca --reporter expanded
          echo "PORTÃO VERDE: casca de produção validada no commit ${GITHUB_SHA}."

      - name: "PORTÃO DE SEGURANÇA — conexão publicável (endereço, sessão, vazamento)"
        # Prova o que falta para o app publicado manter a sessão real: endereço
        # validado por perfil de build, protocolo 2 no handshake, renovação de
        # credencial sem tempestade, reconexão com teto, socket sem órfão,
        # mensagem de sessão antiga descartada e segredo nenhum vazando.
        run: |
          if [ ! -f app/test/conexao_producao_test.dart ]; then
            echo "ERRO: app/test/conexao_producao_test.dart não encontrado — o portão da conexão é OBRIGATÓRIO."
            exit 1
          fi
          cp app/test/conexao_producao_test.dart app_build/test/
          cd app_build
          flutter test test/conexao_producao_test.dart --reporter expanded
          echo "PORTÃO VERDE: conexão publicável validada no commit ${GITHUB_SHA}."

      - name: "PORTÃO DE CONFIGURAÇÃO — endereço do servidor deste build"
        # O app recusa endereço ruim em tempo de execução, mas descobrir isso no
        # celular de quem instalou é tarde demais. Aqui a mesma regra roda ANTES
        # de gerar o APK, para o build quebrar em vez de sair um artefato que
        # não consegue conectar.
        run: |
          URL="${BMV_SERVIDOR_URL}"
          if [ -z "$URL" ]; then
            echo "ERRO: BMV_SERVIDOR_URL está vazio — o APK sairia sem servidor."
            exit 1
          fi
          case "$URL" in
            wss://*|https://*) ;;
            *) echo "ERRO: o endereço precisa ser wss:// ou https:// — veio '$URL'"; exit 1 ;;
          esac
          case "$URL" in
            *localhost*|*127.0.0.1*|*0.0.0.0*|*10.0.2.2*|*10.0.3.2*|*.local|*.local/*)
              echo "ERRO: '$URL' é endereço local — não existe fora da máquina de desenvolvimento"; exit 1 ;;
          esac
          case "$URL" in
            *\?*|*@*) echo "ERRO: o endereço não pode carregar parâmetros nem credencial"; exit 1 ;;
          esac
          echo "endereço do servidor validado para este build: $URL"

      - name: "PORTÃO DE QUALIDADE — análise estática (erro é fatal)"
        # Roda DEPOIS dos portões de teste, porque são eles que copiam as suítes
        # para dentro do app_build — analisar antes cobriria só `lib/`.
        #
        # `--no-fatal-infos --no-fatal-warnings` é a mesma forma canônica do
        # `ci-os-integracao.yml`: a árvore carrega infos de depreciação
        # pré-existentes (withOpacity, activeColor…), e transformá-las em portão
        # aqui reprovaria o APK por dívida que esta OS não abriu. ERRO continua
        # fatal, que é o que este portão existe para pegar.
        run: |
          cd app_build
          # O widget_test.dart do scaffold do `flutter create` tem erro
          # pré-existente conhecido e não é código nosso.
          rm -f test/widget_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings lib test
          echo "PORTÃO VERDE: análise estática sem erros no commit ${GITHUB_SHA}."

      - name: Bump minSdk to 23 (Firebase)
        run: |
          f=app_build/android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' "$f"
          grep -n "minSdk" "$f" || true

      - name: Install fixed TEST keystore (assinatura estável / SHA-1 do login Google)
        run: |
          base64 -d keystore/buraco-master-vip-test.jks.b64 > app_build/android/app/buraco-master-vip-test.jks
          echo "keystore de teste instalado: $(ls -l app_build/android/app/buraco-master-vip-test.jks | awk '{print $5}') bytes"

      - name: Write key.properties (senhas por ENV, nunca no build.gradle)
        run: |
          cat > app_build/android/key.properties <<EOF
          storeFile=${GITHUB_WORKSPACE}/app_build/android/app/buraco-master-vip-test.jks
          storePassword=${BMV_STORE_PASSWORD}
          keyAlias=${BMV_KEY_ALIAS}
          keyPassword=${BMV_KEY_PASSWORD}
          EOF
          echo "key.properties criado (senhas ocultas):"
          sed 's/Password=.*/Password=***/' app_build/android/key.properties

      - name: Patch build.gradle.kts (signingConfig 'test' + versionCode incremental)
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          p = 'app_build/android/app/build.gradle.kts'
          s = open(p, encoding='utf-8').read()
          vc = os.environ.get('VERSION_CODE', '1')

          # 1) imports no topo do arquivo
          imports = 'import java.util.Properties\nimport java.io.FileInputStream\n'
          if 'import java.util.Properties' not in s:
              s = imports + s

          # 2) carrega key.properties logo antes de `android {`
          loader = (
              'val keystoreProperties = Properties()\n'
              'val keystorePropertiesFile = rootProject.file("key.properties")\n'
              'if (keystorePropertiesFile.exists()) {\n'
              '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
              '}\n\n'
          )
          if 'val keystoreProperties' not in s:
              s = re.sub(r'\nandroid\s*\{', '\n' + loader + 'android {', s, count=1)

          # 3) signingConfigs { create("test") { ... } } logo apos `android {`
          signing = (
              '\n    signingConfigs {\n'
              '        create("test") {\n'
              '            keyAlias = keystoreProperties["keyAlias"] as String\n'
              '            keyPassword = keystoreProperties["keyPassword"] as String\n'
              '            storeFile = file(keystoreProperties["storeFile"] as String)\n'
              '            storePassword = keystoreProperties["storePassword"] as String\n'
              '        }\n'
              '    }\n'
          )
          if 'create("test")' not in s:
              s = re.sub(r'android\s*\{', 'android {' + signing, s, count=1)

          # 4) todos os buildTypes (debug e release) usam a assinatura 'test'
          novo_buildtypes = (
              '    buildTypes {\n'
              '        getByName("debug") {\n'
              '            signingConfig = signingConfigs.getByName("test")\n'
              '        }\n'
              '        getByName("release") {\n'
              '            signingConfig = signingConfigs.getByName("test")\n'
              '        }\n'
              '    }\n'
          )
          if re.search(r'buildTypes\s*\{.*?\n    \}\n', s, flags=re.DOTALL):
              s = re.sub(r'buildTypes\s*\{.*?\n    \}\n', novo_buildtypes, s, count=1, flags=re.DOTALL)
          else:
              # fallback: injeta antes do fechamento do bloco android
              s = s.rstrip()
              s = s[:s.rfind('}')] + '\n' + novo_buildtypes + '}\n'

          # 5) versionCode incremental (numero do run)
          s = re.sub(r'versionCode = flutter\.versionCode', f'versionCode = {vc}', s)
          s = re.sub(r'versionCode\s+flutter\.versionCode', f'versionCode = {vc}', s)

          open(p, 'w', encoding='utf-8').write(s)
          print("build.gradle.kts patchado. versionCode =", vc)
          print("---- trechos relevantes ----")
          for m in ['create("test")', 'signingConfig = signingConfigs.getByName("test")', f'versionCode = {vc}']:
              print("OK" if m in s else "FALTOU", '->', m)
          PY
          echo "===== build.gradle.kts final ====="
          cat app_build/android/app/build.gradle.kts

      - name: Set app display name to BMV Teste
        run: |
          sed -i 's/android:label="[^"]*"/android:label="BMV Teste"/' app_build/android/app/src/main/AndroidManifest.xml
          grep -o 'android:label="[^"]*"' app_build/android/app/src/main/AndroidManifest.xml

      - name: Desativar Impeller (renderiza webp com transparência via Skia)
        # Impeller (motor padrão do Flutter no Android) tem bug conhecido: imagens
        # WEBP com canal alfa aparecem EM BRANCO no build release, embora o resto da
        # UI funcione. Voltar pro Skia resolve e renderiza os assets do baralho.
        run: |
          python3 - <<'PY'
          p = 'app_build/android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          meta = '<meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />'
          if 'EnableImpeller' not in s:
              s = s.replace('</application>', '        ' + meta + '\n    </application>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('Impeller desativado:' , 'EnableImpeller' in s)
          PY
          grep -n "EnableImpeller" app_build/android/app/src/main/AndroidManifest.xml

      - name: Configure dark native launch screen
        # A COR É A DA ARTE, e é isso que elimina o piscar: o Android pinta esta
        # tela antes de existir engine de Flutter, e o primeiro quadro do
        # Flutter é a abertura, com o mesmo `#050B1E`. Duas cores diferentes
        # aqui viram um lampejo visível em todo cold start.
        #
        # O mecanismo nativo continua o mesmo — `launch_background` em
        # `drawable/` e `drawable-v21/`, cobrindo Android 12+ e anteriores. Só
        # o VALOR mudou.
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('app_build/android/app/src/main/res')
          color = '#050B1E'
          for rel in ['values/colors.xml', 'values-night/colors.xml']:
              p = root / rel
              p.parent.mkdir(parents=True, exist_ok=True)
              if p.exists():
                  s = p.read_text(encoding='utf-8')
                  if 'splash_background' not in s:
                      s = s.replace('</resources>', f'    <color name="splash_background">{color}</color>\n</resources>')
              else:
                  s = f'<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="splash_background">{color}</color>\n</resources>\n'
              p.write_text(s, encoding='utf-8')

          for rel in ['drawable/launch_background.xml', 'drawable-v21/launch_background.xml']:
              p = root / rel
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/splash_background" />
          </layer-list>
          ''', encoding='utf-8')
          # A trava que impede as duas cores divergirem em silêncio: o valor
          # nativo tem de ser o mesmo `kFundoDaAbertura` do contrato da abertura.
          contrato = Path('app_build/lib/casca/splash/contrato_da_abertura.dart').read_text(encoding='utf-8')
          esperado = 'Color(0x' + 'FF' + color[1:].upper() + ')'
          assert esperado in contrato, (
              'a cor da tela nativa (%s) nao e a do contrato da abertura: '
              'esperava encontrar %s em contrato_da_abertura.dart' % (color, esperado)
          )
          print('Native launch screen configurada em %s, igual ao contrato da abertura.' % color)
          PY

      - name: "MARCA NATIVA — ícone oficial e starting window do Android 12+"
        # O QUE ESTE PASSO CONSERTA: o `flutter create` entrega cinco bitmaps
        # `mipmap-*/ic_launcher.png` com o logotipo do Flutter, e mais nada — sem
        # ícone adaptativo e sem `values-v31`. No Android 12+ o sistema desenha a
        # starting window a partir do ÍCONE DO APLICATIVO, então esse logotipo
        # aparecia em todo cold start, no fundo certo e com a marca errada.
        #
        # A arte é a oficial já publicada na Play (`branding/fonte/`), e todos os
        # recursos derivados são COMMITADOS, não gerados aqui: gerar no CI exigiria
        # decodificador de imagem e tornaria o resultado dependente da versão da
        # ferramenta. Commitado + `sha256sum -c` é o que dá prova byte a byte.
        #
        # `values-v31` também deixa de ser opcional: sem ele o sistema infere a
        # janela de partida do ícone adaptativo, e a heurística dessa inferência
        # MUDA entre a API 31 e a 36. Declarar `windowSplashScreenAnimatedIcon`
        # tira a inferência do caminho e faz as duas versões desenharem o mesmo.
        run: |
          set -e
          cd branding && sha256sum -c MANIFESTO.sha256 > /tmp/marca.txt && cd ..
          echo "recursos de marca conferidos: $(grep -c ': OK' /tmp/marca.txt) arquivos"

          RES=app_build/android/app/src/main/res

          # A cor da janela de partida é escrita pelo passo anterior e é a MESMA
          # referenciada pelo ícone adaptativo e pelo tema v31. Se ela sumir, o
          # aapt falharia lá na frente com um erro de link difícil de ligar aqui.
          grep -q 'name="splash_background"' "$RES/values/colors.xml" \
            || { echo "ERRO: @color/splash_background não existe; rode antes 'Configure dark native launch screen'"; exit 1; }

          ANTES=$(sha256sum "$RES/mipmap-xxxhdpi/ic_launcher.png" | cut -d' ' -f1)
          cp -R branding/android/res/. "$RES"/
          DEPOIS=$(sha256sum "$RES/mipmap-xxxhdpi/ic_launcher.png" | cut -d' ' -f1)
          test "$ANTES" != "$DEPOIS" \
            || { echo "ERRO: o ic_launcher do scaffold NÃO foi substituído"; exit 1; }

          # Trava fail-closed: os cinco bitmaps do Flutter 3.44.8, por SHA-256.
          # Se o pin do Flutter subir e o template mudar de arte, esta lista para
          # de casar — e aí a trava do tamanho abaixo é quem segura.
          PADROES="c7c0c0189145e4e32a401c61c9bdc615754b0264e7afae24e834bb81049eaf81
          6a7c8f0d703e3682108f9662f813302236240d3f8f638bb391e32bfb96055fef
          e14aa40904929bf313fded22cf7e7ffcbf1d1aac4263b5ef1be8bfce650397aa
          4d470bf22d5c17d84edc5f82516d1ba8a1c09559cd761cefb792f86d9f52b540
          3c34e1f298d0c9ea3455d46db6b7759c8211a49e9ec6e44b635fc5c87dfb4180"
          for f in "$RES"/mipmap-*dpi/ic_launcher.png; do
            H=$(sha256sum "$f" | cut -d' ' -f1)
            if echo "$PADROES" | tr -d ' ' | grep -qx "$H"; then
              echo "ERRO: $f ainda é o ícone padrão do Flutter"; exit 1
            fi
            # A arte oficial é ilustração; o padrão do Flutter é um logotipo
            # chapado de 1,4 kB. Ordem de grandeza separa os dois mesmo que a
            # lista de SHA envelheça com o pin do Flutter.
            T=$(wc -c < "$f")
            test "$T" -gt 3000 || { echo "ERRO: $f tem só $T bytes — não é a arte oficial"; exit 1; }
          done

          echo "--- recursos de marca instalados ---"
          find "$RES" -name 'ic_launcher*' -o -name 'splash_icon*' -o -name 'styles.xml' | sort
          echo "--- tema da janela de partida (API 31+) ---"
          cat "$RES/values-v31/styles.xml"

      - name: Conferir assets que serão empacotados
        run: |
          echo "--- app_build/assets ---"; find app_build/assets -type f | sort | sed -n '1,20p'
          echo "baralho: $(find app_build/assets/baralho -maxdepth 1 -type f | wc -l) | sons: $(find app_build/assets/sons -maxdepth 1 -type f | wc -l) | perfil: $(find app_build/assets/perfil -maxdepth 1 -type f | wc -l) | ranking principais: $(find app_build/assets/ranking -maxdepth 1 -type f | wc -l) | selos: $(find app_build/assets/ranking/selos -maxdepth 1 -type f | wc -l) | hall: $(find app_build/assets/hall -maxdepth 1 -type f | wc -l) | inicio: $(find app_build/assets/inicio -maxdepth 1 -type f | wc -l) | configurar mesa: $(find app_build/assets/configurar_mesa -maxdepth 1 -type f | wc -l)"

      - name: "PORTÃO DA ABERTURA — splash Rive (binário, portão duplo, layout)"
        # RODA AQUI, e não junto dos outros portões, por uma razão de ordem: os
        # portões de cima acontecem ANTES de os assets serem copiados e
        # declarados no pubspec, e metade desta suíte lê o `.riv` PELO BUNDLE do
        # Flutter. Antes deste ponto ela provaria o arquivo no disco, que é
        # outra coisa — e é justamente a diferença que já fez arte sumir de APK.
        #
        # Prova: tamanho, cabeçalho e SHA-256 do binário empacotado; que os
        # nomes `SplashConstelacao` e `entrada_splash` existem dentro dele e são
        # as constantes do código; que a saída exige animação encerrada E
        # bootstrap pronto; que arte quebrada não aprisiona ninguém e não
        # mascara sessão que não respondeu.
        run: |
          if [ ! -f app/test/splash/splash_constelacao_test.dart ]; then
            echo "ERRO: app/test/splash/splash_constelacao_test.dart não encontrado — o portão da abertura é OBRIGATÓRIO."
            exit 1
          fi
          mkdir -p app_build/test/splash app_build/test/casca
          cp -R app/test/splash/. app_build/test/splash/
          # A suíte usa o dublê da arte e a bancada de sessão, que moram junto
          # dos testes da casca.
          cp app/test/casca/abertura_falsa.dart app_build/test/casca/
          cp app/test/casca/bancada_online.dart app_build/test/casca/
          echo "============ REGISTRO DO PORTÃO DA ABERTURA ============"
          echo "Commit testado (GITHUB_SHA): ${GITHUB_SHA}"
          echo "SHA-256 do .riv que será empacotado:"
          sha256sum app_build/assets/rive/splash_constelacao_master_vip_v2.riv
          echo "========================================================"
          cd app_build
          flutter test test/splash --reporter expanded
          echo "PORTÃO VERDE: abertura em Rive validada no commit ${GITHUB_SHA}."

      - name: Build release APK por ABI (menor; arm64 pro celular)
        # O endereço do servidor entra AQUI, pela configuração do build. Sem
        # este --dart-define o app sai sem endpoint e o online não sobe — de
        # propósito: é melhor falhar claro do que embutir endereço no código.
        run: |
          cd app_build
          flutter build apk --release --split-per-abi \
            --dart-define=BMV_SERVIDOR_URL="${BMV_SERVIDOR_URL}"

      - name: Conferir baralho DENTRO do APK (prova de bundling)
        run: |
          APK=app_build/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          echo "cartas no APK: $(unzip -l "$APK" | grep -c 'assets/flutter_assets/assets/baralho/') | sons: $(unzip -l "$APK" | grep -c 'assets/flutter_assets/assets/sons/') | perfil: $(unzip -l "$APK" | grep -c 'assets/flutter_assets/assets/perfil/') | ranking total: $(unzip -l "$APK" | grep -c 'assets/flutter_assets/assets/ranking/') | selos: $(unzip -l "$APK" | grep -c 'assets/flutter_assets/assets/ranking/selos/') | hall: $(unzip -l "$APK" | grep -c 'assets/flutter_assets/assets/hall/') | inicio: $(unzip -l "$APK" | grep -c 'assets/flutter_assets/assets/inicio/') | configurar mesa: $(unzip -l "$APK" | grep -c 'assets/flutter_assets/assets/configurar_mesa/')"
          unzip -l "$APK" | grep 'assets/flutter_assets/assets/baralho/' | head -3 || true
          unzip -l "$APK" | grep 'assets/flutter_assets/assets/ranking/' | head -3 || true
          unzip -l "$APK" | grep 'assets/flutter_assets/assets/inicio/' | head -3 || true
          unzip -l "$APK" | grep 'assets/flutter_assets/assets/configurar_mesa/' | head -3 || true

      - name: Conferir a abertura DENTRO do APK (bytes, não presença)
        # A prova que fecha o ciclo: o arquivo é EXTRAÍDO do APK assinado e o
        # SHA-256 é conferido ali. "Aparece na listagem" não prova nada sobre o
        # conteúdo — um asset truncado ou reempacotado aparece igualzinho.
        #
        # É também aqui que se prova que a abertura roda OFFLINE: se o binário
        # está dentro do APK, não há requisição a fazer no cold start.
        run: |
          APK=app_build/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          unzip -p "$APK" assets/flutter_assets/assets/rive/splash_constelacao_master_vip_v2.riv > /tmp/abertura.riv
          TAM=$(wc -c < /tmp/abertura.riv)
          SHA=$(sha256sum /tmp/abertura.riv | cut -d' ' -f1)
          echo "abertura no APK: $TAM bytes | sha256 $SHA"
          test "$TAM" = "2298957" || { echo "ERRO: o .riv dentro do APK tem tamanho divergente ($TAM)"; exit 1; }
          test "$SHA" = "a5a7ca1912de6f301b8a5c022151c7f14d6ae07228fa9c9dd49076fb2ea4d67d" || { echo "ERRO: o .riv dentro do APK não é o binário aprovado"; exit 1; }
          unzip -p "$APK" assets/flutter_assets/assets/rive/constelacao_dourada_master_vip.svg > /tmp/constelacao.svg
          TAM_SVG=$(wc -c < /tmp/constelacao.svg)
          SHA_SVG=$(sha256sum /tmp/constelacao.svg | cut -d' ' -f1)
          echo "constelacao no APK: $TAM_SVG bytes | sha256 $SHA_SVG"
          test "$SHA_SVG" = "a87fc5ad2d25fef715d9db7556575b96cd180d99eebaac113607f3abcffc0204" || { echo "ERRO: o SVG dentro do APK não é o aprovado"; exit 1; }
          echo "as libs nativas da Rive que foram empacotadas:"
          unzip -l "$APK" | grep -i 'rive' || { echo "ERRO: nenhuma biblioteca nativa da Rive no APK — a animação não teria como rodar"; exit 1; }


      - name: "PORTÃO DA MARCA — nenhum branding do Flutter dentro do APK"
        # Aqui a pergunta é sobre o ARTEFATO, não sobre a pasta de build. O que
        # se prova, lendo a tabela de recursos do APK assinado:
        #   1. `mipmap/ic_launcher` tem variante `anydpi-v26` — ou seja, virou
        #      ícone adaptativo, e não continua um bitmap solto;
        #   2. as camadas `ic_launcher_foreground` e `ic_launcher_monochrome`
        #      existem nas cinco densidades;
        #   3. `drawable/splash_icon` existe — é ele que o Android 12+ desenha;
        #   4. `style/LaunchTheme` tem variante v31 — sem ela o sistema volta a
        #      inferir a janela de partida do ícone do aplicativo;
        #   5. `color/splash_background` continua `#ff050b1e`.
        #
        # Os BYTES dos PNG dentro do APK não servem de prova: o AGP recomprime
        # PNG no release, então o SHA muda mesmo com pixel idêntico. Por isso a
        # trava de bytes fica no passo de instalação, sobre o arquivo commitado,
        # e aqui a trava é estrutural mais ordem de grandeza do tamanho.
        run: |
          set -e
          APK=app_build/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          AAPT2=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 | sort | tail -1)
          test -n "$AAPT2" || { echo "ERRO: aapt2 não encontrado"; exit 1; }
          "$AAPT2" dump resources "$APK" > /tmp/recursos.txt

          bloco() { awk -v alvo="$1" '$0 ~ alvo {p=1; next} /resource 0x/ {p=0} p' /tmp/recursos.txt; }

          echo "--- mipmap/ic_launcher ---"; bloco "mipmap/ic_launcher$"
          bloco "mipmap/ic_launcher$" | grep -q 'anydpi-v26' \
            || { echo "ERRO: ic_launcher no APK não é adaptativo (sem anydpi-v26)"; exit 1; }

          # As TRÊS camadas, lidas do XML compilado. Contar densidades provaria
          # que os PNG estão lá; só isto prova que o ícone os USA — inclusive a
          # `monochrome`, que é o ícone temático do Android 13+.
          ADAPTATIVO=$(bloco "mipmap/ic_launcher$" | grep anydpi | sed 's/.*(file) //; s/ type=.*//')
          "$AAPT2" dump xmltree "$APK" --file "$ADAPTATIVO" > /tmp/adaptativo.txt
          cat /tmp/adaptativo.txt
          for camada in background foreground monochrome; do
            grep -q "E: $camada" /tmp/adaptativo.txt \
              || { echo "ERRO: o ícone adaptativo no APK não tem a camada '$camada'"; exit 1; }
          done

          for recurso in "mipmap/ic_launcher_foreground$" "drawable/ic_launcher_monochrome$" "drawable/splash_icon$"; do
            N=$(bloco "$recurso" | grep -c 'dpi)')
            echo "$recurso -> $N densidades"
            test "$N" -ge 5 || { echo "ERRO: $recurso tem $N densidades, esperava 5"; exit 1; }
          done

          echo "--- style/LaunchTheme ---"; bloco "style/LaunchTheme$"
          bloco "style/LaunchTheme$" | grep -q 'v31' \
            || { echo "ERRO: LaunchTheme sem variante v31 — a starting window voltaria ao ícone inferido"; exit 1; }

          grep -A3 'color/splash_background' /tmp/recursos.txt | grep -qi '#ff050b1e' \
            || { echo "ERRO: splash_background no APK não é #ff050b1e"; exit 1; }

          # Ordem de grandeza: o ícone padrão do Flutter em xxxhdpi tem 1443
          # bytes. A arte oficial recomprimida não chega perto disso.
          CAMINHO=$(bloco "mipmap/ic_launcher_foreground$" | grep 'xxxhdpi' | sed 's/.*(file) //; s/ type=.*//')
          unzip -p "$APK" "$CAMINHO" > /tmp/foreground.png
          T=$(wc -c < /tmp/foreground.png)
          echo "camada de frente empacotada ($CAMINHO): $T bytes"
          test "$T" -gt 20000 || { echo "ERRO: camada de frente com $T bytes — não é a arte oficial"; exit 1; }

          echo "OK: o APK carrega a marca do Buraco Master VIP, e nenhum recurso do Flutter sobrou."
      - name: Signing report (confirma a assinatura final)
        run: |
          cd app_build/android
          ./gradlew :app:signingReport --console=plain | tee /tmp/signingReport.txt || true
          echo "================= RESUMO DA ASSINATURA ================="
          echo "applicationId: ${BMV_APPLICATION_ID}"
          echo "versionCode:   ${{ github.run_number }}"
          echo "APK (arm64):   app_build/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          echo "--- tamanhos dos APKs por ABI ---"
          ls -lh app_build/build/app/outputs/flutter-apk/*.apk | awk '{print $9, $5}'
          echo "--- SHA-1 / SHA-256 do APK arm64 ---"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs ../build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep -iE "SHA-1|SHA-256" || true
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bmv-teste-apk
          path: app_build/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Publish APK as Release (link direto pro celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app_build/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk BMV-Teste.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BMV-Teste.apk --title "BMV Teste (mais recente)" --notes "APK mais recente do Buraco Master VIP (teste nativo, release). Abra este link no celular para instalar."
