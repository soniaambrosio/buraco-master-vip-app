name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold Flutter project
        run: flutter create --org com.buracomastervip --project-name buraco_master_vip app_build

      - name: Overlay custom screen
        run: cp app/lib/main.dart app_build/lib/main.dart

      - name: Build debug APK
        run: cd app_build && flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: buraco-master-vip-apk
          path: app_build/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
