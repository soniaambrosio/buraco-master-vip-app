name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install fixed debug keystore (para SHA-1 estavel / login Google)
        run: |
          mkdir -p ~/.android
          base64 -d keystore/debug.keystore.b64 > ~/.android/debug.keystore
          echo "keystore instalado"

      - name: Scaffold Flutter project
        run: flutter create --org com.buracomastervip.poc --project-name buraco_master_vip app_build

      - name: Overlay custom screen
        run: cp app/lib/main.dart app_build/lib/main.dart

      - name: Add Firebase + Google Sign-In deps
        run: cd app_build && flutter pub add firebase_core firebase_auth "google_sign_in:^6.2.1"

      - name: Bump minSdk to 23 (Firebase)
        run: |
          f=app_build/android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' "$f"
          grep -n "minSdk" "$f" || true

      - name: Set app display name to BMV Teste
        run: |
          sed -i 's/android:label="[^"]*"/android:label="BMV Teste"/' app_build/android/app/src/main/AndroidManifest.xml
          grep -o 'android:label="[^"]*"' app_build/android/app/src/main/AndroidManifest.xml

      - name: Fetch logo (splash) from live app and add as asset
        run: |
          mkdir -p app_build/assets
          curl -sSL "https://soniaambrosio.github.io/buraco-master-vip/app.html" -o /tmp/app.html
          python3 - <<'PY'
          import re, base64, sys
          h = open('/tmp/app.html', encoding='utf-8', errors='ignore').read()
          i = h.find('id="splash"')
          seg = h[i:i+400000] if i >= 0 else h
          m = re.search(r"data:image/(?:jpeg|png|webp);base64,([A-Za-z0-9+/=]+)", seg)
          if not m:
              print("ERRO: nao encontrei a logo do splash no app.html"); sys.exit(1)
          data = base64.b64decode(m.group(1))
          if len(data) < 10000:
              print("ERRO: imagem extraida muito pequena (%d bytes)" % len(data)); sys.exit(1)
          open('app_build/assets/splash.jpg', 'wb').write(data)
          print("Logo extraida: %d bytes" % len(data))
          PY

      - name: Declare asset in pubspec
        run: |
          python3 - <<'PY'
          p = 'app_build/pubspec.yaml'
          s = open(p).read()
          needle = '  uses-material-design: true'
          add = needle + '\n  assets:\n    - assets/splash.jpg'
          if 'assets/splash.jpg' not in s:
              if needle in s:
                  s = s.replace(needle, add, 1)
              else:
                  s = s.rstrip() + '\nflutter:\n  uses-material-design: true\n  assets:\n    - assets/splash.jpg\n'
          open(p, 'w').write(s)
          print("pubspec atualizado")
          PY

      - name: Build debug APK
        run: cd app_build && flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bmv-teste-apk
          path: app_build/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as Release (link direto pro celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app_build/build/app/outputs/flutter-apk/app-debug.apk BMV-Teste.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BMV-Teste.apk --title "BMV Teste (mais recente)" --notes "APK mais recente do Buraco Master VIP (teste nativo). Abra este link no celular para instalar."
