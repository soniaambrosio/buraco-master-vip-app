# MINUTA rev. 3.1 — OS BMV-A2-D2, opção B. NÃO PUBLICADA E NÃO EXECUTADA.
# Publicar este arquivo ou dispará-lo exige autorização própria da proprietária.
#
# Finalidade: compilar e testar a proposta da opção B SEM material de assinatura.
# Sequência: montagem completa -> resolução de dependências -> flutter analyze ->
#            testes do motor -> build sem chave -> registro (sem upload).
#   - Dispara apenas em push para a branch experimental abaixo (nunca main/master).
#   - Sem environment, sem secrets, sem vars, sem upload de artefato e sem Release.
#   - permissions: contents: read; checkout sem credencial persistida.
#   - O APK sai assinado com a chave debug descartável que o próprio runner gera
#     (padrão do `flutter create`). NÃO é a chave de teste e NÃO serve para distribuir.
#   - Não executa o app: analyze, testes e build não chamam main(); não há chamada
#     intencional a Firebase, Google ou Railway. A rede do runner hospedado NÃO é
#     bloqueada (pub.dev, Maven e Google são necessários para resolver e compilar).
#   - Versões diretas fixas não fixam as transitivas; o pubspec.lock resultante não é
#     versionado. O conteúdo integral dele e o inventário de `flutter pub deps` são
#     impressos no log (sem upload) logo após a resolução.
name: "Validação experimental — opção B (sem chave)"

on:
  push:
    branches: [ 'experimental/a2-d2-opcao-b-validacao' ]

permissions:
  contents: read

concurrency:
  group: validacao-opcao-b
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (sem credencial persistida)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Flutter fixado em 3.44.8.
          # Isso fixa o SDK, mas não as dependências transitivas.
          # A resolução e o pubspec.lock continuam pendentes de validação.
          flutter-version: 3.44.8

      - name: Scaffold Flutter project (sem resolver dependências)
        # --no-pub: o `flutter create` não roda `pub get`. A única resolução da montagem
        # acontece depois que o pubspec já tem as versões diretas e os overrides do JNI.
        run: flutter create --no-pub --org com.buracomastervip.poc --project-name buraco_master_vip app_build

      - name: Overlay custom UI files
        run: cp -R app/lib/. app_build/lib/

      - name: Remover só o teste padrão do flutter create (incompatível com o app)
        # O template gera test/widget_test.dart usando MyApp; o app define BuracoApp.
        # Remove SOMENTE esse arquivo, e só se for o template esperado; caso contrário, falha.
        run: |
          set -euo pipefail
          f=app_build/test/widget_test.dart
          if [ ! -e "$f" ]; then echo "sem widget_test.dart gerado; nada a remover"; exit 0; fi
          if grep -q 'Counter increments smoke test' "$f" && grep -q 'MyApp' "$f" && ! grep -qE 'class MyApp\b' app_build/lib/main.dart; then
            rm -- "$f"
            echo "removido: $f (teste padrão do flutter create; o app não define MyApp)"
          else
            echo "ERRO: $f não corresponde ao teste padrão esperado; revisar antes de remover"
            exit 1
          fi

      - name: Copy sound assets (mp3 reais da Sônia)
        run: |
          mkdir -p app_build/assets/sons
          cp app/assets/sons/*.mp3 app_build/assets/sons/
          echo "sons copiados:"
          ls -l app_build/assets/sons/

      - name: Copy card deck assets (baralho de imagens da Sônia)
        run: |
          mkdir -p app_build/assets/baralho
          cp app/assets/baralho/*.webp app_build/assets/baralho/
          N=$(ls app_build/assets/baralho/ | wc -l)
          echo "cartas copiadas: $N arquivos"
          ls -l app_build/assets/baralho/ | head
          if [ "$N" -lt 55 ]; then echo "ERRO: esperava 55 cartas, veio $N"; exit 1; fi

      - name: Copy profile UI assets
        run: |
          mkdir -p app_build/assets/perfil
          cp app/assets/perfil/*.webp app_build/assets/perfil/
          N=$(ls app_build/assets/perfil/ | wc -l)
          echo "assets do perfil copiados: $N arquivos"
          if [ "$N" -lt 23 ]; then echo "ERRO: esperava 23 assets do perfil, veio $N"; exit 1; fi

      - name: Copy ranking UI assets
        run: |
          mkdir -p app_build/assets/ranking/selos
          cp app/assets/ranking/*.webp app_build/assets/ranking/
          cp app/assets/ranking/selos/*.webp app_build/assets/ranking/selos/
          N_RAIZ=$(find app_build/assets/ranking -maxdepth 1 -type f -name '*.webp' | wc -l)
          N_SELOS=$(find app_build/assets/ranking/selos -maxdepth 1 -type f -name '*.webp' | wc -l)
          echo "assets do ranking copiados: $N_RAIZ principais + $N_SELOS selos"
          if [ "$N_RAIZ" -lt 15 ]; then echo "ERRO: esperava ao menos 15 assets principais do ranking, veio $N_RAIZ"; exit 1; fi
          if [ "$N_SELOS" -lt 10 ]; then echo "ERRO: esperava 10 selos do ranking, veio $N_SELOS"; exit 1; fi

      - name: Copy Hall dos Imortais asset
        run: |
          mkdir -p app_build/assets/hall
          cp app/assets/hall/painel_gloria.webp app_build/assets/hall/
          test -s app_build/assets/hall/painel_gloria.webp
          echo "asset do Hall copiado"

      - name: Copy home UI assets
        run: |
          mkdir -p app_build/assets/inicio
          cp app/assets/inicio/*.webp app_build/assets/inicio/
          N=$(find app_build/assets/inicio -maxdepth 1 -type f -name '*.webp' | wc -l)
          echo "assets da tela inicio copiados: $N arquivos"
          if [ "$N" -lt 11 ]; then echo "ERRO: esperava 11 assets da tela inicio, veio $N"; exit 1; fi

      - name: Copy configure table UI assets
        run: |
          mkdir -p app_build/assets/configurar_mesa
          cp app/assets/configurar_mesa/*.webp app_build/assets/configurar_mesa/
          N=$(find app_build/assets/configurar_mesa -maxdepth 1 -type f -name '*.webp' | wc -l)
          echo "assets da tela configurar mesa copiados: $N arquivos"
          if [ "$N" -lt 8 ]; then echo "ERRO: esperava 8 assets da tela configurar mesa, veio $N"; exit 1; fi

      - name: Copy loja cosmetics assets (placeholder se faltar arte)
        run: |
          mkdir -p app_build/assets/loja
          cp -r app/assets/loja/. app_build/assets/loja/ 2>/dev/null || true
          N=$(find app_build/assets/loja -type f -name '*.webp' | wc -l)
          echo "assets da loja de cosmeticos: $N arquivos (a tela usa placeholder onde faltar)"

      - name: Bump minSdk to 23 (Firebase)
        run: |
          f=app_build/android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' "$f"
          grep -n "minSdk" "$f" || true

      - name: Set app display name to BMV Teste
        run: |
          sed -i 's/android:label="[^"]*"/android:label="BMV Teste"/' app_build/android/app/src/main/AndroidManifest.xml
          grep -o 'android:label="[^"]*"' app_build/android/app/src/main/AndroidManifest.xml

      - name: Desativar Impeller (renderiza webp com transparência via Skia)
        # Impeller (motor padrão do Flutter no Android) tem bug conhecido: imagens
        # WEBP com canal alfa aparecem EM BRANCO no build release, embora o resto da
        # UI funcione. Voltar pro Skia resolve e renderiza os assets do baralho.
        run: |
          python3 - <<'PY'
          p = 'app_build/android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          meta = '<meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />'
          if 'EnableImpeller' not in s:
              s = s.replace('</application>', '        ' + meta + '\n    </application>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('Impeller desativado:' , 'EnableImpeller' in s)
          PY
          grep -n "EnableImpeller" app_build/android/app/src/main/AndroidManifest.xml

      - name: Copy official animated splash assets
        run: |
          mkdir -p app_build/assets/splash
          cp app/assets/splash/logo_splash_oficial.webp app_build/assets/splash/
          cp app/assets/splash/splash_intro.mp3 app_build/assets/splash/
          echo "assets da splash oficial:"
          ls -lh app_build/assets/splash/
          test -s app_build/assets/splash/logo_splash_oficial.webp
          test -s app_build/assets/splash/splash_intro.mp3

      - name: Configure dark native launch screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('app_build/android/app/src/main/res')
          color = '#050201'
          for rel in ['values/colors.xml', 'values-night/colors.xml']:
              p = root / rel
              p.parent.mkdir(parents=True, exist_ok=True)
              if p.exists():
                  s = p.read_text(encoding='utf-8')
                  if 'splash_background' not in s:
                      s = s.replace('</resources>', f'    <color name="splash_background">{color}</color>\n</resources>')
              else:
                  s = f'<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="splash_background">{color}</color>\n</resources>\n'
              p.write_text(s, encoding='utf-8')

          for rel in ['drawable/launch_background.xml', 'drawable-v21/launch_background.xml']:
              p = root / rel
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/splash_background" />
          </layer-list>
          ''', encoding='utf-8')
          print('Native launch screen configurada em fundo escuro.')
          PY

      - name: Declare assets in pubspec (robusto)
        run: |
          python3 - <<'PY'
          p = 'app_build/pubspec.yaml'
          lines = open(p, encoding='utf-8').read().split('\n')
          asset_block = [
              '  assets:',
              '    - assets/splash/',
              '    - assets/sons/',
              '    - assets/baralho/',
              '    - assets/perfil/',
              '    - assets/ranking/',
              '    - assets/ranking/selos/',
              '    - assets/hall/',
              '    - assets/inicio/',
              '    - assets/configurar_mesa/',
          ]
          joined = '\n'.join(lines)
          if 'assets/baralho/' not in joined:
              out = []
              injected = False
              for ln in lines:
                  out.append(ln)
                  # injeta o bloco de assets logo APÓS a linha 'flutter:' de nível 0
                  # (a única com esse texto exato; 'sdk: flutter' e '  flutter:' não batem)
                  if not injected and ln.rstrip() == 'flutter:':
                      out.extend(asset_block)
                      injected = True
              if not injected:
                  # não achou seção flutter: -> cria uma no fim
                  out.extend(['flutter:', '  uses-material-design: true'] + asset_block)
              lines = out
          # Flutter does not include subdirectories recursively. If an older
          # pubspec already had assets/ranking/, append the nested seals directory.
          joined = '\n'.join(lines)
          if 'assets/ranking/selos/' not in joined:
              out = []
              inserted = False
              for ln in lines:
                  out.append(ln)
                  if ln.strip() == '- assets/ranking/':
                      out.append('    - assets/ranking/selos/')
                      inserted = True
              if not inserted:
                  raise AssertionError('nao encontrei assets/ranking/ para declarar assets/ranking/selos/')
              lines = out
          joined = '\n'.join(lines)
          if 'assets/hall/' not in joined:
              out = []
              inserted = False
              for ln in lines:
                  out.append(ln)
                  if ln.strip() == '- assets/ranking/selos/':
                      out.append('    - assets/hall/')
                      inserted = True
              if not inserted:
                  raise AssertionError('nao encontrei assets/ranking/selos/ para declarar assets/hall/')
              lines = out
          joined = '\n'.join(lines)
          if 'assets/configurar_mesa/' not in joined:
              out = []
              inserted = False
              for ln in lines:
                  out.append(ln)
                  if ln.strip() == '- assets/inicio/':
                      out.append('    - assets/configurar_mesa/')
                      inserted = True
              if not inserted:
                  raise AssertionError('nao encontrei assets/inicio/ para declarar assets/configurar_mesa/')
              lines = out
          s = '\n'.join(lines)
          open(p, 'w', encoding='utf-8').write(s)
          print('----- pubspec.yaml (a partir de flutter:) -----')
          print(s[s.find('\nflutter:'):] if '\nflutter:' in s else s)
          # travas de segurança: exatamente UMA seção flutter: e todos os diretórios de assets declarados
          top_flutter = sum(1 for l in lines if l.rstrip() == 'flutter:')
          assert top_flutter == 1, f'esperava 1 secao flutter: de nivel 0, achei {top_flutter}'
          for a in ('assets/splash/', 'assets/sons/', 'assets/baralho/', 'assets/perfil/', 'assets/ranking/', 'assets/ranking/selos/', 'assets/hall/', 'assets/inicio/', 'assets/configurar_mesa/'):
              assert a in s, f'FALTOU declarar {a} no pubspec!'
          print('OK: 1 seção flutter: · splash oficial + som + sons + baralho + perfil + ranking + selos + hall + inicio + configurar_mesa declarados')
          PY

      - name: Conferir assets que serão empacotados
        run: |
          echo "--- app_build/assets ---"; find app_build/assets -type f | sort | sed -n '1,20p'
          echo "baralho: $(find app_build/assets/baralho -maxdepth 1 -type f | wc -l) | sons: $(find app_build/assets/sons -maxdepth 1 -type f | wc -l) | perfil: $(find app_build/assets/perfil -maxdepth 1 -type f | wc -l) | ranking principais: $(find app_build/assets/ranking -maxdepth 1 -type f | wc -l) | selos: $(find app_build/assets/ranking/selos -maxdepth 1 -type f | wc -l) | hall: $(find app_build/assets/hall -maxdepth 1 -type f | wc -l) | inicio: $(find app_build/assets/inicio -maxdepth 1 -type f | wc -l) | configurar mesa: $(find app_build/assets/configurar_mesa -maxdepth 1 -type f | wc -l)"

      - name: Copiar suítes de teste reais (montagem)
        run: |
          set -euo pipefail
          test -f app/test/teste_motor.dart
          mkdir -p app_build/test
          cp -R app/test/. app_build/test/
          ls -l app_build/test/

      - name: Preparar pubspec — dependências diretas exatas + overrides JNI (sem resolver)
        # PROPOSTA EXPERIMENTAL (OS BMV-A2-D2, opção B, rev. 2). Escreve no pubspec gerado,
        # ANTES de qualquer resolução, as versões diretas exatas (iguais às do pubspec.lock da
        # candidata 62a6424) e o par jni 1.0.0 + jni_flutter 1.0.2 (JniVersionCheck(1, 0)).
        # Versões diretas fixas NÃO fixam as transitivas: sem pubspec.lock versionado, elas são
        # escolhidas na resolução do próximo passo. Resolução e lock seguem PENDENTES de validação.
        run: |
          cd app_build
          test ! -e pubspec.lock || { echo "ERRO: já existe pubspec.lock antes da preparação"; exit 1; }
          python3 - <<'PY'
          import re
          p = 'pubspec.yaml'
          s = open(p, encoding='utf-8').read()
          diretas = {
              'firebase_core': '4.13.0',
              'firebase_auth': '6.5.7',
              'google_sign_in': '6.2.1',
              'audioplayers': '6.7.1',
              'web_socket_channel': '3.0.3',
              'shared_preferences': '2.5.5',
          }
          travas = {'jni': '1.0.0', 'jni_flutter': '1.0.2'}
          if re.search(r'^dependency_overrides:', s, re.M):
              raise SystemExit('ERRO: o pubspec gerado já tem dependency_overrides; revisar')
          for nome in [*diretas, *travas]:
              if re.search(rf'^\s+{nome}:', s, re.M):
                  raise SystemExit(f'ERRO: {nome} já aparece no pubspec gerado; revisar')
          linhas = s.split('\n')
          if 'dependencies:' not in linhas:
              raise SystemExit('ERRO: seção dependencies: de nível 0 não encontrada')
          i = linhas.index('dependencies:')
          linhas[i + 1:i + 1] = [f'  {k}: {v}' for k, v in diretas.items()]
          s = '\n'.join(linhas).rstrip() + '\n\ndependency_overrides:\n'
          s += ''.join(f'  {k}: {v}\n' for k, v in travas.items())
          open(p, 'w', encoding='utf-8').write(s)
          print(s)
          PY

      - name: Resolver dependências (única resolução) e conferir o par JNI
        # O pubspec.lock gerado aqui NÃO é versionado: o resultado é registrado no log para
        # validação. Transitivas podem variar entre execuções enquanto não houver lock.
        run: |
          set -euo pipefail
          cd app_build
          flutter pub get
          flutter pub deps --style=compact > ../deps-resolvidas.txt
          grep -E '^- (jni|jni_flutter|path_provider_android|web_socket_channel|shared_preferences) ' ../deps-resolvidas.txt || true
          grep -qE '^- jni 1\.0\.0( |$)' ../deps-resolvidas.txt || { echo "ERRO: jni resolvido diferente de 1.0.0"; exit 1; }
          grep -qE '^- jni_flutter 1\.0\.2( |$)' ../deps-resolvidas.txt || { echo "ERRO: jni_flutter resolvido diferente de 1.0.2"; exit 1; }
          echo "--- pubspec.lock resultante (não versionado) ---"
          sha256sum pubspec.lock

      - name: Registro do inventário de dependências no log (sem upload)
        run: |
          set -euo pipefail
          lock=app_build/pubspec.lock
          deps=deps-resolvidas.txt
          test -f "$lock"
          test -f "$deps"
          if grep -qEi '://[^/[:space:]]*@|token|password|authorization|bearer' "$lock" "$deps"; then
            echo "ERRO: padrão parecido com credencial no lock ou no inventário; conteúdo NÃO impresso"
            exit 1
          fi
          echo "===== $lock"
          sha256sum "$lock"
          cat "$lock"
          echo "===== $deps (flutter pub deps --style=compact)"
          sha256sum "$deps"
          cat "$deps"
          echo "===== fim do inventário (somente log; nada é enviado)"

      - name: Análise estática (flutter analyze; erro é fatal, aviso e info não)
        run: cd app_build && flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: "PORTÃO DE QUALIDADE — testes do motor (bloqueia o APK se falhar)"
        run: |
          if [ ! -f app/test/teste_motor.dart ]; then
            echo "ERRO: app/test/teste_motor.dart não encontrado — o portão de qualidade é OBRIGATÓRIO."
            echo "Nenhum APK pode ser gerado sem a suíte de testes do motor."
            exit 1
          fi
          mkdir -p app_build/test
          # Copia a pasta de teste inteira: além do teste_motor.dart, leva os
          # assets que ele importa (ex.: conformidade_fixture.dart do C8).
          cp -R app/test/. app_build/test/
          echo "arquivos de teste copiados:"
          ls -l app_build/test/
          echo "================= REGISTRO DO PORTÃO ================="
          echo "Commit testado (GITHUB_SHA): ${GITHUB_SHA}"
          echo "SHA-256 do motor testado (código REAL de produção):"
          sha256sum app_build/lib/mesa.dart
          echo "SHA-256 da suíte executada:"
          sha256sum app_build/test/teste_motor.dart
          echo "======================================================"
          cd app_build
          flutter test test/teste_motor.dart --reporter expanded
          echo "PORTÃO VERDE: todos os testes do motor passaram no commit ${GITHUB_SHA} — seguindo pro APK."

      - name: Compilação release SEM chave de teste (assinatura debug descartável do runner)
        run: |
          set -euo pipefail
          # Nenhum material de assinatura pode existir aqui.
          test ! -e app_build/android/key.properties
          test -z "$(find app_build -name '*.jks' -o -name '*.keystore' | grep -v '/.gradle/' || true)"
          cd app_build && flutter build apk --release --split-per-abi

      - name: Conferir baralho DENTRO do APK (prova de bundling)
        run: |
          APK=app_build/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          echo "cartas no APK: $(unzip -l "$APK" | grep -c 'assets/flutter_assets/assets/baralho/') | sons: $(unzip -l "$APK" | grep -c 'assets/flutter_assets/assets/sons/')"
          unzip -l "$APK" | grep 'assets/flutter_assets/assets/baralho/' | head -3 || true

      - name: Registro do resultado (sem upload)
        run: |
          set -euo pipefail
          ls -l app_build/build/app/outputs/flutter-apk/
          sha256sum app_build/build/app/outputs/flutter-apk/*.apk
          echo "Somente registro no log. Nenhum artefato é enviado e nada é publicado."
