          # precisa existir para ser trocado. Sem ele, 42 dos 86 casos daquela
          # suite falham por modulo ausente — e o gate ficaria vermelho por
          # ambiente, nao por regressao.
          ( cd functions-billing && npm ci --no-audit --no-fund 2>&1 | tail -3 )
          ( cd functions-billing && npm test ) 2>&1 | tee t_billing.log; echo ${PIPESTATUS[0]} > exit_billing

