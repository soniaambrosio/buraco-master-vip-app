name: CI OS Integração (analyze + suítes + codebases Firebase)

# Autoridade de validação da OS "Integração Final Backend ↔ Flutter".
#
# Escopo (executa "quando aplicável", nunca afrouxa teste para ficar verde):
#   1. flutter analyze  (erro é fatal; warning/info não)
#   2. flutter test — Motor de Partidas, encerramento, torneios, integração,
#      coleções/Kit Pioneiros e domínio social
#   3. as codebases Firebase, cada uma descoberta pelo próprio caminho:
#        colecoes  -> firebase/functions   + regras em firebase/testes (emulador)
#        billing   -> functions-billing    (node --test, sem emulador)
#        torneios  -> functions            (tsc --noEmit)
#        ranking   -> functions-ranking    (tsc + node --test)
#        social    -> functions-social     (dart compile js + tsc + node --test,
#                                           e um passo PRÓPRIO de Emulator Suite
#                                           com chamadas reais às callables)
#        moderacao -> functions-moderacao  (passo PRÓPRIO de Emulator Suite, pelo
#                                           wrapper `emulador:moderacao`, que faz
#                                           o próprio build)
#      As regras rodam por `test:integrado`, que prova os blocos de
#      firestore.rules cobertos por suíte no MESMO arquivo.
#
# TRÊS SUÍTES FIREBASE SÃO PROTEGIDAS PELO CI, cada uma com passo próprio e
# bloqueante: SOCIAL (`socialemu`), MODERAÇÃO (`moderacaoemu`) e COLEÇÕES +
# REGRAS (`colecoesemu`). Sequenciais de propósito — as três disputam as MESMAS
# portas e o MESMO projectId `demo-bmv` do Emulator Suite, e duas execuções
# sobrepostas não se revezam: sobem pela metade.
#
# ESSES TRÊS SÃO OS GATES OBRIGATÓRIOS, e desde a OS "CI fail-closed dos gates de
# emulador" eles são FAIL-CLOSED: o portão final só fica VERDE se cada um dos três
# tiver deixado um recibo válido de sucesso. Ausência de recibo, recibo vazio,
# conteúdo que não seja um exit code, ou qualquer exit diferente de zero reprovam.
# Ausência de evidência de sucesso NÃO é sucesso. A política mora inteira no passo
# "Portão verde/vermelho", no fim deste arquivo.
#
# NOTA DE COMPOSIÇÃO DA RC. Este arquivo é a UNIÃO de duas linhagens que
# evoluíram em paralelo sobre a mesma base: a de identidade/ranking, que
# acrescentou os passos `rankingfn`, `rankingint`, `identint` e `auditident` e
# trocou o alvo do gate de regras por `test:integrado`; e a do fail-closed, que
# acrescentou o gate `moderacaoemu` e a política de recibo obrigatório. Nenhuma
# das duas perdeu passo na união. O gate que se chamava `regras` passou a
# chamar-se `colecoesemu` (mesmo passo, mesmo comando, mesma suíte) para que os
# três obrigatórios se leiam como um conjunto no portão final.
#
# NENHUM GATE FOI REMOVIDO NEM AFROUXADO por estas adições (OS Identidade Pública
# §38, OS Política Competitiva, OS de integração de identidade). Os gates de
# social são: `social` (domínio Dart), `socialdom` (o bundle do domínio compila),
# `socialfn` (typecheck + testes puros do codebase) e `socialemu` (Functions
# reais no emulador). Os de ranking são `rankingfn` e `rankingint`. As Rules dos
# dois blocos entram no gate `colecoesemu` que já existia, porque
# `firebase/testes/npm run test:integrado` passou a incluir `social.test.js` e
# `ranking.test.js` no MESMO arquivo de regras.
#
# A OS DE INTEGRAÇÃO DE IDENTIDADE acrescentou dois gates, e nenhum substitui os
# de cima: `identint` roda as DUAS implementações juntas (emissão social +
# consumo competitivo, e a concorrência de seis chamadas simultâneas para um
# jogador sem identidade), e `auditident` exercita a auditoria de legado em
# dry-run. Os gates existentes provam cada lado sozinho, com identidade de
# fixture — que é uma afirmação sobre o que o vizinho produz, e não a coisa.
#
# REGRA DURA DE HONESTIDADE: nada aqui pode sair como NÃO EXECUTADO por erro de
# descoberta. Cada codebase tem caminho FIXO, declarado abaixo; se o caminho
# existe e mesmo assim não roda, o motivo é impresso e o gate falha. NÃO
# EXECUTADO é reservado a ausência real do artefato.
#
# Evidência (logs + exit codes + NÃO EXECUTADOs) é publicada na branch
# `ci-evidencias`, auditável mesmo sem acesso à API do GitHub.
#
# A OS DE BLINDAGEM DO CI (composição Perfil + Mesa Online + Ranking Real V2)
# corrigiu três defeitos deste arquivo, e nenhum gate foi removido ou afrouxado:
#
#   CI-01  Doze suítes Flutter verdes localmente não tinham gate: as seis de
#          Mesa Online/Casca V2, as cinco de Ranking/Perfil Publicável e a da
#          composição. Agora cada arquivo tem log e exit code próprios, e
#          arquivo ausente vira `nao_<gate>`, que REPROVA.
#   CI-02  `rankingfn`, `rankingint`, `identint` e `auditident` constavam da
#          evidência, rodavam de verdade, e o agregador final não os percorria:
#          podiam falhar com o portão verde. A causa era haver DUAS listas
#          escritas à mão neste YAML — 23 gates na evidência, 19 no portão.
#   CI-03  "NÃO EXECUTADO" contava como sucesso para gate obrigatório, e um
#          exit code vazio ou ilegível também.
#
# A correção tirou a relação e a decisão de dentro do YAML:
#   scripts/ci/gates_os_integracao.txt  — fonte ÚNICA dos gates obrigatórios,
#                                          lida pela evidência E pelo portão.
#   scripts/ci/portao_os_integracao.sh  — o agregador, que falha fechado.
#   scripts/ci/teste_portao_os_integracao.sh — matriz do próprio agregador,
#                                          registrada como o gate `portaoci`.
# É PROIBIDO reintroduzir uma lista de gates neste arquivo: o caso I5 do teste
# do portão reprova exatamente isso.
#
# NÃO gera APK, NÃO faz deploy, NÃO roda em main/master/consolidacao.

on:
  push:
    branches:
      - integracao/os-final-backend-flutter
      - correcao/ci-composicao-perfil-mesa-ranking-v2-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `fetch-depth: 0` é exigência do gate `composloja`, e não conforto:
          # provar que as DUAS folhas de origem são ancestrais do HEAD só é
          # possível com histórico. Num clone raso o `merge-base` responde
          # "não é ancestral" para QUALQUER commit — e o gate reprova de
          # propósito nesse caso, em vez de ficar verde onde não pode medir.
          fetch-depth: 0

      - name: "0 — teste do PRÓPRIO portão (agregador + fonte única)"
        run: |
          set +e
          # O CARIMBO DESTE RUN, escrito antes de qualquer log existir. É por
          # ele que `verificar_contrato_suites.sh` distingue evidência PRODUZIDA
          # aqui de evidência remanescente de outra execução: um `t_<gate>.log`
          # mais velho que este arquivo não é evidência deste run.
          date -u +%Y-%m-%dT%H:%M:%SZ > carimbo_execucao
          echo "run ${{ github.run_id }} / ${{ github.run_number }} @ ${{ github.sha }}" >> carimbo_execucao
          # O agregador era a única peça do CI que ninguém verificava — e era
          # justamente onde moravam CI-02 e CI-03. Roda primeiro, antes de
          # Flutter e de emulador: um portão quebrado tem que aparecer como
          # portão quebrado, e não como "os testes passaram".
          if [ ! -f scripts/ci/teste_portao_os_integracao.sh ]; then
            echo "scripts/ci/teste_portao_os_integracao.sh ausente" > nao_portaoci; exit 0
          fi
          bash scripts/ci/teste_portao_os_integracao.sh 2>&1 | tee t_portaoci.log
          echo ${PIPESTATUS[0]} > exit_portaoci

      - name: "0b — teste do VERIFICADOR de contrato das suítes protegidas"
        run: |
          set +e
          # Mesma razão do passo acima, um degrau adiante: o verificador de
          # conteúdo decide se as suítes protegidas ainda PROVAM, e sem esta
          # matriz ele seria a segunda peça do CI que ninguém verifica.
          if [ ! -f scripts/ci/teste_contrato_suites.sh ]; then
            echo "scripts/ci/teste_contrato_suites.sh ausente" > nao_contratosui; exit 0
          fi
          bash scripts/ci/teste_contrato_suites.sh 2>&1 | tee t_contratosui.log
          echo ${PIPESTATUS[0]} > exit_contratosui

      - name: "0c — CONTRATO DE CONTEÚDO das suítes protegidas (falha fechada)"
        run: |
          # SEM `set +e`, e de propósito. O Actions roda cada `run:` com
          # `bash -e {0}`: se o verificador sair diferente de zero, o passo
          # aborta e o job vai a pique aqui — sem depender de ser somado num
          # portão lá na frente. Um verificador cuja reprovação precisa de
          # outro passo para virar vermelho herda o defeito que veio consertar.
          #
          # FASE A: estática. Roda antes de Flutter, de Node e de emulador,
          # porque uma suíte esvaziada tem de aparecer como suíte esvaziada, e
          # não como "os testes passaram".
          bash scripts/ci/verificar_contrato_suites.sh . .github/workflows/ci-os-integracao.yml

      - name: Setup Java (exigido pelo emulador do Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node (firebase-tools e testes das Functions)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Flutter (versão pinada do build oficial)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8

      - name: Scaffold do projeto Flutter
        run: flutter create --org com.buracomastervip.poc --project-name buraco_master_vip app_build

      # As dependências são as do REPOSITÓRIO, não as que o CI resolver na hora.
      # Antes daqui havia `flutter pub add` + um remendo Python no pubspec para
      # travar o jni: os dois sumiram porque `app/pubspec.yaml` (com
      # `dependency_overrides`) e `app/pubspec.lock` agora são a fonte da verdade.
      - name: Dependências versionadas (pubspec.yaml + pubspec.lock do repo)
        run: |
          cp app/pubspec.yaml app/pubspec.lock app_build/
          cd app_build && flutter pub get

      - name: Overlay do código e dos assets REAIS
        run: |
          cp -R app/lib/. app_build/lib/
          # `-name '*.dart'` excluído de propósito: há .dart soltos versionados
          # dentro de app/assets/ (cópias antigas de tela, que ninguém importa).
          # Copiá-los faria o analyze reprovar por lixo de árvore, não por código
          # nosso. A remoção deles é decisão registrada à parte.
          cd app && find assets -type f ! -name '*.dart' -exec sh -c 'mkdir -p "../app_build/$(dirname "$1")" && cp "$1" "../app_build/$1"' _ {} \;

      - name: Copiar suítes de teste + seeds
        run: |
          mkdir -p app_build/test/torneios/data app_build/test/integracao app_build/test/colecoes/data
          cp -R app/test/. app_build/test/
          cp app/data/torneios/*.json app_build/test/torneios/data/
          # Seeds LEGADOS, em subpasta propria. Eles nao entram pelo glob
          # acima de proposito: `app/data/torneios/*.json` e o caminho
          # produtivo, e um modelo aposentado nao pode voltar por ele. Aqui
          # eles viajam para a bancada porque `fundacao_base_p_test.dart`
          # precisa PROVAR que continuam de fora — e porque a mecanica que os
          # dois exercitam segue sustentada por `mtorneios`.
          mkdir -p app_build/test/torneios/data/legado
          cp app/data/torneios/legado/*.json app_build/test/torneios/data/legado/
          cp app/data/colecoes/*.json app_build/test/colecoes/data/
          # O widget_test.dart do scaffold tem erro pré-existente conhecido.
          rm -f app_build/test/widget_test.dart

      - name: "1+2 — analyze + suítes Flutter (captura exit codes sem abortar)"
        run: |
          set +e
          ( cd app_build && flutter analyze --no-fatal-infos --no-fatal-warnings ) 2>&1 | tee analyze.log; echo ${PIPESTATUS[0]} > exit_analyze
          roda() { # roda <chave> <caminho>
            local k="$1" t="$2"
            if [ ! -f "app_build/$t" ]; then echo "ausente: $t" > "nao_$k"; return; fi
            ( cd app_build && flutter test "$t" --reporter expanded ) 2>&1 | tee "t_$k.log"; echo ${PIPESTATUS[0]} > "exit_$k"
          }
          roda motor      test/teste_motor.dart
          roda resil      test/teste_motor_resiliencia.dart
          roda encerr     test/teste_encerramento.dart
          roda torneios   test/torneios/reward_grants_test.dart
          roda mtorneios  test/torneios/motor_torneios_test.dart
          # OS de Fundacao da Base P: acesso VIP integral, participacao
          # individual, ciclo editorial com `em_revisao` e aprovador distinto,
          # e os quatro bloqueios que precisam continuar bloqueados.
          roda torneiobase test/torneios/fundacao_base_p_test.dart
          roda integr     test/integracao/teste_integracao_motores.dart
          roda colarte    test/colecoes/colecao_arte_test.dart
          roda colfire    test/colecoes/colecao_firebase_test.dart
          roda colkit     test/colecoes/kit_pioneiros_test.dart
          # OS Identidade Publica e Grafo Social: o dominio puro (apelido,
          # publicId, estados da amizade, limites, paginacao). Autorizacao e
          # provada pelas Rules, no gate `colecoesemu`.
          roda social     test/social/teste_social.dart
          # OS Casca de Produção: o roteamento por sessão (Splash → Login/Home),
          # o logout que derruba socket e pilha, e a auditoria estrutural que
          # impede a volta do segundo dono de autenticação, da rota que alcança
          # maquete e do dado pessoal no código distribuído.
          roda casca      test/casca/casca_producao_test.dart
          roda cascaaud   test/casca/auditoria_casca_test.dart
          # OS Mesa Online / Casca V2 (CI-01). Estas seis suítes eram verdes só
          # na máquina de quem escreve: provam a porta ÚNICA de comandos, o
          # adaptador da visão versionada, a caracterização da ligação
          # motor↔casca e a homologação da própria Casca V2. Sem gate próprio,
          # qualquer uma podia quebrar sem o CI dizer uma palavra.
          roda cascavisao   test/casca/adaptador_visao_online_test.dart
          roda cascamesaaud test/casca/auditoria_mesa_online_test.dart
          roda cascav2      test/casca/homologacao_casca_v2_test.dart
          roda cascaligacao test/casca/ligacao_mesa_caracterizacao_test.dart
          roda cascamesa    test/casca/mesa_online_test.dart
          roda cascaporta   test/casca/porta_de_comandos_online_test.dart
          # OS Ligação Produtiva da Loja à Casca V2. O caminho Home → Loja, a
          # volta, o descarte no logout, e a prova de que a Loja publicável não
          # exibe saldo, pacote nem cosmético de maquete — nem acende VIP sem o
          # backend.
          roda cascaloja    test/casca/loja_de_producao_test.dart
          # OS Leitor Real de Ranking (barreira temporal V2) e Perfil
          # Publicável (CI-01). `rkestado` é o que impede a volta do fallback
          # Bronze / nível 1 / colocação #0 e #1; `rkbarreira` é a barreira
          # temporal, que sem gate é a primeira coisa a apodrecer.
          roda rkbarreira   test/ranking/barreira_temporal_ranking_test.dart
          roda rkestado     test/ranking/estado_canonico_ranking_test.dart
          roda rkperfil     test/ranking/homologacao_perfil_publicavel_test.dart
          roda rkleitor     test/ranking/leitor_ranking_real_test.dart
          roda rkregressao  test/ranking/regressao_leitor_ranking_test.dart
          # OS Composição Loja/Casca + Functions (CI-01, de novo e no mesmo
          # lugar). `ranking_page_test.dart` guarda o caso que monta
          # `const RankingPage()` SEM fonte — que é a construção real de
          # `hall_page.dart` e de `perfil_page.dart` — e exige a frase "o
          # ranking oficial ainda não está sendo publicado" no lugar de nome,
          # liga e colocação inventados. Era a suíte que guarda RANKING-01, e
          # passo nenhum a rodava.
          roda rkpagina     test/ranking_page_test.dart
          # A união dos três arquivos da interseção da composição.
          roda composicao   test/composicao/composicao_perfil_ranking_test.dart
          # ---------------------------------------------------------------
          # PERFIL/SOCIAL FUNCIONAL SOBRE A RAIZ P
          # ---------------------------------------------------------------
          # As onze suites que a composicao trouxe da familia funcional. Elas
          # cobrem avatar publico, Perfil visitado, Ranking real com navegacao
          # publica e Amigos funcional — e sao as provas que a folha de origem
          # protegia com o mecanismo M (`suites_obrigatorias.txt` + verificador
          # proprio). Esse mecanismo NAO veio junto: a fonte unica desta raiz e
          # `scripts/ci/gates_os_integracao.txt`, e e la que o contrato de cada
          # uma destas suites mora — caminho, executor, digest, piso e blocos.
          roda avatarcanon  test/casca/avatar_publico_canonico_test.dart
          roda avatarhml  test/casca/homologacao_avatar_publico_test.dart
          roda perfilvis  test/perfil/identidade_visitada_test.dart
          roda rknavpub  test/ranking/navegacao_perfil_publico_test.dart
          roda compavrank  test/composicao/composicao_avatar_ranking_test.dart
          roda compnavpub  test/composicao/composicao_navegacao_publica_test.dart
          roda socialestado  test/amigos/estado_social_test.dart
          roda socialleitor  test/amigos/leitor_social_test.dart
          roda socialtela  test/amigos/descoberta_social_tela_test.dart
          roda audsocial  test/amigos/auditoria_descoberta_social_test.dart
          roda a11yamigos  test/amigos/a11y_alvos_amigos_test.dart
          # OS Chat Livre Seguro V1: a porta ÚNICA de envio de mensagem. Prova
          # que autoria não vem do payload, que o `messageId` é derivado e opaco,
          # que bloqueio é filtrado por PAR nas duas direções consumindo
          # `avaliarContato`, que espectador não fala nem recebe, e que a projeção
          # não carrega UID, token, socket nem estado administrativo.
          roda chatdom      test/chat/chat_test.dart
          # OS 24-C2: a matriz da Comunicação Controlada V1. `chatdom` acima
          # guarda a porta do TEXTO; esta guarda o AMBIENTE — quem pode dizer o
          # quê em cada superfície —, e o grupo ESP, que é o único lugar onde o
          # espectador é barrado no caminho CATALOGADO.
          roda comunicacao  test/comunicacao/comunicacao_test.dart
          # Gerador de evidência visual: roda e é reportado, mas NÃO entra no
          # portão, por decisão registrada no cabeçalho do próprio arquivo — ele
          # produz PNG e depende de fonte do sistema, não afirma regressão.
          ( cd app_build && flutter test test/colecoes/evidencias_visuais_test.dart ) 2>&1 | tee t_colevid.log; echo ${PIPESTATUS[0]} > info_colevid

      - name: "3a — codebase BILLING (functions-billing), sem emulador"
        run: |
          set +e
          if [ ! -d functions-billing ]; then echo "diretorio functions-billing ausente" > nao_billing; exit 0; fi
          # `npm ci` passou a ser necessario: `adversarial.test.js` carrega
          # `index.js` com as portas trocadas no require.cache, e o pacote real
          # precisa existir para ser trocado. Sem ele, 42 dos 86 casos daquela
          # suite falham por modulo ausente — e o gate ficaria vermelho por
          # ambiente, nao por regressao.
          ( cd functions-billing && npm ci --no-audit --no-fund 2>&1 | tail -3 )
          ( cd functions-billing && npm test ) 2>&1 | tee t_billing.log; echo ${PIPESTATUS[0]} > exit_billing

      - name: "3b — codebase TORNEIOS (functions), typecheck"
        run: |
          set +e
          if [ ! -f functions/package.json ]; then echo "functions/package.json ausente" > nao_torneiosfn; exit 0; fi
          ( cd functions && npm ci 2>&1 | tail -3 || npm install 2>&1 | tail -3 )
          ( cd functions && npx tsc --noEmit ) 2>&1 | tee t_torneiosfn.log; echo ${PIPESTATUS[0]} > exit_torneiosfn

      - name: "3e — codebase RANKING (functions-ranking), tsc + unitários"
        run: |
          set +e
          if [ ! -f functions-ranking/package.json ]; then
            echo "functions-ranking/package.json ausente" > nao_rankingfn; exit 0
          fi
          ( cd functions-ranking && npm ci 2>&1 | tail -3 || npm install 2>&1 | tail -3 )
          # `npm test` deste codebase JÁ compila antes de rodar (`tsc && node --test`),
          # então este passo cobre typecheck e suíte de uma vez. As regras do
          # bloco de Ranking são provadas no passo 3c, contra o emulador.
          ( cd functions-ranking && npm test ) 2>&1 | tee t_rankingfn.log; echo ${PIPESTATUS[0]} > exit_rankingfn

      - name: "3f — codebase RANKING: integração contra o Firestore (emulador)"
        run: |
          set +e
          # FECHA A LACUNA QUE A OS ANTERIOR DECLAROU. O passo 3e prova a lógica
          # pura; este prova o que só o banco prova: transação, idempotência por
          # id de documento, concorrência (lost update) e paginação por cursor.
          #
          # Separado do 3d de propósito: o unitário não pode passar a exigir
          # emulador, senão deixa de rodar na máquina de quem está escrevendo.
          if [ ! -f functions-ranking/test/integracao.emulador.test.js ]; then
            echo "suíte de integração ausente" > nao_rankingint; exit 0
          fi
          npm i -g firebase-tools 2>&1 | tail -2
          ( cd functions-ranking && npx tsc ) 2>&1 | tail -3
          # Do mesmo lugar que o passo 3c: a raiz, onde mora o firebase.json.
          firebase emulators:exec --only firestore --project demo-bmv \
            "cd functions-ranking && node --test test/integracao.emulador.test.js" \
            2>&1 | tee t_rankingint.log
          echo ${PIPESTATUS[0]} > exit_rankingint

      - name: "3f3 — PASSE VIP DE CORTESIA: transacao e concorrencia (emulador)"
        run: |
          set +e
          # A SUITE TRANSACIONAL DO PASSE. O passo 3e (`rankingfn`) ja roda a
          # regra pura junto com o resto do codebase; este prova o que teste
          # puro nao alcanca: transacao, concorrencia, persistencia e a
          # recusa sobre documento corrompido.
          #
          # PROVA DE AUSENCIA. Se o arquivo sumir, este passo escreve
          # `nao_passeint` — e o agregador REPROVA em `nao_<gate>`, como o
          # cabecalho da fonte unica manda. Apagar a suite nao deixa o portao
          # verde; deixa vermelho, que e a unica resposta honesta.
          if [ ! -f functions-ranking/test/integracao.passe.emulador.test.js ]; then
            echo "suite transacional do passe ausente" > nao_passeint; exit 0
          fi
          npm i -g firebase-tools 2>&1 | tail -2
          ( cd functions-ranking && npx tsc ) 2>&1 | tail -3
          # Da raiz, onde mora o firebase.json — igual ao passo 3f.
          firebase emulators:exec --only firestore --project demo-bmv \
            "cd functions-ranking && node --test test/integracao.passe.emulador.test.js" \
            2>&1 | tee t_passeint.log
          echo ${PIPESTATUS[0]} > exit_passeint

      - name: "3c — codebase SOCIAL (functions-social): dominio Dart, typecheck e testes puros"
        run: |
          set +e
          if [ ! -f functions-social/package.json ]; then
            echo "functions-social/package.json ausente" > nao_socialfn; exit 0
          fi
          ( cd functions-social && npm ci 2>&1 | tail -3 || npm install 2>&1 | tail -3 )
          # `flutter pub get` em app/ ANTES do build:domain: `dart compile js`
          # precisa da resolucao de pacotes da arvore real, e nao do scaffold.
          ( cd app && flutter pub get 2>&1 | tail -2 )
          # A ordem importa, como nos outros codebases: o dominio Dart vira JS
          # antes do tsc, que compila contra ele. Este passo tambem e o que deixa
          # o codebase `social` CARREGAVEL pelo emulador do passo 3d — sem ele o
          # Emulator Suite falharia ao montar a Function.
          ( cd functions-social && npm run build:domain ) 2>&1 | tee t_socialdom.log
          echo ${PIPESTATUS[0]} > exit_socialdom
          ( cd functions-social && npm test ) 2>&1 | tee t_socialfn.log
          echo ${PIPESTATUS[0]} > exit_socialfn

      # GATE OBRIGATÓRIO 1/3 (fail-closed no portão final).
      - name: "3d — Functions SOCIAIS contra o Emulator Suite (chamadas reais)"
        if: ${{ !cancelled() }}
        run: |
          set +e
          echo "iniciado" > inicio_socialemu
          # Este gate existe porque a suite de regras, sozinha, NAO prova
          # idempotencia, concorrencia nem ausencia de UID nas RESPOSTAS. O runner
          # `com-functions.js` falha se o emulador de Functions nao estiver
          # atendendo, para que "verde" nunca signifique "pulado".
          if [ ! -f functions-social/lib/index.js ]; then
            echo "functions-social nao foi compilado no passo 3c" > nao_socialemu; exit 0
          fi
          npm i -g firebase-tools 2>&1 | tail -2
          ( cd firebase/testes && npm install 2>&1 | tail -3 )
          firebase emulators:exec --only firestore,auth,functions:social --project demo-bmv \
            "cd firebase/testes && npm run test:social:functions" 2>&1 | tee t_socialemu.log
          echo ${PIPESTATUS[0]} > exit_socialemu

      - name: "3f2 — INTEGRACAO IDENTIDADE x RANKING contra o emulador"
        run: |
          set +e
          # O GATE DA OS DE INTEGRACAO DE IDENTIDADE. Os passos 3c/3d provam o
          # social sozinho e os 3e/3f provam o ranking sozinho — com identidade de
          # FIXTURE dos dois lados. Este prova as DUAS IMPLEMENTACOES JUNTAS:
          # `garantirIdentidade` de functions-social emitindo, e
          # `processarResultadoOficial` de functions-ranking consumindo.
          #
          # E o unico lugar onde a concorrencia do §7 e testavel: seis chamadas
          # simultaneas para um jogador sem identidade tem que convergir para UM
          # publicId. Chamada sequencial nao cobre isso.
          if [ ! -f functions-social/test/integracao.identidade.emulador.test.js ]; then
            echo "suite de integracao de identidade ausente" > nao_identint; exit 0
          fi
          if [ ! -f functions-social/lib/index.js ]; then
            echo "functions-social nao foi compilado no passo 3c" > nao_identint; exit 0
          fi
          if [ ! -f functions-ranking/lib/firestore.js ]; then
            echo "functions-ranking nao foi compilado no passo 3e" > nao_identint; exit 0
          fi
          npm i -g firebase-tools 2>&1 | tail -2
          firebase emulators:exec --only firestore --project demo-bmv \
            "cd functions-social && node --test test/integracao.identidade.emulador.test.js" \
            2>&1 | tee t_identint.log
          echo ${PIPESTATUS[0]} > exit_identint

      - name: "3f3 — AUDITORIA de identidade em dry-run (read-only)"
        run: |
          set +e
          # §15 da OS de integracao: a ferramenta de auditoria tem que RODAR, e a
          # primeira execucao e obrigatoriamente dry-run. Aqui ela roda contra um
          # emulador vazio — o que se prova nao e "achou algo", e sim que a
          # ferramenta executa de ponta a ponta e que o portao a exercita.
          #
          # NAO usa --falhar-se-critico: banco vazio nao tem critico, e transformar
          # este passo em portao de CONTEUDO faria um dado legado real derrubar o
          # CI de uma branch que nao tem nada a ver com ele.
          if [ ! -f functions-social/scripts/auditar-identidade.js ]; then
            echo "runner da auditoria ausente" > nao_auditident; exit 0
          fi
          npm i -g firebase-tools 2>&1 | tail -2
          firebase emulators:exec --only firestore --project demo-bmv \
            "cd functions-social && node scripts/auditar-identidade.js" \
            2>&1 | tee t_auditident.log
          echo ${PIPESTATUS[0]} > exit_auditident

      - name: "3h — codebase MODERACAO (functions-moderacao): dominio Dart, typecheck e testes puros"
        run: |
          set +e
          # POR QUE ESTE PASSO NASCE AGORA, e nao com a OS de Moderacao:
          # `functions-moderacao` nunca teve gate. A codebase que hospeda denuncia,
          # bloqueio, sancao e `consultarContato` podia deixar de compilar sem o CI
          # dizer nada — o `npm test` dela existia e ninguem o chamava.
          if [ ! -f functions-moderacao/package.json ]; then
            echo "functions-moderacao/package.json ausente" > nao_moderacaofn; exit 0
          fi
          # `--include=dev` explicito: sem ele o `tsc` pode nao ser instalado, e a
          # falha aparece como "tsc: not found", que se confunde com PATH quebrado.
          ( cd functions-moderacao && npm ci --include=dev 2>&1 | tail -3 || npm install --include=dev 2>&1 | tail -3 )
          ( cd app && flutter pub get 2>&1 | tail -2 )
          # O dominio Dart vira JS ANTES do tsc, como nas outras codebases. Este
          # passo tambem e o que deixa o codebase `moderacao` CARREGAVEL pelo
          # emulador do passo 3i — sem ele o Emulator Suite falha ao montar a
          # Function, porque `domain.ts` lanca no CARREGAMENTO quando o bundle
          # falta (e isso e deliberado: bundle ausente tem que derrubar o deploy).
          ( cd functions-moderacao && npm run build:domain ) 2>&1 | tee t_moderacaodom.log
          dom=${PIPESTATUS[0]}
          if [ "$dom" != "0" ]; then
            echo "build:domain da moderacao falhou (exit $dom)" > nao_moderacaofn; exit 0
          fi
          ( cd functions-moderacao && npm test ) 2>&1 | tee t_moderacaofn.log
          echo ${PIPESTATUS[0]} > exit_moderacaofn

      - name: "3i — CHAT LIVRE contra o Emulator Suite (chamadas reais)"
        run: |
          set +e
          # Este gate existe porque nem a suite de dominio nem a de regras provam
          # o que a §15 da OS do Chat pede no limite real: anonimo recusado, retry
          # que NAO duplica sob transacao, concorrencia que NAO duplica, bloqueio
          # nas duas direcoes lido do Firestore, e denuncia recuperando a evidencia
          # server-side. Dominio prova a DECISAO; regra prova a AUTORIZACAO; so
          # este prova que a decisao chega ao banco.
          if [ ! -f functions-moderacao/lib/index.js ]; then
            echo "functions-moderacao nao foi compilado no passo 3h" > nao_chatemu; exit 0
          fi
          if [ ! -f functions-moderacao/test/integracao.chat.emulador.test.js ]; then
            echo "suite de integracao do chat ausente" > nao_chatemu; exit 0
          fi
          npm i -g firebase-tools 2>&1 | tail -2
          # O emulador carrega a codebase inteira e o bundle do dominio e grande;
          # 10s de descoberta padrao estouram e a falha aparece como se a suite
          # estivesse quebrada.
          export FUNCTIONS_DISCOVERY_TIMEOUT=120
          firebase emulators:exec --only firestore,auth,functions:moderacao --project demo-bmv \
            "cd functions-moderacao && node --test test/integracao.chat.emulador.test.js" 2>&1 | tee t_chatemu.log
          echo ${PIPESTATUS[0]} > exit_chatemu
      # GATE OBRIGATÓRIO 2/3 (fail-closed no portão final).
      - name: "3h — codebase MODERACAO: Moderação com Firebase Emulator (chamadas reais)"
        if: ${{ !cancelled() }}
        run: |
          set +e
          echo "iniciado" > inicio_moderacaoemu
          # POR QUE ESTE PASSO EXISTE, e o que ele NÃO é: até a OS do gate de
          # moderação, Moderação só era exercida no CI de raspão, dentro do gate
          # de coleções/regras do passo seguinte. Lá `moderacao.test.js` roda por
          # `node --test` puro, sem `FUNCTIONS_EMULATOR_HOST`, e os dois describes
          # de callable saem `# SKIP` — de propósito, porque aquele alvo prova
          # REGRAS. A conclusão incômoda é a que motivou aquela OS: nenhuma
          # chamada real às Functions de moderação jamais acontecia neste
          # workflow, e a única rede contra uma regressão em
          # `registrarDenuncia`/`bloquearJogador` era a memória de quem rodasse a
          # suíte à mão.
          #
          # NOME PRÓPRIO, e não um comando genérico: quando este passo fica
          # vermelho, o gate `moderacaoemu` diz QUAL suíte caiu.
          #
          # AQUI SE CHAMA O WRAPPER `emulador:moderacao`, e não o alvo interno
          # `test:moderacao:functions` como faz o passo 3d do social. A troca é
          # deliberada: o wrapper é AUTOCONTIDO (npm install + build:domain +
          # build em functions-moderacao), confere `java`, a trava do ambiente e
          # as portas antes de subir, dreno depois, e separa os desfechos em
          # classes com exit codes próprios (0 OK · 1 FALHA-FUNCIONAL ·
          # 3/4 INFRAESTRUTURA · 5 SUITE-INCOMPLETA · 6 CLEANUP-INCOMPLETO).
          # Qualquer um diferente de 0 reprova este passo.
          #
          # O piso de casos (`--esperado=45`) mora no alvo interno, em
          # firebase/testes/package.json, e é o wrapper que o aciona. Suíte que
          # encolher, pular ou cancelar sai como SUITE-INCOMPLETA, não como verde.
          if [ ! -f firebase/testes/package.json ]; then
            echo "firebase/testes/package.json ausente" > nao_moderacaoemu; exit 0
          fi
          if [ ! -f functions-moderacao/package.json ]; then
            echo "functions-moderacao/package.json ausente" > nao_moderacaoemu; exit 0
          fi
          npm i -g firebase-tools 2>&1 | tail -2
          # Dependências do HARNESS (`@firebase/rules-unit-testing`). Repetido
          # aqui, e não herdado do passo 3d, porque aquele passo pode sair cedo
          # quando o bundle social não existe — e Moderação não pode ficar refém.
          ( cd firebase/testes && npm install 2>&1 | tail -3 )
          ( cd firebase/testes && npm run emulador:moderacao ) 2>&1 | tee t_moderacaoemu.log
          echo ${PIPESTATUS[0]} > exit_moderacaoemu

      # GATE OBRIGATÓRIO 3/3 (fail-closed no portão final). Chamava-se `regras`;
      # virou `colecoesemu` na OS do fail-closed. Nem o comando, nem a suíte, nem
      # o que ele prova mudaram.
      - name: "3g — codebase COLECOES: regras + Functions no Emulator Suite"
        if: ${{ !cancelled() }}
        run: |
          set +e
          echo "iniciado" > inicio_colecoesemu
          # Caminho FIXO do harness de segurança. Ele não fica em
          # `<dir>/emulator-tests` nem em `functions/package.json`: fica em
          # firebase/testes/. Procurar pelos dois padrões antigos reportava
          # "sem harness" para um harness que existe — erro de descoberta, que
          # esta versão elimina.
          if [ ! -f firebase/testes/package.json ]; then
            echo "firebase/testes/package.json ausente" > nao_colecoesemu; exit 0
          fi
          if [ ! -f firebase.json ]; then
            echo "firebase.json ausente na raiz" > nao_colecoesemu; exit 0
          fi
          npm i -g firebase-tools 2>&1 | tail -2
          ( cd firebase/functions && npm install 2>&1 | tail -3 )
          ( cd firebase/testes && npm install 2>&1 | tail -3 )
          # `--project demo-bmv` mantém tudo no emulador: nenhum projeto real é
          # tocado e não é preciso credencial.
          # `test:integrado`, e não `npm test`: o alvo curto roda só segurança +
          # moderação + social + entitlement, e deixava rastreabilidade e ranking
          # fora do portão. Os SEIS blocos precisam ser provados no MESMO
          # firestore.rules, que é justamente onde um bloco novo poderia
          # afrouxar o do vizinho — e social e ranking são os dois que falam de
          # `publicId`, então separá-los esconderia a regressão que a OS de
          # integração de identidade existe para impedir.
          firebase emulators:exec --only firestore,auth,functions --project demo-bmv \
            "cd firebase/testes && npm run test:integrado" 2>&1 | tee t_colecoesemu.log
          echo ${PIPESTATUS[0]} > exit_colecoesemu

      # =====================================================================
      # [COMPOSICAO canonica] AS TRES CODEBASES QUE O CI NUNCA CONHECEU
      # =====================================================================
      #
      # `functions-conta`, `functions-mesas` e `functions-economia` sao
      # IMPLANTAVEIS — estao em firebase.json, cada uma com codebase propria —
      # e nao apareciam em passo nenhum deste arquivo. Nao e o mesmo defeito do
      # CI-02 (aquele era gate que RODAVA e o agregador ignorava); e o degrau
      # anterior: codebase que nem chegava a rodar. O efeito pratico e pior,
      # porque nem evidencia havia.
      #
      # Elas so ficaram visiveis quando a composicao juntou as nove numa arvore
      # so: nenhuma suite de folha podia enxergar isso, porque cada linhagem
      # via apenas as codebases que ela mesma trouxe. E a prova PN-07.

      - name: "3j — codebase CONTA (functions-conta): tsc + unitários"
        if: ${{ !cancelled() }}
        run: |
          set +e
          echo "iniciado" > inicio_contafn
          if [ ! -f functions-conta/package.json ]; then
            echo "functions-conta/package.json ausente" > nao_contafn; exit 0
          fi
          ( cd functions-conta && npm install 2>&1 | tail -3 )
          ( cd functions-conta && npm test ) 2>&1 | tee t_contafn.log
          echo ${PIPESTATUS[0]} > exit_contafn

      # A EXCLUSAO DE CONTA contra Firestore e Auth reais. Auth e obrigatorio e
      # nao e conveniencia: as etapas `trancar` e `encerrar` chamam `updateUser`,
      # `revokeRefreshTokens` e `deleteUser`. Sem o emulador de Auth a suite
      # tentaria falar com o Google de verdade.
      - name: "3j2 — EXCLUSÃO DE CONTA contra o Emulator Suite"
        if: ${{ !cancelled() }}
        run: |
          set +e
          echo "iniciado" > inicio_contaemu
          if [ ! -f functions-conta/package.json ]; then
            echo "functions-conta/package.json ausente" > nao_contaemu; exit 0
          fi
          npm i -g firebase-tools 2>&1 | tail -2
          ( cd functions-conta && npm install 2>&1 | tail -3 )
          ( cd functions-conta && npm run test:emulador ) 2>&1 | tee t_contaemu.log
          echo ${PIPESTATUS[0]} > exit_contaemu

      - name: "3k — codebase MESAS (functions-mesas): tsc + unitários"
        if: ${{ !cancelled() }}
        run: |
          set +e
          echo "iniciado" > inicio_mesasfn
          if [ ! -f functions-mesas/package.json ]; then
            echo "functions-mesas/package.json ausente" > nao_mesasfn; exit 0
          fi
          ( cd functions-mesas && npm install 2>&1 | tail -3 )
          ( cd functions-mesas && npm test ) 2>&1 | tee t_mesasfn.log
          echo ${PIPESTATUS[0]} > exit_mesasfn

      - name: "3l — codebase ECONOMIA (functions-economia): unitários"
        if: ${{ !cancelled() }}
        run: |
          set +e
          echo "iniciado" > inicio_economiafn
          if [ ! -f functions-economia/package.json ]; then
            echo "functions-economia/package.json ausente" > nao_economiafn; exit 0
          fi
          ( cd functions-economia && npm install 2>&1 | tail -3 )
          ( cd functions-economia && npm test ) 2>&1 | tee t_economiafn.log
          echo ${PIPESTATUS[0]} > exit_economiafn

      # =====================================================================
      # §16 e §19 — proveniência do SHA e provas negativas da composição
      # =====================================================================
      #
      # Rodam sobre o repositório inteiro (leem firebase.json, o firestore.rules,
      # este próprio workflow e a fonte única de gates), e por isso não pertencem
      # a nenhuma codebase. Não precisam de emulador, de Java nem de Flutter.

      - name: "4a — §16 proveniência de SHA das Functions"
        if: ${{ !cancelled() }}
        run: |
          set +e
          echo "iniciado" > inicio_proveni
          node --test ferramentas/proveniencia/proveniencia.test.js 2>&1 | tee t_proveni.log
          echo ${PIPESTATUS[0]} > exit_proveni

      - name: "4b — §19 provas negativas da composição"
        if: ${{ !cancelled() }}
        run: |
          set +e
          echo "iniciado" > inicio_composneg
          node --test ferramentas/composicao/negativas.test.js 2>&1 | tee t_composneg.log
          echo ${PIPESTATUS[0]} > exit_composneg

      - name: "4c — §6 gate da composição Loja/Casca ↔ Functions canônicas"
        if: ${{ !cancelled() }}
        run: |
          set +e
          # A costura de um nível acima do 4b: aquele guarda a união das NOVE
          # codebases; este guarda a árvore em que a Loja publicável e as
          # Functions canônicas passam a coexistir. Prova as duas folhas como
          # ANCESTRAIS (é por isso que o checkout acima é fundo), que nenhum
          # dos dois lados entrou só como documento, que os gates dos dois
          # sobreviveram à união da fonte única, e que a Loja não trouxe de
          # carona um segundo dono de sessão nem dado de maquete alcançável.
          echo "iniciado" > inicio_composloja
          node --test ferramentas/composicao/loja_functions.test.js 2>&1 | tee t_composloja.log
          echo ${PIPESTATUS[0]} > exit_composloja

      - name: Publicar evidência na branch ci-evidencias
        if: always()
        run: |
          # ESTE PASSO RODA SOB `bash -e`. O agregador abaixo retorna 1 quando
          # ha gate vermelho — que e o caso normal, nao um erro deste passo. Sem
          # `set +e` o step aborta na primeira chamada e a evidencia NAO chega a
          # ser escrita nem publicada, que foi o que aconteceu no run #13.
          set +e
          RUN="${{ github.run_number }}"; SHA="${{ github.sha }}"; BR="${{ github.ref_name }}"
          EV="run-${RUN}.md"
          FONTE=scripts/ci/gates_os_integracao.txt
          # A MESMA fonte que o agregador final lê. Era aqui que morava CI-02:
          # esta lista estava escrita à mão no YAML e tinha quatro gates a mais
          # do que a do portão, então `rankingfn`, `rankingint`, `identint` e
          # `auditident` apareciam na evidência, podiam falhar, e o portão
          # continuava verde. Copiar a relação para cá de novo é proibido.
          # `--listar` é o produtor canônico: a MESMA leitura que o veredito
          # percorre, e não uma segunda cópia dela. Aqui moravam um `sed | awk`
          # gêmeo do que vivia dentro do agregador E um ramo `else` que zerava a
          # relação quando a fonte sumia — dois leitores são duas autoridades em
          # potencial, e foi de duas listas que o CI-02 nasceu.
          #
          # Sem ramo alternativo de propósito: se a fonte não estiver lá,
          # `--listar` imprime a causa em stderr e sai 2, `GATES` fica vazio, e o
          # agregador logo abaixo registra o mesmo 2 em `portao_exit`. A evidência
          # continua sendo publicada — com a falha à vista, que é o ponto.
          GATES="$(bash scripts/ci/portao_os_integracao.sh --listar "$FONTE")"
          # O veredito impresso na evidência é o do próprio agregador, executado
          # aqui — e não uma segunda leitura que poderia discordar dele.
          bash scripts/ci/portao_os_integracao.sh "$FONTE" . > portao.txt 2>&1
          echo $? > portao_exit
          {
            echo "# Evidência CI — run ${RUN}"
            echo
            echo "- branch: \`${BR}\`"
            echo "- commit: \`${SHA}\`"
            echo "- data UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## Veredito do agregador (\`scripts/ci/portao_os_integracao.sh\`)"
            echo
            echo "Portão final: exit \`$(cat portao_exit 2>/dev/null || echo '?')\` — NÃO EXECUTADO reprova, exit vazio ou não numérico reprova."
            echo
            echo '```'; cat portao.txt 2>/dev/null; echo '```'
            echo
            echo "## Resultado por gate"
            echo
            echo "Gates obrigatórios lidos de \`$FONTE\` — a mesma fonte do agregador."
            echo
            echo "| gate | status | exit |"
            echo "|---|---|---|"
            for k in $GATES; do
              if [ -f "nao_$k" ]; then
                echo "| $k | **NÃO EXECUTADO (reprova)** | $(tr '\r\n' '  ' < "nao_$k") |"
              elif [ -f "exit_$k" ]; then
                v=$(tr -d ' \t\r\n' < "exit_$k")
                if [ "$v" = "0" ]; then echo "| $k | EXECUTADO | $v |"
                elif [ -z "$v" ]; then echo "| $k | **EXIT VAZIO (reprova)** | — |"
                else echo "| $k | **FALHOU** | $v |"
                fi
              else
                echo "| $k | **NÃO EXECUTADO (reprova)** | passo não chegou a rodar |"
              fi
            done
            if [ -f info_colevid ]; then
              echo
              echo "Fora do portão: \`evidencias_visuais\` exit \`$(cat info_colevid)\` (gerador de PNG)."
            fi
            echo
            echo "## flutter analyze (tail)"; echo '```'; tail -n 40 analyze.log 2>/dev/null; echo '```'
            for k in $GATES; do
              [ -f "t_$k.log" ] || continue
              echo "## $k (tail)"; echo '```'; tail -n 25 "t_$k.log"; echo '```'
            done
          } > "$EV"
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" evrepo
          cd evrepo
          git config user.email "ci@bmv.local"
          git config user.name "CI BMV Evidencias"
          if git ls-remote --exit-code origin ci-evidencias >/dev/null 2>&1; then
            # `-B ... FETCH_HEAD`, e nao `checkout ci-evidencias`: `git fetch`
            # com refspec avulso popula o FETCH_HEAD e NAO cria a branch local,
            # entao o checkout simples falhava com "pathspec did not match", o
            # commit caia na `main` do clone temporario e o push morria em "src
            # refspec does not match any". A branch `ci-evidencias` so tinha o
            # `run-1.md`, do unico run que passou pelo caminho do orphan: toda
            # evidencia posterior foi perdida em silencio, porque o step aborta
            # sob `bash -e` antes de imprimir a causa.
            git fetch --depth 1 origin ci-evidencias && git checkout -B ci-evidencias FETCH_HEAD
          else
            git checkout --orphan ci-evidencias && git rm -rf . >/dev/null 2>&1 || true
          fi
          cp "../$EV" .
          git add "$EV"
          git commit -m "ci(evidencia): run ${RUN} (${BR} @ ${SHA})"
          git push origin ci-evidencias

      - name: Portão verde/vermelho (fonte única; NÃO EXECUTADO reprova)
        if: always()
        run: |
          # Sem lista embutida e sem lógica embutida: os dois defeitos desta OS
          # nasceram de a decisão morar dentro do YAML, onde não se testa.
          # A relação está em scripts/ci/gates_os_integracao.txt e a decisão em
          # scripts/ci/portao_os_integracao.sh, que tem matriz própria no gate
          # `portaoci`. Se o agregador sumir, `bash` sai não-zero e o portão
          # fica vermelho — falha fechada, que é o comportamento desejado.
          # FASE B do contrato de conteúdo: o log. Fecha as duas formas de
          # ficar verde sem ter rodado — marcador FABRICADO (um `exit_<gate>`
          # com `0` dentro e nenhum log ao lado) e evidência de OUTRA EXECUÇÃO
          # (log mais velho que o carimbo escrito no passo "0"). Também é aqui
          # que o piso de casos EXECUTADOS é conferido: contagem estática não
          # vê caso gerado em laço.
          bash scripts/ci/verificar_contrato_suites.sh . .github/workflows/ci-os-integracao.yml .
          bash scripts/ci/portao_os_integracao.sh scripts/ci/gates_os_integracao.txt .
