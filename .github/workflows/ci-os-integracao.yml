      - name: "3h — codebase MODERACAO (functions-moderacao): dominio Dart, typecheck e testes puros"
        run: |
          set +e
          # POR QUE ESTE PASSO NASCE AGORA, e nao com a OS de Moderacao:
          # `functions-moderacao` nunca teve gate. A codebase que hospeda denuncia,
          # bloqueio, sancao e `consultarContato` podia deixar de compilar sem o CI
          # dizer nada — o `npm test` dela existia e ninguem o chamava.
          if [ ! -f functions-moderacao/package.json ]; then
            echo "functions-moderacao/package.json ausente" > nao_moderacaofn; exit 0
          fi
          # `--include=dev` explicito: sem ele o `tsc` pode nao ser instalado, e a
          # falha aparece como "tsc: not found", que se confunde com PATH quebrado.
          ( cd functions-moderacao && npm ci --include=dev 2>&1 | tail -3 || npm install --include=dev 2>&1 | tail -3 )
          ( cd app && flutter pub get 2>&1 | tail -2 )
          # O dominio Dart vira JS ANTES do tsc, como nas outras codebases. Este
          # passo tambem e o que deixa o codebase `moderacao` CARREGAVEL pelo
          # emulador do passo 3i — sem ele o Emulator Suite falha ao montar a
          # Function, porque `domain.ts` lanca no CARREGAMENTO quando o bundle
          # falta (e isso e deliberado: bundle ausente tem que derrubar o deploy).
          ( cd functions-moderacao && npm run build:domain ) 2>&1 | tee t_moderacaodom.log
          dom=${PIPESTATUS[0]}
          if [ "$dom" != "0" ]; then
            echo "build:domain da moderacao falhou (exit $dom)" > nao_moderacaofn; exit 0
          fi
          ( cd functions-moderacao && npm test ) 2>&1 | tee t_moderacaofn.log
          echo ${PIPESTATUS[0]} > exit_moderacaofn

      - name: "3i — CHAT LIVRE contra o Emulator Suite (chamadas reais)"
        run: |
          set +e
          # Este gate existe porque nem a suite de dominio nem a de regras provam
          # o que a §15 da OS do Chat pede no limite real: anonimo recusado, retry
          # que NAO duplica sob transacao, concorrencia que NAO duplica, bloqueio
          # nas duas direcoes lido do Firestore, e denuncia recuperando a evidencia
          # server-side. Dominio prova a DECISAO; regra prova a AUTORIZACAO; so
          # este prova que a decisao chega ao banco.
          if [ ! -f functions-moderacao/lib/index.js ]; then
            echo "functions-moderacao nao foi compilado no passo 3h" > nao_chatemu; exit 0
          fi
          if [ ! -f functions-moderacao/test/integracao.chat.emulador.test.js ]; then
            echo "suite de integracao do chat ausente" > nao_chatemu; exit 0
          fi
          npm i -g firebase-tools 2>&1 | tail -2
          # O emulador carrega a codebase inteira e o bundle do dominio e grande;
          # 10s de descoberta padrao estouram e a falha aparece como se a suite
          # estivesse quebrada.
          export FUNCTIONS_DISCOVERY_TIMEOUT=120
          firebase emulators:exec --only firestore,auth,functions:moderacao --project demo-bmv \
            "cd functions-moderacao && node --test test/integracao.chat.emulador.test.js" 2>&1 | tee t_chatemu.log
          echo ${PIPESTATUS[0]} > exit_chatemu
      # GATE OBRIGATÓRIO 2/3 (fail-closed no portão final).
      - name: "3h — codebase MODERACAO: Moderação com Firebase Emulator (chamadas reais)"
        if: ${{ !cancelled() }}
        run: |
          set +e
          echo "iniciado" > inicio_moderacaoemu
          # POR QUE ESTE PASSO EXISTE, e o que ele NÃO é: até a OS do gate de
          # moderação, Moderação só era exercida no CI de raspão, dentro do gate
          # de coleções/regras do passo seguinte. Lá `moderacao.test.js` roda por
          # `node --test` puro, sem `FUNCTIONS_EMULATOR_HOST`, e os dois describes
          # de callable saem `# SKIP` — de propósito, porque aquele alvo prova
          # REGRAS. A conclusão incômoda é a que motivou aquela OS: nenhuma
          # chamada real às Functions de moderação jamais acontecia neste
          # workflow, e a única rede contra uma regressão em
          # `registrarDenuncia`/`bloquearJogador` era a memória de quem rodasse a
          # suíte à mão.
          #
          # NOME PRÓPRIO, e não um comando genérico: quando este passo fica
          # vermelho, o gate `moderacaoemu` diz QUAL suíte caiu.
          #
          # AQUI SE CHAMA O WRAPPER `emulador:moderacao`, e não o alvo interno
          # `test:moderacao:functions` como faz o passo 3d do social. A troca é
          # deliberada: o wrapper é AUTOCONTIDO (npm install + build:domain +
          # build em functions-moderacao), confere `java`, a trava do ambiente e
          # as portas antes de subir, dreno depois, e separa os desfechos em
          # classes com exit codes próprios (0 OK · 1 FALHA-FUNCIONAL ·
          # 3/4 INFRAESTRUTURA · 5 SUITE-INCOMPLETA · 6 CLEANUP-INCOMPLETO).
          # Qualquer um diferente de 0 reprova este passo.
          #
          # O piso de casos (`--esperado=45`) mora no alvo interno, em
          # firebase/testes/package.json, e é o wrapper que o aciona. Suíte que
          # encolher, pular ou cancelar sai como SUITE-INCOMPLETA, não como verde.
          if [ ! -f firebase/testes/package.json ]; then
            echo "firebase/testes/package.json ausente" > nao_moderacaoemu; exit 0
          fi
          if [ ! -f functions-moderacao/package.json ]; then
            echo "functions-moderacao/package.json ausente" > nao_moderacaoemu; exit 0
          fi
          npm i -g firebase-tools 2>&1 | tail -2
          # Dependências do HARNESS (`@firebase/rules-unit-testing`). Repetido
          # aqui, e não herdado do passo 3d, porque aquele passo pode sair cedo
          # quando o bundle social não existe — e Moderação não pode ficar refém.
          ( cd firebase/testes && npm install 2>&1 | tail -3 )
          ( cd firebase/testes && npm run emulador:moderacao ) 2>&1 | tee t_moderacaoemu.log
          echo ${PIPESTATUS[0]} > exit_moderacaoemu

      # GATE OBRIGATÓRIO 3/3 (fail-closed no portão final). Chamava-se `regras`;
      # virou `colecoesemu` na OS do fail-closed. Nem o comando, nem a suíte, nem
      # o que ele prova mudaram.
      - name: "3g — codebase COLECOES: regras + Functions no Emulator Suite"
        if: ${{ !cancelled() }}
        run: |
          set +e
          echo "iniciado" > inicio_colecoesemu
          # Caminho FIXO do harness de segurança. Ele não fica em
          # `<dir>/emulator-tests` nem em `functions/package.json`: fica em
          # firebase/testes/. Procurar pelos dois padrões antigos reportava
          # "sem harness" para um harness que existe — erro de descoberta, que
          # esta versão elimina.
          if [ ! -f firebase/testes/package.json ]; then
            echo "firebase/testes/package.json ausente" > nao_colecoesemu; exit 0
          fi
          if [ ! -f firebase.json ]; then
            echo "firebase.json ausente na raiz" > nao_colecoesemu; exit 0
          fi
          npm i -g firebase-tools 2>&1 | tail -2
          ( cd firebase/functions && npm install 2>&1 | tail -3 )
          ( cd firebase/testes && npm install 2>&1 | tail -3 )
          # `--project demo-bmv` mantém tudo no emulador: nenhum projeto real é
          # tocado e não é preciso credencial.
          # `test:integrado`, e não `npm test`: o alvo curto roda só segurança +
          # moderação + social + entitlement, e deixava rastreabilidade e ranking
          # fora do portão. Os SEIS blocos precisam ser provados no MESMO
          # firestore.rules, que é justamente onde um bloco novo poderia
          # afrouxar o do vizinho — e social e ranking são os dois que falam de
          # `publicId`, então separá-los esconderia a regressão que a OS de
          # integração de identidade existe para impedir.
          firebase emulators:exec --only firestore,auth,functions --project demo-bmv \
            "cd firebase/testes && npm run test:integrado" 2>&1 | tee t_colecoesemu.log
          echo ${PIPESTATUS[0]} > exit_colecoesemu

      # =====================================================================
      # [COMPOSICAO canonica] AS TRES CODEBASES QUE O CI NUNCA CONHECEU
      # =====================================================================
      #
      # `functions-conta`, `functions-mesas` e `functions-economia` sao
      # IMPLANTAVEIS — estao em firebase.json, cada uma com codebase propria —
      # e nao apareciam em passo nenhum deste arquivo. Nao e o mesmo defeito do
      # CI-02 (aquele era gate que RODAVA e o agregador ignorava); e o degrau
      # anterior: codebase que nem chegava a rodar. O efeito pratico e pior,
      # porque nem evidencia havia.
      #
      # Elas so ficaram visiveis quando a composicao juntou as nove numa arvore
      # so: nenhuma suite de folha podia enxergar isso, porque cada linhagem
      # via apenas as codebases que ela mesma trouxe. E a prova PN-07.

      - name: "3j — codebase CONTA (functions-conta): tsc + unitários"
        if: ${{ !cancelled() }}
        run: |
          set +e
          echo "iniciado" > inicio_contafn
          if [ ! -f functions-conta/package.json ]; then
            echo "functions-conta/package.json ausente" > nao_contafn; exit 0
          fi
          ( cd functions-conta && npm install 2>&1 | tail -3 )
          ( cd functions-conta && npm test ) 2>&1 | tee t_contafn.log
          echo ${PIPESTATUS[0]} > exit_contafn

      # A EXCLUSAO DE CONTA contra Firestore e Auth reais. Auth e obrigatorio e
      # nao e conveniencia: as etapas `trancar` e `encerrar` chamam `updateUser`,
      # `revokeRefreshTokens` e `deleteUser`. Sem o emulador de Auth a suite
      # tentaria falar com o Google de verdade.
      - name: "3j2 — EXCLUSÃO DE CONTA contra o Emulator Suite"
        if: ${{ !cancelled() }}
        run: |
          set +e
          echo "iniciado" > inicio_contaemu
          if [ ! -f functions-conta/package.json ]; then
            echo "functions-conta/package.json ausente" > nao_contaemu; exit 0
          fi
          npm i -g firebase-tools 2>&1 | tail -2
          ( cd functions-conta && npm install 2>&1 | tail -3 )
          ( cd functions-conta && npm run test:emulador ) 2>&1 | tee t_contaemu.log
          echo ${PIPESTATUS[0]} > exit_contaemu

      - name: "3k — codebase MESAS (functions-mesas): tsc + unitários"
        if: ${{ !cancelled() }}
        run: |
          set +e
          echo "iniciado" > inicio_mesasfn
          if [ ! -f functions-mesas/package.json ]; then
            echo "functions-mesas/package.json ausente" > nao_mesasfn; exit 0
          fi
          ( cd functions-mesas && npm install 2>&1 | tail -3 )
          ( cd functions-mesas && npm test ) 2>&1 | tee t_mesasfn.log
          echo ${PIPESTATUS[0]} > exit_mesasfn

      - name: "3l — codebase ECONOMIA (functions-economia): unitários"
        if: ${{ !cancelled() }}
        run: |
          set +e
          echo "iniciado" > inicio_economiafn
          if [ ! -f functions-economia/package.json ]; then
            echo "functions-economia/package.json ausente" > nao_economiafn; exit 0
          fi
          ( cd functions-economia && npm install 2>&1 | tail -3 )
          ( cd functions-economia && npm test ) 2>&1 | tee t_economiafn.log
          echo ${PIPESTATUS[0]} > exit_economiafn

      # =====================================================================
      # §16 e §19 — proveniência do SHA e provas negativas da composição
      # =====================================================================
      #
      # Rodam sobre o repositório inteiro (leem firebase.json, o firestore.rules,
      # este próprio workflow e a fonte única de gates), e por isso não pertencem
      # a nenhuma codebase. Não precisam de emulador, de Java nem de Flutter.

      - name: "4a — §16 proveniência de SHA das Functions"
        if: ${{ !cancelled() }}
        run: |
          set +e
          echo "iniciado" > inicio_proveni
          node --test ferramentas/proveniencia/proveniencia.test.js 2>&1 | tee t_proveni.log
          echo ${PIPESTATUS[0]} > exit_proveni

      - name: "4b — §19 provas negativas da composição"
        if: ${{ !cancelled() }}
        run: |
          set +e
          echo "iniciado" > inicio_composneg
          node --test ferramentas/composicao/negativas.test.js 2>&1 | tee t_composneg.log
          echo ${PIPESTATUS[0]} > exit_composneg

      - name: "4c — §6 gate da composição Loja/Casca ↔ Functions canônicas"
        if: ${{ !cancelled() }}
        run: |
          set +e
          # A costura de um nível acima do 4b: aquele guarda a união das NOVE
          # codebases; este guarda a árvore em que a Loja publicável e as
          # Functions canônicas passam a coexistir. Prova as duas folhas como
          # ANCESTRAIS (é por isso que o checkout acima é fundo), que nenhum
          # dos dois lados entrou só como documento, que os gates dos dois
          # sobreviveram à união da fonte única, e que a Loja não trouxe de
          # carona um segundo dono de sessão nem dado de maquete alcançável.
          echo "iniciado" > inicio_composloja
          node --test ferramentas/composicao/loja_functions.test.js 2>&1 | tee t_composloja.log
          echo ${PIPESTATUS[0]} > exit_composloja

      - name: Publicar evidência na branch ci-evidencias
        if: always()
        run: |
          # ESTE PASSO RODA SOB `bash -e`. O agregador abaixo retorna 1 quando
          # ha gate vermelho — que e o caso normal, nao um erro deste passo. Sem
          # `set +e` o step aborta na primeira chamada e a evidencia NAO chega a
          # ser escrita nem publicada, que foi o que aconteceu no run #13.
          set +e
          RUN="${{ github.run_number }}"; SHA="${{ github.sha }}"; BR="${{ github.ref_name }}"
          EV="run-${RUN}.md"
          FONTE=scripts/ci/gates_os_integracao.txt
          # A MESMA fonte que o agregador final lê. Era aqui que morava CI-02:
          # esta lista estava escrita à mão no YAML e tinha quatro gates a mais
          # do que a do portão, então `rankingfn`, `rankingint`, `identint` e
          # `auditident` apareciam na evidência, podiam falhar, e o portão
          # continuava verde. Copiar a relação para cá de novo é proibido.
          # `--listar` é o produtor canônico: a MESMA leitura que o veredito
          # percorre, e não uma segunda cópia dela. Aqui moravam um `sed | awk`
          # gêmeo do que vivia dentro do agregador E um ramo `else` que zerava a
          # relação quando a fonte sumia — dois leitores são duas autoridades em
          # potencial, e foi de duas listas que o CI-02 nasceu.
          #
          # Sem ramo alternativo de propósito: se a fonte não estiver lá,
          # `--listar` imprime a causa em stderr e sai 2, `GATES` fica vazio, e o
          # agregador logo abaixo registra o mesmo 2 em `portao_exit`. A evidência
          # continua sendo publicada — com a falha à vista, que é o ponto.
          GATES="$(bash scripts/ci/portao_os_integracao.sh --listar "$FONTE")"
          # O veredito impresso na evidência é o do próprio agregador, executado
          # aqui — e não uma segunda leitura que poderia discordar dele.
          bash scripts/ci/portao_os_integracao.sh "$FONTE" . > portao.txt 2>&1
          echo $? > portao_exit
          {
            echo "# Evidência CI — run ${RUN}"
            echo
            echo "- branch: \`${BR}\`"
            echo "- commit: \`${SHA}\`"
            echo "- data UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## Veredito do agregador (\`scripts/ci/portao_os_integracao.sh\`)"
            echo
            echo "Portão final: exit \`$(cat portao_exit 2>/dev/null || echo '?')\` — NÃO EXECUTADO reprova, exit vazio ou não numérico reprova."
            echo
            echo '```'; cat portao.txt 2>/dev/null; echo '```'
            echo
            echo "## Resultado por gate"
            echo
            echo "Gates obrigatórios lidos de \`$FONTE\` — a mesma fonte do agregador."
            echo
            echo "| gate | status | exit |"
            echo "|---|---|---|"
            for k in $GATES; do
              if [ -f "nao_$k" ]; then
                echo "| $k | **NÃO EXECUTADO (reprova)** | $(tr '\r\n' '  ' < "nao_$k") |"
              elif [ -f "exit_$k" ]; then
                v=$(tr -d ' \t\r\n' < "exit_$k")
                if [ "$v" = "0" ]; then echo "| $k | EXECUTADO | $v |"
                elif [ -z "$v" ]; then echo "| $k | **EXIT VAZIO (reprova)** | — |"
                else echo "| $k | **FALHOU** | $v |"
                fi
              else
                echo "| $k | **NÃO EXECUTADO (reprova)** | passo não chegou a rodar |"
              fi
            done
            if [ -f info_colevid ]; then
              echo
              echo "Fora do portão: \`evidencias_visuais\` exit \`$(cat info_colevid)\` (gerador de PNG)."
            fi
            echo
            echo "## flutter analyze (tail)"; echo '```'; tail -n 40 analyze.log 2>/dev/null; echo '```'
            for k in $GATES; do
              [ -f "t_$k.log" ] || continue
              echo "## $k (tail)"; echo '```'; tail -n 25 "t_$k.log"; echo '```'
            done
          } > "$EV"
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" evrepo
          cd evrepo
          git config user.email "ci@bmv.local"
          git config user.name "CI BMV Evidencias"
          if git ls-remote --exit-code origin ci-evidencias >/dev/null 2>&1; then
            # `-B ... FETCH_HEAD`, e nao `checkout ci-evidencias`: `git fetch`
            # com refspec avulso popula o FETCH_HEAD e NAO cria a branch local,
            # entao o checkout simples falhava com "pathspec did not match", o
            # commit caia na `main` do clone temporario e o push morria em "src
            # refspec does not match any". A branch `ci-evidencias` so tinha o
            # `run-1.md`, do unico run que passou pelo caminho do orphan: toda
            # evidencia posterior foi perdida em silencio, porque o step aborta
            # sob `bash -e` antes de imprimir a causa.
            git fetch --depth 1 origin ci-evidencias && git checkout -B ci-evidencias FETCH_HEAD
          else
            git checkout --orphan ci-evidencias && git rm -rf . >/dev/null 2>&1 || true
          fi
          cp "../$EV" .
          git add "$EV"
          git commit -m "ci(evidencia): run ${RUN} (${BR} @ ${SHA})"
          git push origin ci-evidencias

      - name: Portão verde/vermelho (fonte única; NÃO EXECUTADO reprova)
        if: always()
        run: |
          # Sem lista embutida e sem lógica embutida: os dois defeitos desta OS
          # nasceram de a decisão morar dentro do YAML, onde não se testa.
          # A relação está em scripts/ci/gates_os_integracao.txt e a decisão em
          # scripts/ci/portao_os_integracao.sh, que tem matriz própria no gate
          # `portaoci`. Se o agregador sumir, `bash` sai não-zero e o portão
          # fica vermelho — falha fechada, que é o comportamento desejado.
          # FASE B do contrato de conteúdo: o log. Fecha as duas formas de
          # ficar verde sem ter rodado — marcador FABRICADO (um `exit_<gate>`
          # com `0` dentro e nenhum log ao lado) e evidência de OUTRA EXECUÇÃO
          # (log mais velho que o carimbo escrito no passo "0"). Também é aqui
          # que o piso de casos EXECUTADOS é conferido: contagem estática não
          # vê caso gerado em laço.
          bash scripts/ci/verificar_contrato_suites.sh . .github/workflows/ci-os-integracao.yml .
          bash scripts/ci/portao_os_integracao.sh scripts/ci/gates_os_integracao.txt .
