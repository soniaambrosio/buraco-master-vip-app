name: CI OS Integração (analyze + suítes + codebases Firebase)

# Autoridade de validação da OS "Integração Final Backend ↔ Flutter".
#
# Escopo (executa "quando aplicável", nunca afrouxa teste para ficar verde):
#   1. flutter analyze  (erro é fatal; warning/info não)
#   2. flutter test — Motor de Partidas, encerramento, torneios, integração,
#      coleções/Kit Pioneiros e domínio social
#   3. as codebases Firebase, cada uma descoberta pelo próprio caminho:
#        colecoes -> firebase/functions   + regras em firebase/testes (emulador)
#        billing  -> functions-billing    (node --test, sem emulador)
#        torneios -> functions            (tsc --noEmit)
#        ranking  -> functions-ranking    (tsc + node --test)
#        social   -> functions-social     (dart compile js + tsc + node --test,
#                                          e um passo PRÓPRIO de Emulator Suite
#                                          com chamadas reais às callables)
#      As regras rodam por `test:integrado`, que prova os cinco blocos de
#      firestore.rules cobertos por suíte no MESMO arquivo.
#      NÃO COBERTO, e registrado como tal: `functions-moderacao` não tem passo
#      próprio aqui. É anterior a esta OS e está fora do escopo dela.
#
# NENHUM GATE FOI REMOVIDO NEM AFROUXADO por estas adições (OS Identidade Pública
# §38, OS Política Competitiva, OS de integração de identidade). Os gates de
# social são: `social` (domínio Dart), `socialdom` (o bundle do domínio compila),
# `socialfn` (typecheck + testes puros do codebase) e `socialemu` (Functions
# reais no emulador). Os de ranking são `rankingfn` e `rankingint`. As Rules dos
# dois blocos entram no gate `regras` que já existia, porque
# `firebase/testes/npm run test:integrado` passou a incluir `social.test.js` e
# `ranking.test.js` no MESMO arquivo de regras.
#
# A OS DE INTEGRAÇÃO DE IDENTIDADE acrescentou dois gates, e nenhum substitui os
# de cima: `identint` roda as DUAS implementações juntas (emissão social +
# consumo competitivo, e a concorrência de seis chamadas simultâneas para um
# jogador sem identidade), e `auditident` exercita a auditoria de legado em
# dry-run. Os gates existentes provam cada lado sozinho, com identidade de
# fixture — que é uma afirmação sobre o que o vizinho produz, e não a coisa.
#
# REGRA DURA DE HONESTIDADE: nada aqui pode sair como NÃO EXECUTADO por erro de
# descoberta. Cada codebase tem caminho FIXO, declarado abaixo; se o caminho
# existe e mesmo assim não roda, o motivo é impresso e o gate falha. NÃO
# EXECUTADO é reservado a ausência real do artefato.
#
# Evidência (logs + exit codes + NÃO EXECUTADOs) é publicada na branch
# `ci-evidencias`, auditável mesmo sem acesso à API do GitHub.
#
# NÃO gera APK, NÃO faz deploy, NÃO roda em main/master/consolidacao.

on:
  push:
    branches:
      - integracao/os-final-backend-flutter
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (exigido pelo emulador do Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node (firebase-tools e testes das Functions)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Flutter (versão pinada do build oficial)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8

      - name: Scaffold do projeto Flutter
        run: flutter create --org com.buracomastervip.poc --project-name buraco_master_vip app_build

      # As dependências são as do REPOSITÓRIO, não as que o CI resolver na hora.
      # Antes daqui havia `flutter pub add` + um remendo Python no pubspec para
      # travar o jni: os dois sumiram porque `app/pubspec.yaml` (com
      # `dependency_overrides`) e `app/pubspec.lock` agora são a fonte da verdade.
      - name: Dependências versionadas (pubspec.yaml + pubspec.lock do repo)
        run: |
          cp app/pubspec.yaml app/pubspec.lock app_build/
          cd app_build && flutter pub get

      - name: Overlay do código e dos assets REAIS
        run: |
          cp -R app/lib/. app_build/lib/
          # `-name '*.dart'` excluído de propósito: há .dart soltos versionados
          # dentro de app/assets/ (cópias antigas de tela, que ninguém importa).
          # Copiá-los faria o analyze reprovar por lixo de árvore, não por código
          # nosso. A remoção deles é decisão registrada à parte.
          cd app && find assets -type f ! -name '*.dart' -exec sh -c 'mkdir -p "../app_build/$(dirname "$1")" && cp "$1" "../app_build/$1"' _ {} \;

      - name: Copiar suítes de teste + seeds
        run: |
          mkdir -p app_build/test/torneios/data app_build/test/integracao app_build/test/colecoes/data
          cp -R app/test/. app_build/test/
          cp app/data/torneios/*.json app_build/test/torneios/data/
          cp app/data/colecoes/*.json app_build/test/colecoes/data/
          # O widget_test.dart do scaffold tem erro pré-existente conhecido.
          rm -f app_build/test/widget_test.dart

      - name: "1+2 — analyze + suítes Flutter (captura exit codes sem abortar)"
        run: |
          set +e
          ( cd app_build && flutter analyze --no-fatal-infos --no-fatal-warnings ) 2>&1 | tee analyze.log; echo ${PIPESTATUS[0]} > exit_analyze
          roda() { # roda <chave> <caminho>
            local k="$1" t="$2"
            if [ ! -f "app_build/$t" ]; then echo "ausente: $t" > "nao_$k"; return; fi
            ( cd app_build && flutter test "$t" --reporter expanded ) 2>&1 | tee "t_$k.log"; echo ${PIPESTATUS[0]} > "exit_$k"
          }
          # exige() é roda() com UMA diferença: arquivo ausente é FALHA, e não
          # "NÃO EXECUTADO".
          #
          # POR QUE AS DUAS FUNÇÕES COEXISTEM. `roda` está certa para o que ela
          # cobre: "NÃO EXECUTADO" é reservado à ausência real do artefato, e há
          # suítes neste portão que nasceram depois de branches que não as têm —
          # transformar toda ausência histórica em vermelho reprovaria trabalho
          # que nunca prometeu tê-las. Mas isso abre um buraco para quem chega
          # DEPOIS: apagar ou renomear a suíte é indistinguível, para o portão,
          # de uma branch antiga que nunca a teve. O gate que existe para vigiar
          # uma correção some junto com o arquivo que ele vigia, e o portão sai
          # verde exatamente no caso que ele existia para pegar.
          #
          # `exige` fecha isso SÓ para as suítes listadas com ela. A verificação
          # é do próprio workflow e olha o CAMINHO no disco — não pergunta nada à
          # suíte, que é o que a torna válida justamente quando a suíte não está
          # mais lá. Renomear também derruba: o caminho declarado aqui é o
          # contrato, e um arquivo com outro nome não o satisfaz.
          exige() { # exige <chave> <caminho>
            local k="$1" t="$2"
            if [ ! -f "app_build/$t" ]; then
              {
                echo "SUÍTE OBRIGATÓRIA AUSENTE: $t"
                echo "Ela foi apagada ou renomeada. Este gate é obrigatório: se a"
                echo "suíte deixou de existir de propósito, é a lista de exige()"
                echo "em ci-os-integracao.yml que se atualiza — de propósito, e"
                echo "não de passagem."
              } | tee "t_$k.log"
              echo 1 > "exit_$k"
              return
            fi
            ( cd app_build && flutter test "$t" --reporter expanded ) 2>&1 | tee "t_$k.log"; echo ${PIPESTATUS[0]} > "exit_$k"
          }
          # CARIMBO DA ÂNCORA DAS PROVAS VISUAIS (OS 29-C6).
          #
          # Escrito ANTES de qualquer suíte rodar, e por isso mais VELHO que
          # todo log desta execução. É o que distingue "as suítes rodaram
          # agora" de "alguém guardou os logs de uma corrida antiga e os
          # reapresentou": `ancoravis` exige que cada log seja posterior a ele.
          # A ORDEM AQUI FAZ PARTE DO CONTRATO (OS 29-C7): limpeza, carimbo novo,
          # suites protegidas, logs, `ancoravis`, `autancora`, veredito. A OS 29-R5
          # mediu o que a mera presenca do produtor nao prova: deslocado para
          # DEPOIS das suites, o carimbo passa a ser mais novo que os logs e a
          # comparacao que denuncia evidencia reapresentada inverte de sinal.
          #
          # O carimbo tambem viaja por AMBIENTE. Um arquivo `carimbo_ancoravis`
          # guardado de outra corrida e reapresentado nao casa com o valor que este
          # shell acabou de gerar, e a ancora reprova nominalmente.
          rm -f carimbo_ancoravis porta_ancoravis t_cascaaud.log t_mesac1.log t_ancoravis.log t_autancora.log exit_cascaaud exit_mesac1 exit_ancoravis exit_autancora nao_cascaaud nao_mesac1 nao_ancoravis nao_autancora
          BMV_PORTA_ANCORAVIS=alvo-oficial
          BMV_CARIMBO_ANCORAVIS="$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)-$$-${RANDOM}"
          export BMV_PORTA_ANCORAVIS BMV_CARIMBO_ANCORAVIS
          printf '%s' "$BMV_PORTA_ANCORAVIS" > porta_ancoravis
          printf '%s' "$BMV_CARIMBO_ANCORAVIS" > carimbo_ancoravis
          roda motor      test/teste_motor.dart
          roda resil      test/teste_motor_resiliencia.dart
          roda encerr     test/teste_encerramento.dart
          roda torneios   test/torneios/reward_grants_test.dart
          roda mtorneios  test/torneios/motor_torneios_test.dart
          roda integr     test/integracao/teste_integracao_motores.dart
          roda colarte    test/colecoes/colecao_arte_test.dart
          roda colfire    test/colecoes/colecao_firebase_test.dart
          roda colkit     test/colecoes/kit_pioneiros_test.dart
          # OS Identidade Publica e Grafo Social: o dominio puro (apelido,
          # publicId, estados da amizade, limites, paginacao). Autorizacao e
          # provada pelas Rules, no gate `regras`.
          roda social     test/social/teste_social.dart
          # OS Casca de Produção: o roteamento por sessão (Splash → Login/Home),
          # o logout que derruba socket e pilha, e a auditoria estrutural que
          # impede a volta do segundo dono de autenticação, da rota que alcança
          # maquete e do dado pessoal no código distribuído.
          roda casca      test/casca/casca_producao_test.dart
          roda cascaaud   test/casca/auditoria_casca_test.dart
          # OS Identidade do Perfil Publico Visitado: quando A abre o perfil de
          # B, os QUATRO campos — nome, avatar, liga e numeros — vem do
          # `publicId` de B. O defeito que este gate fecha nao quebrava nada:
          # a tela montava uma pessoa que nao existe, com a liga de B e o nome e
          # o avatar de quem estava olhando, e so um teste de identidade cruzada
          # com fixtures bem diferentes o denuncia.
          roda perfilvis  test/perfil/identidade_visitada_test.dart
          # OS A11Y-1 Mesa de Treino audível e tocável: a caracterização da mesa
          # ANTES da correção (a partida não pode ter regredido) e a prova de
          # que ela ficou audível e tocável DEPOIS. O segundo mede a faixa de
          # toque TOCANDO ponto a ponto e lê a árvore semântica compilada — não
          # procura `Semantics` no código, que é o teste que passa com um
          # `Semantics` vazio.
          #
          # As duas entram por `exige`, e não por `roda`: são os gates de uma
          # correção de acessibilidade, e um gate de correção que desaparece
          # junto com o próprio arquivo não vigia nada.
          exige mesacar    test/casca/mesa_treino_caracterizacao_test.dart
          exige mesaa11y   test/casca/mesa_treino_acessivel_test.dart
          # OS 29-C1 — alvos reais. A OS 29 foi reprovada por uma linha da
          # matriz: o piso de toque exigido é 48 pontos, e a correção parou em
          # 24–25,3 na carta e nos 38 herdados dos controles laterais. Estas
          # duas suítes são o portão do que faltava.
          #
          # `mesac1` mede na mesa montada: toca ponto a ponto, lê o retângulo de
          # cada nó semântico e confere o piso nos DOIS eixos, com a mão em uma
          # e em duas fileiras. `disposicao` exercita a regra sozinha, sem tela,
          # em toda largura de 240 a 1200 — o que a suíte de widget não tem como
          # cobrir sem montar a mesa cinquenta vezes.
          exige mesac1     test/casca/mesa_treino_alvos_reais_test.dart
          exige disposicao test/cartas/disposicao_da_mao_test.dart
          # OS 29-C6 — A ÂNCORA EXTERNA DAS PROVAS VISUAIS DA CARTA OBRIGATÓRIA.
          #
          # `cascaaud` e `mesac1` se guardam MUTUAMENTE desde a OS 29-C4, e a
          # OS 29-C5 deu às duas metades a mesma força. Sobrou o residual C10:
          # esvaziar as duas metades no MESMO commit e realinhar o digest que
          # sobra sai VERDE, com o placar da árvore íntegra. Não é defeito de
          # nenhuma das duas — guarda mútua de dois nós não tem âncora fora de
          # si.
          #
          # `ancoravis` é o terceiro nó. Ele carrega cópia PRÓPRIA das listas de
          # casos, das declarações exigidas, das agulhas, dos pisos e dos
          # digests do código das duas metades; e lê a EVIDÊNCIA desta execução
          # — o carimbo acima, os marcadores de saída e os logs de `cascaaud` e
          # `mesac1`, que a esta altura já existem. Por isso ele vem DEPOIS das
          # duas, e não antes.
          exige ancoravis  test/casca/ancora_provas_visuais_test.dart
          # O VÍNCULO DE CONTEÚDO DA PRÓPRIA ÂNCORA.
          #
          # Uma âncora que só é obrigatória não é âncora: esvaziá-la sairia
          # verde com o placar de zero caso. Estas três declarações são o que a
          # prende, e cada uma fecha um gesto diferente:
          #
          #   * ANCORA_DIGEST reprova QUALQUER edição da âncora que não passe
          #     por aqui — inclusive esvaziá-la mantendo os nomes;
          #   * ANCORA_PISO reprova a âncora que roda e não prova, porque o
          #     número conferido é o placar REAL do executor, lido do log dela;
          #   * e a própria âncora afirma, em Dart, que estas três linhas
          #     continuam VIVAS e com estes valores. Baixar o piso aqui reprova
          #     lá; esvaziar a âncora lá derruba o placar aqui. Nenhum dos dois
          #     gestos se basta, e é essa a diferença entre uma âncora e um
          #     digest que se realinha.
          #
          # E o digest tem DOIS donos, de propósito. Um digest com um dono só é
          # um digest que se realinha: quem esvazia a âncora atualiza a linha
          # aqui no mesmo commit e segue — foi exatamente esse gesto que a OS
          # 29-C5 registrou como residual C10, um degrau abaixo. O segundo dono
          # é o CONTRATO desta autoridade, que é prosa revisável e não código
          # que ninguém lê. Os dois têm de dizer o mesmo número.
          ANCORA_ARQUIVO=app/test/casca/ancora_provas_visuais_test.dart
          ANCORA_CONTRATO=docs/ANCORA-PROVAS-VISUAIS-CARTA-OBRIGATORIA-V1.md
          ANCORA_DIGEST=02ebf8be2ccf0fa91b78dda8eb8e7770266249b8c96f7db8f94c47a64225e292
          ANCORA_PISO=22
          d=$(tr -d "\r" < "$ANCORA_ARQUIVO" | sha256sum | cut -d" " -f1)
          if [ "$d" != "$ANCORA_DIGEST" ]; then
            echo "ÂNCORA ALTERADA: digest $d, declarado $ANCORA_DIGEST" | tee -a t_ancoravis.log
            echo 1 > exit_ancoravis
          fi
          c=$(grep -oE "^ancora-digest: [0-9a-f]{64}$" "$ANCORA_CONTRATO" | tail -1 | sed "s/.*: //")
          if [ "$c" != "$ANCORA_DIGEST" ]; then
            echo "CONTRATO DIVERGE: contrato $c, alvo $ANCORA_DIGEST" | tee -a t_ancoravis.log
            echo 1 > exit_ancoravis
          fi
          n=$(grep -oE "\+[0-9]+: All tests passed!" t_ancoravis.log | grep -oE "[0-9]+" | tail -1)
          if [ -z "$n" ] || [ "$n" -lt "$ANCORA_PISO" ]; then
            echo "ÂNCORA ABAIXO DO PISO: placar '$n', piso $ANCORA_PISO" | tee -a t_ancoravis.log
            echo 1 > exit_ancoravis
          fi
          # OS 29-C7 — A AUTORIDADE EXTERNA DA PROPRIA ANCORA.
          #
          # A OS 29-R5 mediu o residual que a C6 deixou: esvaziar a ancora,
          # recarimbar os DOIS donos do digest (este arquivo e o contrato dela) e
          # baixar `ANCORA_PISO` para 1 sai VERDE. Os tres numeros que decidem o
          # que a ancora e moram todos nos arquivos que o gesto ja esta tocando.
          #
          # `autancora` e o quarto no. Ele carrega copia PROPRIA do caminho
          # canonico da ancora, do piso de casos, da relacao NOMINAL dos casos e do
          # digest do CODIGO dela — e nenhum desses numeros e calculado a partir do
          # alvo que ele verifica. Esvaziar a ancora reprova aqui mesmo depois de
          # recarimbar `ANCORA_DIGEST` e o contrato, porque o que ele confere e o
          # conteudo, e nao o carimbo.
          #
          # E a ancora guarda esta autoridade de volta, com o mesmo rigor: remover,
          # neutralizar ou recarimbar `autancora` reprova em `ancoravis`, no laco
          # de arquivos obrigatorios do `build.yml` e nas linhas vivas abaixo.
          exige autancora  test/casca/autoridade_ancora_visual_test.dart
          AUTORIDADE_ARQUIVO=app/test/casca/autoridade_ancora_visual_test.dart
          AUTORIDADE_CONTRATO=docs/AUTORIDADE-EXTERNA-ANCORA-VISUAL-V1.md
          AUTORIDADE_DIGEST=ae604af3652b97e7b4957bfaaee8205ac2b1d877cc879a1b7b8142b1e1acc29a
          AUTORIDADE_PISO=20
          da=$(tr -d "\r" < "$AUTORIDADE_ARQUIVO" | sha256sum | cut -d" " -f1)
          if [ "$da" != "$AUTORIDADE_DIGEST" ]; then
            echo "AUTORIDADE ALTERADA: digest $da, declarado $AUTORIDADE_DIGEST" | tee -a t_autancora.log
            echo 1 > exit_autancora
          fi
          ca=$(grep -oE "^autoridade-digest: [0-9a-f]{64}$" "$AUTORIDADE_CONTRATO" | tail -1 | sed "s/.*: //")
          if [ "$ca" != "$AUTORIDADE_DIGEST" ]; then
            echo "CONTRATO DIVERGE: contrato $ca, alvo $AUTORIDADE_DIGEST" | tee -a t_autancora.log
            echo 1 > exit_autancora
          fi
          na=$(grep -oE "\+[0-9]+: All tests passed!" t_autancora.log | grep -oE "[0-9]+" | tail -1)
          if [ -z "$na" ] || [ "$na" -lt "$AUTORIDADE_PISO" ]; then
            echo "AUTORIDADE ABAIXO DO PISO: placar '$na', piso $AUTORIDADE_PISO" | tee -a t_autancora.log
            echo 1 > exit_autancora
          fi
          # Gerador de evidência visual: roda e é reportado, mas NÃO entra no
          # portão, por decisão registrada no cabeçalho do próprio arquivo — ele
          # produz PNG e depende de fonte do sistema, não afirma regressão.
          ( cd app_build && flutter test test/colecoes/evidencias_visuais_test.dart ) 2>&1 | tee t_colevid.log; echo ${PIPESTATUS[0]} > info_colevid

      - name: "3a — codebase BILLING (functions-billing), sem emulador"
        run: |
          set +e
          if [ ! -d functions-billing ]; then echo "diretorio functions-billing ausente" > nao_billing; exit 0; fi
          ( cd functions-billing && npm test ) 2>&1 | tee t_billing.log; echo ${PIPESTATUS[0]} > exit_billing

      - name: "3b — codebase TORNEIOS (functions), typecheck"
        run: |
          set +e
          if [ ! -f functions/package.json ]; then echo "functions/package.json ausente" > nao_torneiosfn; exit 0; fi
          ( cd functions && npm ci 2>&1 | tail -3 || npm install 2>&1 | tail -3 )
          ( cd functions && npx tsc --noEmit ) 2>&1 | tee t_torneiosfn.log; echo ${PIPESTATUS[0]} > exit_torneiosfn

      - name: "3e — codebase RANKING (functions-ranking), tsc + unitários"
        run: |
          set +e
          if [ ! -f functions-ranking/package.json ]; then
            echo "functions-ranking/package.json ausente" > nao_rankingfn; exit 0
          fi
          ( cd functions-ranking && npm ci 2>&1 | tail -3 || npm install 2>&1 | tail -3 )
          # `npm test` deste codebase JÁ compila antes de rodar (`tsc && node --test`),
          # então este passo cobre typecheck e suíte de uma vez. As regras do
          # bloco de Ranking são provadas no passo 3c, contra o emulador.
          ( cd functions-ranking && npm test ) 2>&1 | tee t_rankingfn.log; echo ${PIPESTATUS[0]} > exit_rankingfn

      - name: "3f — codebase RANKING: integração contra o Firestore (emulador)"
        run: |
          set +e
          # FECHA A LACUNA QUE A OS ANTERIOR DECLAROU. O passo 3e prova a lógica
          # pura; este prova o que só o banco prova: transação, idempotência por
          # id de documento, concorrência (lost update) e paginação por cursor.
          #
          # Separado do 3d de propósito: o unitário não pode passar a exigir
          # emulador, senão deixa de rodar na máquina de quem está escrevendo.
          if [ ! -f functions-ranking/test/integracao.emulador.test.js ]; then
            echo "suíte de integração ausente" > nao_rankingint; exit 0
          fi
          npm i -g firebase-tools 2>&1 | tail -2
          ( cd functions-ranking && npx tsc ) 2>&1 | tail -3
          # Do mesmo lugar que o passo 3c: a raiz, onde mora o firebase.json.
          firebase emulators:exec --only firestore --project demo-bmv \
            "cd functions-ranking && node --test test/integracao.emulador.test.js" \
            2>&1 | tee t_rankingint.log
          echo ${PIPESTATUS[0]} > exit_rankingint

      - name: "3c — codebase SOCIAL (functions-social): dominio Dart, typecheck e testes puros"
        run: |
          set +e
          if [ ! -f functions-social/package.json ]; then
            echo "functions-social/package.json ausente" > nao_socialfn; exit 0
          fi
          ( cd functions-social && npm ci 2>&1 | tail -3 || npm install 2>&1 | tail -3 )
          # `flutter pub get` em app/ ANTES do build:domain: `dart compile js`
          # precisa da resolucao de pacotes da arvore real, e nao do scaffold.
          ( cd app && flutter pub get 2>&1 | tail -2 )
          # A ordem importa, como nos outros codebases: o dominio Dart vira JS
          # antes do tsc, que compila contra ele. Este passo tambem e o que deixa
          # o codebase `social` CARREGAVEL pelo emulador do passo 3d — sem ele o
          # Emulator Suite falharia ao montar a Function.
          ( cd functions-social && npm run build:domain ) 2>&1 | tee t_socialdom.log
          echo ${PIPESTATUS[0]} > exit_socialdom
          ( cd functions-social && npm test ) 2>&1 | tee t_socialfn.log
          echo ${PIPESTATUS[0]} > exit_socialfn

      - name: "3d — Functions SOCIAIS contra o Emulator Suite (chamadas reais)"
        run: |
          set +e
          # Este gate existe porque a suite de regras, sozinha, NAO prova
          # idempotencia, concorrencia nem ausencia de UID nas RESPOSTAS. O runner
          # `com-functions.js` falha se o emulador de Functions nao estiver
          # atendendo, para que "verde" nunca signifique "pulado".
          if [ ! -f functions-social/lib/index.js ]; then
            echo "functions-social nao foi compilado no passo 3c" > nao_socialemu; exit 0
          fi
          npm i -g firebase-tools 2>&1 | tail -2
          ( cd firebase/testes && npm install 2>&1 | tail -3 )
          firebase emulators:exec --only firestore,auth,functions:social --project demo-bmv \
            "cd firebase/testes && npm run test:social:functions" 2>&1 | tee t_socialemu.log
          echo ${PIPESTATUS[0]} > exit_socialemu

      - name: "3f2 — INTEGRACAO IDENTIDADE x RANKING contra o emulador"
        run: |
          set +e
          # O GATE DA OS DE INTEGRACAO DE IDENTIDADE. Os passos 3c/3d provam o
          # social sozinho e os 3e/3f provam o ranking sozinho — com identidade de
          # FIXTURE dos dois lados. Este prova as DUAS IMPLEMENTACOES JUNTAS:
          # `garantirIdentidade` de functions-social emitindo, e
          # `processarResultadoOficial` de functions-ranking consumindo.
          #
          # E o unico lugar onde a concorrencia do §7 e testavel: seis chamadas
          # simultaneas para um jogador sem identidade tem que convergir para UM
          # publicId. Chamada sequencial nao cobre isso.
          if [ ! -f functions-social/test/integracao.identidade.emulador.test.js ]; then
            echo "suite de integracao de identidade ausente" > nao_identint; exit 0
          fi
          if [ ! -f functions-social/lib/index.js ]; then
            echo "functions-social nao foi compilado no passo 3c" > nao_identint; exit 0
          fi
          if [ ! -f functions-ranking/lib/firestore.js ]; then
            echo "functions-ranking nao foi compilado no passo 3e" > nao_identint; exit 0
          fi
          npm i -g firebase-tools 2>&1 | tail -2
          firebase emulators:exec --only firestore --project demo-bmv \
            "cd functions-social && node --test test/integracao.identidade.emulador.test.js" \
            2>&1 | tee t_identint.log
          echo ${PIPESTATUS[0]} > exit_identint

      - name: "3f3 — AUDITORIA de identidade em dry-run (read-only)"
        run: |
          set +e
          # §15 da OS de integracao: a ferramenta de auditoria tem que RODAR, e a
          # primeira execucao e obrigatoriamente dry-run. Aqui ela roda contra um
          # emulador vazio — o que se prova nao e "achou algo", e sim que a
          # ferramenta executa de ponta a ponta e que o portao a exercita.
          #
          # NAO usa --falhar-se-critico: banco vazio nao tem critico, e transformar
          # este passo em portao de CONTEUDO faria um dado legado real derrubar o
          # CI de uma branch que nao tem nada a ver com ele.
          if [ ! -f functions-social/scripts/auditar-identidade.js ]; then
            echo "runner da auditoria ausente" > nao_auditident; exit 0
          fi
          npm i -g firebase-tools 2>&1 | tail -2
          firebase emulators:exec --only firestore --project demo-bmv \
            "cd functions-social && node scripts/auditar-identidade.js" \
            2>&1 | tee t_auditident.log
          echo ${PIPESTATUS[0]} > exit_auditident

      - name: "3g — codebase COLECOES: regras + Functions no Emulator Suite"
        run: |
          set +e
          # Caminho FIXO do harness de segurança. Ele não fica em
          # `<dir>/emulator-tests` nem em `functions/package.json`: fica em
          # firebase/testes/. Procurar pelos dois padrões antigos reportava
          # "sem harness" para um harness que existe — erro de descoberta, que
          # esta versão elimina.
          if [ ! -f firebase/testes/package.json ]; then
            echo "firebase/testes/package.json ausente" > nao_regras; exit 0
          fi
          if [ ! -f firebase.json ]; then
            echo "firebase.json ausente na raiz" > nao_regras; exit 0
          fi
          npm i -g firebase-tools 2>&1 | tail -2
          ( cd firebase/functions && npm install 2>&1 | tail -3 )
          ( cd firebase/testes && npm install 2>&1 | tail -3 )
          # `--project demo-bmv` mantém tudo no emulador: nenhum projeto real é
          # tocado e não é preciso credencial.
          # `test:integrado`, e não `npm test`: o alvo curto roda só segurança +
          # moderação + social, e deixava rastreabilidade e ranking fora do
          # portão. Os CINCO blocos precisam ser provados no MESMO
          # firestore.rules, que é justamente onde um bloco novo poderia
          # afrouxar o do vizinho — e social e ranking são os dois que falam de
          # `publicId`, então separá-los esconderia a regressão que a OS de
          # integração de identidade existe para impedir.
          firebase emulators:exec --only firestore,auth,functions --project demo-bmv \
            "cd firebase/testes && npm run test:integrado" 2>&1 | tee t_regras.log
          echo ${PIPESTATUS[0]} > exit_regras

      - name: Publicar evidência na branch ci-evidencias
        if: always()
        run: |
          RUN="${{ github.run_number }}"; SHA="${{ github.sha }}"; BR="${{ github.ref_name }}"
          EV="run-${RUN}.md"
          GATES="analyze motor resil encerr torneios mtorneios integr colarte colfire colkit social casca cascaaud perfilvis mesacar mesaa11y mesac1 disposicao ancoravis autancora billing torneiosfn socialdom socialfn socialemu rankingfn rankingint identint auditident regras"
          # Mesma declaração do veredito. Cada passo é um shell próprio, então
          # ela se repete — e a conferência que impede as duas de divergirem
          # mora no veredito, que é quem reprova.
          OBRIGATORIOS="mesacar mesaa11y mesac1 disposicao ancoravis autancora"
          {
            echo "# Evidência CI — run ${RUN}"
            echo
            echo "- branch: \`${BR}\`"
            echo "- commit: \`${SHA}\`"
            echo "- data UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## Resultado por gate"
            echo
            echo "| gate | status | exit |"
            echo "|---|---|---|"
            for k in $GATES; do
              if [ -f "exit_$k" ]; then
                v=$(cat "exit_$k")
                [ "$v" = "0" ] && echo "| $k | EXECUTADO | $v |" || echo "| $k | **FALHOU** | $v |"
              elif [ -f "nao_$k" ]; then
                case " $OBRIGATORIOS " in
                  *" $k "*) echo "| $k | **FALHOU (OBRIGATÓRIO, NÃO EXECUTOU)** | $(cat "nao_$k") |" ;;
                  *) echo "| $k | NÃO EXECUTADO | $(cat "nao_$k") |" ;;
                esac
              else
                case " $OBRIGATORIOS " in
                  *" $k "*) echo "| $k | **FALHOU (OBRIGATÓRIO, NÃO EXECUTOU)** | passo não chegou a rodar |" ;;
                  *) echo "| $k | NÃO EXECUTADO | passo não chegou a rodar |" ;;
                esac
              fi
            done
            if [ -f info_colevid ]; then
              echo
              echo "Fora do portão: \`evidencias_visuais\` exit \`$(cat info_colevid)\` (gerador de PNG)."
            fi
            echo
            echo "## flutter analyze (tail)"; echo '```'; tail -n 40 analyze.log 2>/dev/null; echo '```'
            for k in $GATES; do
              [ -f "t_$k.log" ] || continue
              echo "## $k (tail)"; echo '```'; tail -n 25 "t_$k.log"; echo '```'
            done
          } > "$EV"
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" evrepo
          cd evrepo
          git config user.email "ci@bmv.local"
          git config user.name "CI BMV Evidencias"
          if git ls-remote --exit-code origin ci-evidencias >/dev/null 2>&1; then
            git fetch --depth 1 origin ci-evidencias && git checkout -B ci-evidencias FETCH_HEAD
          else
            git checkout --orphan ci-evidencias && git rm -rf . >/dev/null 2>&1 || true
          fi
          cp "../$EV" .
          git add "$EV"
          git commit -m "ci(evidencia): run ${RUN} (${BR} @ ${SHA})"
          git push origin ci-evidencias

      - name: Portão verde/vermelho (gate que falhou, e gate OBRIGATÓRIO que não rodou)
        if: always()
        run: |
          # A lista do veredito mora numa variável, e não literal no `for`, para
          # que a conferência lá embaixo leia a MESMA lista que o laço percorre.
          LISTA="analyze motor resil encerr torneios mtorneios integr colarte colfire colkit social casca cascaaud perfilvis mesacar mesaa11y mesac1 disposicao ancoravis autancora billing torneiosfn socialdom socialfn socialemu regras"

          # GATES QUE NÃO PODEM DEIXAR DE EXECUTAR.
          #
          # O laço trata "não executou" como neutro, e isso é deliberado para a
          # maior parte da lista: alvos de emulador e de Node dependem de
          # serviço externo, e um passo que nem chegou a rodar não é evidência
          # de regressão do código.
          #
          # Só que o mesmo tratamento abre um buraco por onde cabe a suíte
          # inteira. `exige` já fecha metade dele — arquivo ausente vira exit 1
          # —, mas sobram dois caminhos: o marcador de execução não ser escrito,
          # e o passo não chegar a rodar. Nos dois a chave sai como NÃO
          # EXECUTADO, e NÃO EXECUTADO não soma no `fail`. Para as chaves
          # listadas aqui, ausência é FALHA nos TRÊS caminhos.
          #
          # Este é o mesmo mecanismo aprovado na OS 12.1-C1 para `torneiosa11y`,
          # e de propósito não é outro: um segundo agregador, com outra lista e
          # outro runner, seria uma segunda autoridade sobre o mesmo veredito.
          OBRIGATORIOS="mesacar mesaa11y mesac1 disposicao ancoravis autancora"
          obrigatorio() {
            case " $OBRIGATORIOS " in *" $1 "*) return 0 ;; *) return 1 ;; esac
          }

          fail=0
          for k in $LISTA; do
            if [ -f "exit_$k" ]; then
              v=$(cat "exit_$k"); echo "gate $k = $v"
              [ "$v" = "0" ] || fail=1
            elif [ -f "nao_$k" ]; then
              if obrigatorio "$k"; then
                echo "gate $k = NÃO EXECUTADO ($(cat "nao_$k")) — OBRIGATÓRIO: portão VERMELHO"
                fail=1
              else
                echo "gate $k = NÃO EXECUTADO ($(cat "nao_$k"))"
              fi
            else
              if obrigatorio "$k"; then
                echo "gate $k = NÃO EXECUTADO (passo não chegou a rodar) — OBRIGATÓRIO: portão VERMELHO"
                fail=1
              else
                echo "gate $k = NÃO EXECUTADO (passo não chegou a rodar)"
              fi
            fi
          done

          # Declarar uma chave obrigatória não vale nada se ela puder sair do
          # laço. Sem esta conferência, apagar `mesac1` de `LISTA` faria o gate
          # deixar de ser conferido EM SILÊNCIO — o mesmo defeito que o bloco
          # acima fecha, só que uma camada acima.
          for k in $OBRIGATORIOS; do
            case " $LISTA " in
              *" $k "*) ;;
              *) echo "ERRO: gate obrigatório $k não está na lista do veredito"; fail=1 ;;
            esac
          done

          echo "resultado: $([ $fail -eq 0 ] && echo VERDE || echo VERMELHO)"
          exit $fail
