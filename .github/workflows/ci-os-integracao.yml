name: CI OS Integração (analyze + suítes + codebases Firebase)

# Autoridade de validação da OS "Integração Final Backend ↔ Flutter".
#
# Escopo (executa "quando aplicável", nunca afrouxa teste para ficar verde):
#   1. flutter analyze  (erro é fatal; warning/info não)
#   2. flutter test — Motor de Partidas, encerramento, torneios, integração,
#      coleções/Kit Pioneiros e domínio social
#   3. as codebases Firebase, cada uma descoberta pelo próprio caminho:
#        colecoes  -> firebase/functions   + regras em firebase/testes (emulador)
#        billing   -> functions-billing    (node --test, sem emulador)
#        torneios  -> functions            (tsc --noEmit)
#        ranking   -> functions-ranking    (tsc + node --test)
#        social    -> functions-social     (dart compile js + tsc + node --test,
#                                           e um passo PRÓPRIO de Emulator Suite
#                                           com chamadas reais às callables)
#        moderacao -> functions-moderacao  (passo PRÓPRIO de Emulator Suite, pelo
#                                           wrapper `emulador:moderacao`, que faz
#                                           o próprio build)
#      As regras rodam por `test:integrado`, que prova os blocos de
#      firestore.rules cobertos por suíte no MESMO arquivo.
#
# TRÊS SUÍTES FIREBASE SÃO PROTEGIDAS PELO CI, cada uma com passo próprio e
# bloqueante: SOCIAL (`socialemu`), MODERAÇÃO (`moderacaoemu`) e COLEÇÕES +
# REGRAS (`colecoesemu`). Sequenciais de propósito — as três disputam as MESMAS
# portas e o MESMO projectId `demo-bmv` do Emulator Suite, e duas execuções
# sobrepostas não se revezam: sobem pela metade.
#
# ESSES TRÊS SÃO OS GATES OBRIGATÓRIOS, e desde a OS "CI fail-closed dos gates de
# emulador" eles são FAIL-CLOSED: o portão final só fica VERDE se cada um dos três
# tiver deixado um recibo válido de sucesso. Ausência de recibo, recibo vazio,
# conteúdo que não seja um exit code, ou qualquer exit diferente de zero reprovam.
# Ausência de evidência de sucesso NÃO é sucesso. A política mora inteira no passo
# "Portão verde/vermelho", no fim deste arquivo.
#
# NOTA DE COMPOSIÇÃO DA RC. Este arquivo é a UNIÃO de duas linhagens que
# evoluíram em paralelo sobre a mesma base: a de identidade/ranking, que
# acrescentou os passos `rankingfn`, `rankingint`, `identint` e `auditident` e
# trocou o alvo do gate de regras por `test:integrado`; e a do fail-closed, que
# acrescentou o gate `moderacaoemu` e a política de recibo obrigatório. Nenhuma
# das duas perdeu passo na união. O gate que se chamava `regras` passou a
# chamar-se `colecoesemu` (mesmo passo, mesmo comando, mesma suíte) para que os
# três obrigatórios se leiam como um conjunto no portão final.
#
# NENHUM GATE FOI REMOVIDO NEM AFROUXADO por estas adições (OS Identidade Pública
# §38, OS Política Competitiva, OS de integração de identidade). Os gates de
# social são: `social` (domínio Dart), `socialdom` (o bundle do domínio compila),
# `socialfn` (typecheck + testes puros do codebase) e `socialemu` (Functions
# reais no emulador). Os de ranking são `rankingfn` e `rankingint`. As Rules dos
# dois blocos entram no gate `colecoesemu` que já existia, porque
# `firebase/testes/npm run test:integrado` passou a incluir `social.test.js` e
# `ranking.test.js` no MESMO arquivo de regras.
#
# A OS DE INTEGRAÇÃO DE IDENTIDADE acrescentou dois gates, e nenhum substitui os
# de cima: `identint` roda as DUAS implementações juntas (emissão social +
# consumo competitivo, e a concorrência de seis chamadas simultâneas para um
# jogador sem identidade), e `auditident` exercita a auditoria de legado em
# dry-run. Os gates existentes provam cada lado sozinho, com identidade de
# fixture — que é uma afirmação sobre o que o vizinho produz, e não a coisa.
#
# REGRA DURA DE HONESTIDADE: nada aqui pode sair como NÃO EXECUTADO por erro de
# descoberta. Cada codebase tem caminho FIXO, declarado abaixo; se o caminho
# existe e mesmo assim não roda, o motivo é impresso e o gate falha. NÃO
# EXECUTADO é reservado a ausência real do artefato.
#
# Evidência (logs + exit codes + NÃO EXECUTADOs) é publicada na branch
# `ci-evidencias`, auditável mesmo sem acesso à API do GitHub.
#
# A OS DE BLINDAGEM DO CI (composição Perfil + Mesa Online + Ranking Real V2)
# corrigiu três defeitos deste arquivo, e nenhum gate foi removido ou afrouxado:
#
#   CI-01  Doze suítes Flutter verdes localmente não tinham gate: as seis de
#          Mesa Online/Casca V2, as cinco de Ranking/Perfil Publicável e a da
#          composição. Agora cada arquivo tem log e exit code próprios, e
#          arquivo ausente vira `nao_<gate>`, que REPROVA.
#   CI-02  `rankingfn`, `rankingint`, `identint` e `auditident` constavam da
#          evidência, rodavam de verdade, e o agregador final não os percorria:
#          podiam falhar com o portão verde. A causa era haver DUAS listas
#          escritas à mão neste YAML — 23 gates na evidência, 19 no portão.
#   CI-03  "NÃO EXECUTADO" contava como sucesso para gate obrigatório, e um
#          exit code vazio ou ilegível também.
#
# A correção tirou a relação e a decisão de dentro do YAML:
#   scripts/ci/gates_os_integracao.txt  — fonte ÚNICA dos gates obrigatórios,
#                                          lida pela evidência E pelo portão.
#   scripts/ci/portao_os_integracao.sh  — o agregador, que falha fechado.
#   scripts/ci/teste_portao_os_integracao.sh — matriz do próprio agregador,
#                                          registrada como o gate `portaoci`.
# É PROIBIDO reintroduzir uma lista de gates neste arquivo: o caso I5 do teste
# do portão reprova exatamente isso.
#
# NÃO gera APK, NÃO faz deploy, NÃO roda em main/master/consolidacao.

on:
  push:
    branches:
      - integracao/os-final-backend-flutter
      - correcao/ci-composicao-perfil-mesa-ranking-v2-v1
      - correcao/bmv-pub-c1-d1-c4-w1-proveniencia-github-actions-v1
      - composicao/bmv-pub-c1-comp1-candidata-play-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `fetch-depth: 0` é exigência do gate `composloja`, e não conforto:
          # provar que as DUAS folhas de origem são ancestrais do HEAD só é
          # possível com histórico. Num clone raso o `merge-base` responde
          # "não é ancestral" para QUALQUER commit — e o gate reprova de
          # propósito nesse caso, em vez de ficar verde onde não pode medir.
          fetch-depth: 0

      - name: "0 — teste do PRÓPRIO portão (agregador + fonte única)"
        run: |
          set +e
          # O CARIMBO DESTE RUN, escrito antes de qualquer log existir. É por
          # ele que `verificar_contrato_suites.sh` distingue evidência PRODUZIDA
          # aqui de evidência remanescente de outra execução: um `t_<gate>.log`
          # mais velho que este arquivo não é evidência deste run.
          date -u +%Y-%m-%dT%H:%M:%SZ > carimbo_execucao
          echo "run ${{ github.run_id }} / ${{ github.run_number }} @ ${{ github.sha }}" >> carimbo_execucao
          # O agregador era a única peça do CI que ninguém verificava — e era
          # justamente onde moravam CI-02 e CI-03. Roda primeiro, antes de
          # Flutter e de emulador: um portão quebrado tem que aparecer como
          # portão quebrado, e não como "os testes passaram".
          if [ ! -f scripts/ci/teste_portao_os_integracao.sh ]; then
            echo "scripts/ci/teste_portao_os_integracao.sh ausente" > nao_portaoci; exit 0
          fi
          # A EVIDÊNCIA ANTERIOR MORRE ANTES DA EXECUÇÃO (OS 40-C5). Log e
          # marcador que sobrevivam ao checkout não podem ser confundidos com o
          # que esta corrida produziu, e `atime` não serve de prova: a FASE A
          # ABRE o log durante as próprias leituras, então acesso não é execução.
          rm -f t_portaoci.log exit_portaoci
          bash scripts/ci/teste_portao_os_integracao.sh 2>&1 | tee t_portaoci.log
          echo ${PIPESTATUS[0]} > exit_portaoci

      - name: "0a — AUTORIDADE EXTERNA dos três verificadores materiais"
        run: |
          set +e
          # A terceira peça do passo zero, e a que faltava. `portaoci` prova o
          # AGREGADOR, `contratosui` prova o VERIFICADOR DE CONTEÚDO — e as três
          # peças que DECIDEM (o verificador de conteúdo, o agregador e o
          # analisador léxico) não tinham digest próprio, inventário próprio nem
          # prova de que suas decisões materiais continuam lá. A OS 40-R4 mediu
          # o custo em V04, V06 e V06+E01: piso removido do mapa, comparação
          # neutralizada e declaração movida para heredoc conservavam a cadeia
          # oficial inteiramente verde.
          #
          # Roda ANTES do contrato de conteúdo: um verificador adulterado tem de
          # aparecer como verificador adulterado, e não como "as suítes passaram".
          #
          # [OS 40-C5] A OS 40-R5 retirou ESTA execução e pôs no lugar um log de
          # uma linha e um `exit_autverif` com zero dentro. A cadeia oficial
          # inteira ficou verde — `portaoci` 53/53, FASE A exit 0, agregador
          # 64/64, FASE B 17 contratos — sem que a autoridade rodasse. A linha
          # abaixo é agora congelada por `guarda_invocacao_passo_zero`, cobrada
          # em dois lugares do caminho oficial (o passo `0` e a FASE A), e a
          # purga logo acima dela impede que evidência de outra corrida seja
          # confundida com a desta.
          if [ ! -f scripts/ci/autoridade_verificadores.sh ]; then
            echo "scripts/ci/autoridade_verificadores.sh ausente" > nao_autverif; exit 0
          fi
          rm -f t_autverif.log exit_autverif
          bash scripts/ci/autoridade_verificadores.sh . .github/workflows/ci-os-integracao.yml 2>&1 | tee t_autverif.log
          echo ${PIPESTATUS[0]} > exit_autverif

      - name: "0p — PROVENIÊNCIA EXTERNA: materializa a autoridade fora do checkout"
        env:
          BMV_PROV_FONTE_REPO: ${{ vars.BMV_PROV_FONTE_REPO }}
          BMV_PROV_FONTE_REF: ${{ vars.BMV_PROV_FONTE_REF }}
          BMV_PROV_TOKEN: ${{ secrets.BMV_PROV_TOKEN }}
        run: |
          # [BMV-PUB-C1-D1-C4-W1] A C4 tornou o `contratosui` dependente de dois
          # insumos que NAO moram nesta arvore: o pacote AUTH1-R2 extraido
          # (BMV_PROV_AUTORIDADE) e o registro dos pares (BMV_PROV_REGISTRO) —
          # 39 na W1; 66 desde a PROV2 da COMP1 (`proveniencia-esperada-e12.tsv`).
          # Este passo so os ENTREGA ao runner. Quem decide continua sendo a
          # proveniencia obrigatoria da C4, que reconfere tudo por pino.
          #
          # A origem e externa a candidata: o repositorio e o commit vem de
          # `vars.*` e a credencial de `secrets.*`, configurados fora da arvore.
          # Nada e copiado para dentro de $GITHUB_WORKSPACE, nada e gerado a
          # partir da copia legivel que mora na arvore, e nenhuma falha vira
          # aviso: qualquer divergencia derruba o job AQUI, antes dos gates.
          set -euo pipefail
          falha() { echo "PROVENIENCIA EXTERNA: VERMELHO — $*"; exit 1; }

          # Os bytes congelados. Estes pinos so CONFEREM; o registro e o pacote
          # continuam sendo os de fora, e a C4 os reconfere por conta propria.
          PIN_ZIP=63902996df2fe6d975ae16fd5b66465236a614b5d06a98e9e6f8cbf090567bb1
          PIN_REGISTRO=6dcd3419119ca0ebadbd9402c64575599db6f41b3fce69c5a2841729d8f4f687
          PIN_MANIFESTO=048f387e63f6630aaf6660a44eca89c1ed3e158ea346f13c036d2a33d16b8cc4
          PIN_AUTORIDADE=078d1da13c3f16300cd528e93b368920786275641d22ab247897f257213f3bad
          ZIP=BMV-PUB-C1-D1-C3-AUTH1-R2.zip
          REG=proveniencia-esperada-e12.tsv

          # 1. a fonte externa precisa estar provisionada — e por COMMIT, nunca por branch
          [ -n "${BMV_PROV_FONTE_REPO:-}" ] || falha "vars.BMV_PROV_FONTE_REPO nao provisionada"
          [ -n "${BMV_PROV_FONTE_REF:-}" ] || falha "vars.BMV_PROV_FONTE_REF nao provisionada"
          [ -n "${BMV_PROV_TOKEN:-}" ] || falha "secrets.BMV_PROV_TOKEN nao provisionado"
          printf '%s' "$BMV_PROV_FONTE_REPO" | grep -qxE '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+' \
            || falha "vars.BMV_PROV_FONTE_REPO fora da forma dono/repositorio"
          printf '%s' "$BMV_PROV_FONTE_REF" | grep -qxE '[0-9a-f]{40}' \
            || falha "vars.BMV_PROV_FONTE_REF nao e um SHA de commit de 40 hex"

          # 2. o destino mora FORA do checkout da candidata
          [ -n "${RUNNER_TEMP:-}" ] && [ -d "$RUNNER_TEMP" ] || falha "RUNNER_TEMP ausente"
          D="$RUNNER_TEMP/bmv-prov"
          rm -rf "$D"; mkdir -p "$D"
          D="$(cd "$D" && pwd -P)"; WS="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          case "$D/" in "$WS"/*) falha "destino $D mora dentro do checkout $WS" ;; esac

          # 3. o commit externo congelado, buscado pela identidade exata
          git init -q "$D/fonte"
          CAB="$(printf 'x-access-token:%s' "$BMV_PROV_TOKEN" | base64 -w0)"
          echo "::add-mask::$CAB"
          git -C "$D/fonte" -c "http.extraheader=AUTHORIZATION: basic $CAB" \
            fetch -q --no-tags --depth 1 "https://github.com/$BMV_PROV_FONTE_REPO.git" "$BMV_PROV_FONTE_REF" \
            || falha "nao foi possivel obter $BMV_PROV_FONTE_REPO@$BMV_PROV_FONTE_REF"
          unset CAB BMV_PROV_TOKEN
          OBTIDO="$(git -C "$D/fonte" rev-parse --verify 'FETCH_HEAD^{commit}')"
          [ "$OBTIDO" = "$BMV_PROV_FONTE_REF" ] || falha "commit obtido $OBTIDO difere do congelado $BMV_PROV_FONTE_REF"

          # 4. o commit contem EXATAMENTE os dois arquivos, como blobs comuns
          git -C "$D/fonte" ls-tree FETCH_HEAD | awk '{ print $1, $2, $4 }' > "$D/arvore.txt"
          printf '100644 blob %s\n100644 blob %s\n' "$ZIP" "$REG" > "$D/arvore.esperada"
          cmp -s "$D/arvore.txt" "$D/arvore.esperada" \
            || { cat "$D/arvore.txt"; falha "o commit externo nao contem exatamente $ZIP e $REG"; }

          # 5. materializa os BYTES do objeto git, sem checkout e sem filtro de fim de linha
          git -C "$D/fonte" cat-file blob "FETCH_HEAD:$ZIP" > "$D/$ZIP"
          git -C "$D/fonte" cat-file blob "FETCH_HEAD:$REG" > "$D/$REG"
          rm -rf "$D/fonte"
          [ "$(sha256sum "$D/$ZIP" | cut -d' ' -f1)" = "$PIN_ZIP" ] || falha "$ZIP nao e o congelado"
          [ "$(sha256sum "$D/$REG" | cut -d' ' -f1)" = "$PIN_REGISTRO" ] || falha "$REG nao e o congelado"

          # 6. extrai o pacote. O ZIP congelado usa '\' como separador; o unzip
          # do Linux converte e sai 1 (AVISO) com exatamente uma linha dizendo
          # isso. Aceita-se exit 0 ou 1 SO quando toda a saida e esse aviso; e
          # a extracao nunca e prova: o que prova e o passo 7.
          command -v unzip > /dev/null || falha "unzip ausente no runner"
          unzip -Z1 "$D/$ZIP" | tr '\\' '/' | LC_ALL=C sort > "$D/entradas.txt"
          if grep -qE '(^/|(^|/)\.\.(/|$))' "$D/entradas.txt"; then falha "entrada do ZIP fora do destino"; fi
          A="$D/auth1-r2"; mkdir -p "$A"
          set +e
          unzip -o "$D/$ZIP" -d "$A" > "$D/unzip.txt" 2>&1
          UZ=$?
          set -e
          grep -vE '^Archive:|^ +(inflating|extracting|creating): |^warning: +.+ appears to use backslashes as path separators$' "$D/unzip.txt" \
            > "$D/unzip.outros" || true
          if [ "$UZ" -gt 1 ] || [ -s "$D/unzip.outros" ]; then
            cat "$D/unzip.txt"; falha "extracao do pacote falhou (unzip exit $UZ)"
          fi
          echo "extracao: unzip exit $UZ; unica mensagem fora do inventario: aviso de separador '\\'"

          # 7. prova da extracao: conjunto de arquivos == entradas do ZIP ==
          # manifesto + ele mesmo, e cada byte conferido pelo manifesto pinado
          ( cd "$A" && find . -type f | sed 's|^\./||' | LC_ALL=C sort ) > "$D/extraidos.txt"
          cmp -s "$D/entradas.txt" "$D/extraidos.txt" || falha "arquivos extraidos diferem das entradas do ZIP"
          [ "$(sha256sum "$A/MANIFEST-SHA256.txt" | cut -d' ' -f1)" = "$PIN_MANIFESTO" ] || falha "manifesto nao e o congelado"
          { grep -E '^[0-9a-f]{64}  ' "$A/MANIFEST-SHA256.txt" | sed 's/^[0-9a-f]*  //'; echo MANIFEST-SHA256.txt; } \
            | LC_ALL=C sort > "$D/manifestados.txt"
          cmp -s "$D/manifestados.txt" "$D/extraidos.txt" || falha "arquivos extraidos diferem do manifesto"
          ( cd "$A" && grep -E '^[0-9a-f]{64}  ' MANIFEST-SHA256.txt | sha256sum -c --strict --quiet ) \
            || falha "algum arquivo extraido difere do manifesto congelado"
          [ "$(sha256sum "$A/proveniencia/auth1_proveniencia.sh" | cut -d' ' -f1)" = "$PIN_AUTORIDADE" ] \
            || falha "a autoridade de proveniencia nao e a congelada"

          # 8. somente leitura daqui em diante, e entrega aos passos seguintes
          chmod -R a-w "$A" "$D/$REG"
          echo "BMV_PROV_AUTORIDADE=$A" >> "$GITHUB_ENV"
          echo "BMV_PROV_REGISTRO=$D/$REG" >> "$GITHUB_ENV"
          echo "PROVENIENCIA EXTERNA: origem   $BMV_PROV_FONTE_REPO@$OBTIDO"
          echo "PROVENIENCIA EXTERNA: local    $D (fora de $WS)"
          echo "PROVENIENCIA EXTERNA: sha256   $ZIP $PIN_ZIP"
          echo "PROVENIENCIA EXTERNA: sha256   $REG $PIN_REGISTRO"
          echo "PROVENIENCIA EXTERNA: sha256   MANIFEST-SHA256.txt $PIN_MANIFESTO"
          echo "PROVENIENCIA EXTERNA: sha256   proveniencia/auth1_proveniencia.sh $PIN_AUTORIDADE"
          echo "PROVENIENCIA EXTERNA: VERDE — $(wc -l < "$D/extraidos.txt") arquivo(s) da AUTH1-R2 e o registro dos pares materializados e conferidos"

      - name: "0b — teste do VERIFICADOR de contrato das suítes protegidas"
        run: |
          set +e
          # Mesma razão do passo acima, um degrau adiante: o verificador de
          # conteúdo decide se as suítes protegidas ainda PROVAM, e sem esta
          # matriz ele seria a segunda peça do CI que ninguém verifica.
          if [ ! -f scripts/ci/testemunha_contratosui.sh ]; then
            echo "scripts/ci/testemunha_contratosui.sh ausente" > nao_contratosui; exit 0
          fi
          rm -f t_contratosui.log exit_contratosui
          bash scripts/ci/testemunha_contratosui.sh scripts/ci/teste_contrato_suites.sh 2>&1 | tee t_contratosui.log
          echo ${PIPESTATUS[0]} > exit_contratosui

      - name: "0c — CONTRATO DE CONTEÚDO das suítes protegidas (falha fechada)"
        run: |
          # SEM `set +e`, e de propósito. O Actions roda cada `run:` com
          # `bash -e {0}`: se o verificador sair diferente de zero, o passo
          # aborta e o job vai a pique aqui — sem depender de ser somado num
          # portão lá na frente. Um verificador cuja reprovação precisa de
          # outro passo para virar vermelho herda o defeito que veio consertar.
          #
          # FASE A: estática. Roda antes de Flutter, de Node e de emulador,
          # porque uma suíte esvaziada tem de aparecer como suíte esvaziada, e
          # não como "os testes passaram".
          bash scripts/ci/verificar_contrato_suites.sh . .github/workflows/ci-os-integracao.yml

      - name: Setup Java (exigido pelo emulador do Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node (firebase-tools e testes das Functions)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Flutter (versão pinada do build oficial)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8

      - name: Scaffold do projeto Flutter
        run: flutter create --org com.buracomastervip.poc --project-name buraco_master_vip app_build

      # As dependências são as do REPOSITÓRIO, não as que o CI resolver na hora.
      # Antes daqui havia `flutter pub add` + um remendo Python no pubspec para
      # travar o jni: os dois sumiram porque `app/pubspec.yaml` (com
      # `dependency_overrides`) e `app/pubspec.lock` agora são a fonte da verdade.
      - name: Dependências versionadas (pubspec.yaml + pubspec.lock do repo)
        run: |
          cp app/pubspec.yaml app/pubspec.lock app_build/
          cd app_build && flutter pub get

      - name: Overlay do código e dos assets REAIS
        run: |
          cp -R app/lib/. app_build/lib/
          # `-name '*.dart'` excluído de propósito: há .dart soltos versionados
          # dentro de app/assets/ (cópias antigas de tela, que ninguém importa).
          # Copiá-los faria o analyze reprovar por lixo de árvore, não por código
          # nosso. A remoção deles é decisão registrada à parte.
          cd app && find assets -type f ! -name '*.dart' -exec sh -c 'mkdir -p "../app_build/$(dirname "$1")" && cp "$1" "../app_build/$1"' _ {} \;

      - name: Copiar suítes de teste + seeds
        run: |
          mkdir -p app_build/test/torneios/data app_build/test/integracao app_build/test/colecoes/data
          cp -R app/test/. app_build/test/
          cp app/data/torneios/*.json app_build/test/torneios/data/
          cp app/data/colecoes/*.json app_build/test/colecoes/data/
          # O widget_test.dart do scaffold tem erro pré-existente conhecido.
          rm -f app_build/test/widget_test.dart

      - name: "1+2 — analyze + suítes Flutter (captura exit codes sem abortar)"
        run: |
          set +e
          ( cd app_build && flutter analyze --no-fatal-infos --no-fatal-warnings ) 2>&1 | tee analyze.log; echo ${PIPESTATUS[0]} > exit_analyze
          roda() { # roda <chave> <caminho>
            local k="$1" t="$2"
            if [ ! -f "app_build/$t" ]; then echo "ausente: $t" > "nao_$k"; return; fi
