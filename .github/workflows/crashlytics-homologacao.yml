name: Crashlytics — homologação Android

# Workflow de HOMOLOGAÇÃO. Não publica nada: não cria Release do GitHub, não
# sobe nada para a Play Console e não faz deploy de Functions/Rules/Hosting.
# O APK e os símbolos saem como artifact do run, alcançáveis só por quem tem
# acesso ao repositório.
#
# Roda na própria branch, sem merge em main — é o único jeito de uma OS que não
# pode mesclar ter evidência real de CI.
#
# O APK sai assinado com a chave de DEBUG do scaffold. É deliberado: uma build
# de homologação não pode ser instalável como se fosse a de produção, e assim
# nenhum secret de keystore é necessário aqui.

on:
  push:
    branches:
      - claude/crashlytics-android-operacional-v1
  workflow_dispatch:
    inputs:
      armar_crash:
        description: "Compilar com o gatilho de crash de homologação armado"
        type: boolean
        default: false

permissions:
  contents: read

env:
  BMV_APPLICATION_ID: io.github.soniaambrosio.buracomastervip
  BMV_FIREBASE_APP_ID: '1:203886484007:android:b1cd95baa0b9e6e629cc02'

jobs:
  homologacao:
    name: Build de homologação com Crashlytics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # O versionCode determinístico é `git rev-list --count HEAD`, e num
          # clone raso isso vale 1 sempre.
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Mesmo pin do build.yml. "Mesmo commit, outro Flutter" é outro
          # artefato, e o manifesto registra qual foi.
          flutter-version: 3.44.8

      # ---------------------------------------------------------------- gates
      - name: "PORTÃO — Secret do google-services.json"
        env:
          GS_B64: ${{ secrets.BMV_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "${GS_B64}" ]; then
            echo "::error::Secret BMV_GOOGLE_SERVICES_JSON_B64 ausente."
            echo "Firebase Console > app 'Buraco Master VIP Oficial' >"
            echo "baixar google-services.json; depois base64 -w0 e colar em"
            echo "Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Secret presente (${#GS_B64} caracteres de base64)."

      - name: "PORTÃO — o JSON é do app Android oficial"
        env:
          GS_B64: ${{ secrets.BMV_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          mkdir -p /tmp/gs
          printf '%s' "$GS_B64" | tr -d '[:space:]' | base64 -d > /tmp/gs/google-services.json
          test -s /tmp/gs/google-services.json
          dart run app/tool/validar_google_services.dart \
            --json=/tmp/gs/google-services.json \
            --esperado=app/data/observabilidade/firebase_app_oficial.json

      - name: "PORTÃO — identidade da build (SHA, árvore, versionCode)"
        run: |
          dart run app/tool/gate_identidade_build.dart --ambiente=homologacao --sem-artefatos
          dart run app/tool/gate_identidade_build.dart --ambiente=homologacao --defines > /tmp/defines.txt
          echo "BMV_DEFINES=$(tr '\n' ' ' < /tmp/defines.txt)" >> "$GITHUB_ENV"
          echo "BMV_VERSION_CODE=$(grep BMV_VERSION_CODE /tmp/defines.txt | cut -d= -f3)" >> "$GITHUB_ENV"
          echo "BMV_VERSION_NAME=$(grep BMV_VERSION_NAME /tmp/defines.txt | cut -d= -f3)" >> "$GITHUB_ENV"
          cat /tmp/defines.txt

      - name: "PORTÃO — suítes de observabilidade"
        # O overlay é montado aqui de novo, num diretório separado, porque o
        # projeto de build ainda não existe neste ponto — e o portão precisa
        # reprovar ANTES de gastar sete minutos de Gradle.
        run: |
          flutter create --org com.buracomastervip --project-name buraco_master_vip /tmp/suite >/dev/null
          cp -R app/lib/. /tmp/suite/lib/
          mkdir -p /tmp/suite/test/observabilidade
          cp app/test/observabilidade/*.dart /tmp/suite/test/observabilidade/
          # O widget_test.dart do scaffold tem erro pré-existente na base e
          # derrubaria a suíte inteira sem ter nada a ver com esta OS.
          rm -f /tmp/suite/test/widget_test.dart
          cd /tmp/suite
          flutter pub add firebase_core "firebase_crashlytics:5.2.7" firebase_auth \
            "google_sign_in:^6.2.1" audioplayers web_socket_channel shared_preferences >/dev/null

          # `flutter analyze` sai com 1 para QUALQUER apontamento, info
          # inclusive — e o Flutter do CI é mais novo que o local, então uma
          # regra de lint nova aparece aqui primeiro. Mostrar a saída é o que
          # evita um "exit code 1" mudo, cujo log só quem é admin baixa.
          if ! flutter analyze lib/observability > /tmp/analyze.txt 2>&1; then
            cat /tmp/analyze.txt
            echo "::error title=analyze::$(grep -cE '^\s+(error|warning|info)' /tmp/analyze.txt) apontamento(s) em lib/observability"
            exit 1
          fi
          cat /tmp/analyze.txt

          # `--reporter=github` faz o próprio flutter_test emitir as anotações
          # de cada teste que falhar, com nome e arquivo.
          flutter test test/observabilidade --reporter=github

      # ------------------------------------------------------------- montagem
      - name: Scaffold do projeto Android
        run: flutter create --org com.buracomastervip.poc --project-name buraco_master_vip app_build

      - name: Overlay do código
        run: cp -R app/lib/. app_build/lib/

      - name: Copiar e declarar assets
        run: dart run app/tool/preparar_assets.dart --origem=app/assets --projeto=app_build

      - name: Dependências
        # firebase_crashlytics com versão EXATA: o pubspec deste projeto é
        # gerado a cada run, então a restrição é a única trava possível.
        run: |
          cd app_build
          flutter pub add firebase_core "firebase_crashlytics:5.2.7" firebase_auth \
            "google_sign_in:^6.2.1" audioplayers web_socket_channel shared_preferences

      - name: "Instalar google-services.json (via Secret)"
        env:
          GS_B64: ${{ secrets.BMV_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          printf '%s' "$GS_B64" | tr -d '[:space:]' | base64 -d > app_build/android/app/google-services.json
          test -s app_build/android/app/google-services.json
          echo "instalado: $(stat -c%s app_build/android/app/google-services.json) bytes"

      - name: "Remendo do host Android (plugins, applicationId, SDKs)"
        run: |
          dart run app/tool/patch_host_android.dart \
            --projeto=app_build \
            --applicationId="${BMV_APPLICATION_ID}" \
            --versionCode="${BMV_VERSION_CODE}" \
            --versionName="${BMV_VERSION_NAME}"
          echo "===== settings.gradle.kts ====="; cat app_build/android/settings.gradle.kts
          echo "===== app/build.gradle.kts ====="; cat app_build/android/app/build.gradle.kts

      # ---------------------------------------------------------------- build
      - name: Build release APK
        # SEM `--split-debug-info`, e a razão foi MEDIDA num aparelho, não
        # deduzida. Com a flag, o stack trace que chega ao Crashlytics vem
        # VAZIO — a ocorrência aparece no painel sem uma linha de pilha, que é
        # o mesmo que não aparecer. Sem a flag:
        #
        #   #0  GatilhoHomologacao.armarSePedido.<anonymous closure>
        #       (package:buraco_master_vip/observability/gatilho_homologacao.dart:81)
        #
        # Os nomes ficam dentro do binário e o painel os mostra direto, sem
        # etapa de simbolização e sem arquivo de símbolo para casar com a
        # build. Vale o tamanho a mais: um painel legível é o produto inteiro
        # desta OS. Ver docs/CRASHLYTICS-ANDROID-EVIDENCIA-V1.md.
        run: |
          cd app_build
          EXTRA=""
          if [ "${{ inputs.armar_crash }}" = "true" ]; then
            EXTRA="--dart-define=BMV_CRASH_HOMOLOGACAO=true"
            echo "::warning::build ARMADA para crash de homologação — não publicar"
          fi
          flutter build apk --release ${BMV_DEFINES} ${EXTRA}

      - name: "VERIFICAÇÃO — o APK é o que dissemos que é"
        run: |
          APK=app_build/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 | sort | tail -1)
          echo "--- badging ---"
          "$AAPT" dump badging "$APK" | head -3 | tee /tmp/badging.txt
          grep -q "package: name='${BMV_APPLICATION_ID}'" /tmp/badging.txt \
            || { echo "::error::applicationId do APK não é ${BMV_APPLICATION_ID}"; exit 1; }
          grep -q "versionCode='${BMV_VERSION_CODE}'" /tmp/badging.txt \
            || { echo "::error::versionCode do APK não é ${BMV_VERSION_CODE}"; exit 1; }

          echo "--- SHA gravado dentro do binário ---"
          mkdir -p /tmp/apkx && unzip -o -q "$APK" 'lib/*/libapp.so' -d /tmp/apkx
          SO=$(find /tmp/apkx -name libapp.so | head -1)
          grep -a -q "${GITHUB_SHA}" "$SO" \
            || { echo "::error::o SHA ${GITHUB_SHA} não está no libapp.so"; exit 1; }
          echo "OK: ${GITHUB_SHA} presente em $(basename $(dirname $SO))/libapp.so"

          echo "--- Crashlytics realmente empacotado ---"
          # Procurar 'crashlytics' na LISTAGEM do zip dá zero sempre: classe
          # Java não é arquivo dentro do APK, vive dentro de classes*.dex. Um
          # portão escrito assim reprovaria todo build, inclusive o correto.
          unzip -o -q "$APK" 'classes*.dex' -d /tmp/dx
          grep -a -q 'com/google/firebase/crashlytics' /tmp/dx/*.dex \
            && echo "OK: classes do Crashlytics dentro do dex" \
            || { echo "::error::Crashlytics não está no dex — o plugin Gradle não foi aplicado"; exit 1; }

          echo "--- para QUAL app Firebase este APK reporta ---"
          # Esta é a prova que fecha a cadeia: o plugin google-services compila
          # o App ID como recurso. Se aqui vier outro, o APK manda crash para o
          # painel de outro app e ninguém percebe.
          APP_ID_NO_APK=$("$AAPT" dump resources "$APK" | grep -A1 'string/google_app_id' | tail -1 | tr -d ' ()"')
          echo "google_app_id compilado: ${APP_ID_NO_APK}"
          [ "${APP_ID_NO_APK}" = "${BMV_FIREBASE_APP_ID}" ] \
            || { echo "::error::APK reporta para ${APP_ID_NO_APK}, não para ${BMV_FIREBASE_APP_ID}"; exit 1; }

          echo "--- gatilho de homologação ---"
          if grep -a -q "BMV-HOMOLOG-CRASH" "$SO"; then
            echo "build ARMADA (marcador presente)"
          else
            echo "OK: build normal — o marcador NÃO existe no binário"
          fi

      - name: "GATE — manifesto do artefato"
        run: |
          dart run app/tool/gate_identidade_build.dart \
            --ambiente=homologacao \
            --artefato=app_build/build/app/outputs/flutter-apk/app-release.apk \
            --manifesto=app_build/MANIFESTO-BUILD.json
          cat app_build/MANIFESTO-BUILD.json

      - name: Upload do APK e do manifesto
        # Artifact do run, nunca Release pública.
        uses: actions/upload-artifact@v4
        with:
          name: bmv-crashlytics-homologacao
          path: |
            app_build/build/app/outputs/flutter-apk/app-release.apk
            app_build/MANIFESTO-BUILD.json
          if-no-files-found: error
